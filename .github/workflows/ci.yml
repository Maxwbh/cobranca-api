name: Build

on:
  push:
    branches:
      - main
      - "hml/**"
  pull_request:
  schedule:
    - cron: "0 4 * * 0"

permissions:
  contents: read

# Push seguido de push na mesma ref: o run anterior seguia até o fim à toa,
# ocupando runner por um commit que já não é o topo.
#
# `main` fica de fora do cancelamento: o Render faz deploy automático dela
# (`autoDeploy: true`, sem gate de CI), então todo commit que vai para produção
# precisa ter um veredito de teste registrado. Cancelar o run deixaria um
# commit implantado sem resposta sobre a suíte.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12 (exigido pela engine pyCobrança)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # O passo de instalação levava ~19s dos ~70s do job baixando sempre
          # as mesmas rodas. O cache é o do pip (`~/.cache/pip`), não o dos
          # pacotes instalados: o `pip install` continua rodando, mas resolve
          # do disco em vez da rede.
          #
          # A chave sai do hash destes arquivos — precisam ser TODOS os que
          # alimentam o passo de instalação, senão o cache invalida de menos.
          cache: pip
          cache-dependency-path: |
            gateway/requirements.txt
            gateway/requirements-dev.txt
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Validação do Dockerfile, não produção de artefato: nenhum passo daqui
      # roda a imagem (os testes rodam direto no runner) e nada mais a publica.
      # O valor é pegar Dockerfile quebrado antes do Render, que constrói a
      # imagem a partir dele a cada deploy da `main`.
      #
      # Sem `load:`: exportar para o daemon local só fazia sentido para
      # entregar a imagem ao passo de push, que não existe mais.
      - name: Build image (valida o Dockerfile)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          # O cache era `type=registry`, apontando para a tag que este workflow
          # publicava — sem publicação, aquela referência não se renova mais.
          # `type=gha` guarda as camadas no cache do próprio Actions.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install test pre-requisites
        run: |
          pip install -r gateway/requirements.txt -r gateway/requirements-dev.txt
          pip install openapi-spec-validator pyyaml
      - name: Validate OpenAPI specs (Core 3.0 + Gateway 3.1)
        run: |
          python - <<'EOF'
          import sys, yaml
          from openapi_spec_validator.validation import (openapi_v30_spec_validator,
                                                          openapi_v31_spec_validator)

          core = yaml.safe_load(open('docs/openapi.yaml'))
          errs = list(openapi_v30_spec_validator.iter_errors(core))
          for e in errs:
              print('CORE:', '/'.join(map(str, e.absolute_path)), '->', e.message[:160])

          sys.path.insert(0, 'gateway')
          from app.main import app
          gw = app.openapi()
          errs2 = list(openapi_v31_spec_validator.iter_errors(gw))
          for e in errs2:
              print('GATEWAY:', '/'.join(map(str, e.absolute_path)), '->', e.message[:160])

          if errs or errs2:
              sys.exit(1)
          print(f"OK: Core OAS 3.0 valida ({len(core['paths'])} paths) | "
                f"Gateway OAS 3.1 valida ({len(gw['paths'])} paths)")
          EOF
      - name: Postman coverage (endpoint sem BC-xxx quebra o build)
        run: python postman/check_coverage.py
      - name: Test (gateway Python/FastAPI)
        run: cd gateway && PYTHONPATH=. pytest -v
