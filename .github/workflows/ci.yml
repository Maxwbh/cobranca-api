name: Build

on:
  push:
    branches:
      - main
      - "hml/**"
  pull_request:
  # Disparo manual, por branch. `push` e `pull_request` chegam pelo pipeline de
  # EVENTOS do GitHub; quando ele degrada, o commit fica sem veredito e não há o
  # que re-rodar — não existe run para clicar. Já o `workflow_dispatch` entra
  # pela API, então continua funcionando: foi assim que se confirmou, no
  # incidente de 06/08/2026, que runner e execução estavam de pé enquanto os
  # eventos não chegavam.
  #
  # Vale além do incidente: todo CI deveria poder ser rodado à mão sem precisar
  # de commit vazio para forçar evento.
  #
  # Só aparece no seletor se o arquivo estiver no branch DEFAULT — é regra do
  # GitHub, não escolha nossa.
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"

permissions:
  contents: read

# Push seguido de push na mesma ref: o run anterior seguia até o fim à toa,
# ocupando runner por um commit que já não é o topo.
#
# `main` fica de fora do cancelamento: o Render faz deploy automático dela
# (`autoDeploy: true`, sem gate de CI), então todo commit que vai para produção
# precisa ter um veredito de teste registrado. Cancelar o run deixaria um
# commit implantado sem resposta sobre a suíte.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12 (exigido pela engine pyCobrança)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # O passo de instalação levava ~19s dos ~70s do job baixando sempre
          # as mesmas rodas. O cache é o do pip (`~/.cache/pip`), não o dos
          # pacotes instalados: o `pip install` continua rodando, mas resolve
          # do disco em vez da rede.
          #
          # A chave sai do hash destes arquivos — precisam ser TODOS os que
          # alimentam o passo de instalação, senão o cache invalida de menos.
          cache: pip
          cache-dependency-path: |
            gateway/requirements.txt
            gateway/requirements-dev.txt
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Validação do Dockerfile, não produção de artefato: nenhum passo daqui
      # roda a imagem (os testes rodam direto no runner) e nada mais a publica.
      # O valor é pegar Dockerfile quebrado antes do Render, que constrói a
      # imagem a partir dele a cada deploy da `main`.
      #
      # Sem `load:`: exportar para o daemon local só fazia sentido para
      # entregar a imagem ao passo de push, que não existe mais.
      - name: Build image (valida o Dockerfile)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          # O cache era `type=registry`, apontando para a tag que este workflow
          # publicava — sem publicação, aquela referência não se renova mais.
          # `type=gha` guarda as camadas no cache do próprio Actions.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install test pre-requisites
        run: |
          pip install -r gateway/requirements.txt -r gateway/requirements-dev.txt
          pip install openapi-spec-validator pyyaml
      - name: Validate OpenAPI specs (Core 3.0 + Gateway 3.1)
        run: |
          python - <<'EOF'
          import sys, yaml
          from openapi_spec_validator.validation import (openapi_v30_spec_validator,
                                                          openapi_v31_spec_validator)

          bruto = open('docs/openapi.yaml', encoding='utf-8').read()

          # CHAVE DUPLICADA é o defeito mais silencioso possível num YAML
          # escrito à mão: `safe_load` fica com a ÚLTIMA e não avisa. Uma rota
          # ou um schema inteiro pode sumir da doc publicada sem que nada
          # quebre — a spec segue válida, só que menor.
          class _Dup(yaml.SafeLoader):
              pass

          _repetidas = []

          def _mapa(loader, node, deep=False):
              vistas = {}
              for k, _ in node.value:
                  chave = loader.construct_object(k, deep=deep)
                  if chave in vistas:
                      _repetidas.append(f"{chave!r} (linhas {vistas[chave]} e "
                                        f"{k.start_mark.line + 1})")
                  vistas[chave] = k.start_mark.line + 1
              return yaml.SafeLoader.construct_mapping(loader, node, deep)

          _Dup.construct_mapping = _mapa
          core = yaml.load(bruto, _Dup)
          if _repetidas:
              print('CORE: chave duplicada —', '; '.join(_repetidas))
              sys.exit(1)

          # `on`, `off`, `yes` e `no` SEM ASPAS são booleanos no YAML 1.1
          # (PyYAML, Ruby) e texto no 1.2 (Go, js-yaml). Vale dobrado aqui: o
          # vocabulário do produto é `provider=on|off`, e um `enum: [on, off]`
          # sairia `[true, false]` no /api/openapi.json e `["on", "off"]` para
          # quem lesse o /api/openapi.yaml com um parser 1.2.
          import re as _re
          _ambiguos = [f'linha {n}: {l.strip()}'
                       for n, l in enumerate(bruto.split('\n'), 1)
                       if _re.search(r'(?::\s+|^\s*-\s+)(on|off|yes|no)\s*$', l, _re.I)]
          if _ambiguos:
              print('CORE: escalar ambíguo entre YAML 1.1 e 1.2 (ponha aspas) —',
                    '; '.join(_ambiguos))
              sys.exit(1)

          # A spec offline é servida como JSON em /api/openapi.json e como o
          # YAML cru em /api/openapi.yaml. Valor que o YAML entende e o JSON
          # não — data sem aspas é o caso clássico — faria as duas rotas
          # responderem coisas diferentes para o mesmo campo.
          import json as _json
          try:
              _json.dumps(core)
          except TypeError as e:
              print('CORE: valor não expressável em JSON ->', e)
              sys.exit(1)
          errs = list(openapi_v30_spec_validator.iter_errors(core))
          for e in errs:
              print('CORE:', '/'.join(map(str, e.absolute_path)), '->', e.message[:160])

          sys.path.insert(0, 'gateway')
          from app.main import app
          gw = app.openapi()
          errs2 = list(openapi_v31_spec_validator.iter_errors(gw))
          for e in errs2:
              print('GATEWAY:', '/'.join(map(str, e.absolute_path)), '->', e.message[:160])

          if errs or errs2:
              sys.exit(1)
          print(f"OK: Core OAS 3.0 valida ({len(core['paths'])} paths) | "
                f"Gateway OAS 3.1 valida ({len(gw['paths'])} paths)")
          EOF
      - name: Postman coverage (endpoint sem BC-xxx quebra o build)
        run: python postman/check_coverage.py
      # A doc publicada no site é gerada do código. Sem esta guarda ela
      # envelhece em silêncio — e doc errada é pior que doc ausente, porque
      # ninguém desconfia dela.
      - name: Swagger do site em dia com o código
        run: PYTHONPATH=gateway python scripts/gerar-swagger-estatico.py --conferir
      # A referência da API não envelhece com erro — envelhece com OMISSÃO: a
      # rota nova entra, o Swagger a mostra, e o guia não a menciona. Ninguém
      # percebe, porque nada fica errado; só fica faltando. Foi assim que ele
      # chegou a 31 de 67 rotas.
      - name: Referência da API cobre todas as rotas do gateway
        run: PYTHONPATH=gateway python scripts/check_referencia_rotas.py
      - name: Test (gateway Python/FastAPI)
        run: cd gateway && PYTHONPATH=. pytest -v
