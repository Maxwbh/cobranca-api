# Publica a GitHub Release extraindo a seção da versão do CHANGELOG.md.
#
# Release não se cria por git — é objeto da API. E o corpo dela já tem dono:
# o CHANGELOG. Uma primeira versão deste workflow lia notas de
# .github/release-notes/, mas isso criava uma TERCEIRA cópia do mesmo texto
# (CHANGELOG → notas → Release); a cópia intermediária saiu e a fonte é uma.
#
# Fluxo de release (o resto do ritual está em scripts/README.md):
#   1. seção [X.Y.Z] pronta no CHANGELOG, mergeada na main;
#   2. tag vX.Y.Z criada e pushada  ->  este workflow publica sozinho.
# workflow_dispatch cobre republicação ou tag antiga (informar a tag).
#
# Idempotente: release que já existe é pulada.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex.: v2.1.0)"
        required: true

permissions:
  contents: write   # criar a release exige write; o default do repo é read
  packages: write   # push da imagem no GHCR

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolver a tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extrair a seção do CHANGELOG
        run: |
          python3 - "${{ steps.tag.outputs.tag }}" <<'PY'
          import re, sys
          tag = sys.argv[1]
          versao = tag.lstrip("v")
          texto = open("CHANGELOG.md", encoding="utf-8").read()
          # cabeçalho "## [X.Y.Z]" com ou sem data/sufixo; corpo até o próximo "## "
          m = re.search(rf"^## \[{re.escape(versao)}\][^\n]*\n(.*?)(?=^## |\Z)",
                        texto, re.M | re.S)
          if not m:
              sys.exit(f"::error::CHANGELOG.md não tem a seção [{versao}] — "
                       "escreva a seção antes de taguear.")
          corpo = m.group(1).strip() + (
              "\n\n---\n\n**Docs:** [maxwbh.github.io/cobranca-api]"
              "(https://maxwbh.github.io/cobranca-api/) · "
              "**Changelog completo:** [CHANGELOG.md]"
              "(https://github.com/Maxwbh/cobranca-api/blob/main/CHANGELOG.md)\n")
          open("/tmp/notas.md", "w", encoding="utf-8").write(corpo)
          print(f"seção [{versao}]: {len(corpo)} chars")
          PY

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$tag já publicada — nada a fazer."
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "$tag" --notes-file /tmp/notas.md
          echo "::notice::Release $tag publicada a partir do CHANGELOG."

  # A instalação de uma linha (`docker run ghcr.io/maxwbh/cobranca-api`) depende
  # deste job: sem ele o README promete uma imagem que não existe. GHCR exige o
  # caminho em minúsculas, e o GITHUB_TOKEN já autentica o push — nenhum segredo
  # extra. Multi-arch porque parte do público-alvo roda em ARM (Mac M-series,
  # Graviton); a engine é Python puro e cruza sem dor.
  imagem:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver a tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # a tag git leva "v" (v2.2.0); a da imagem não (2.2.0), convenção de registro
          echo "versao=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # no dispatch o ref é a branch; a imagem tem de sair do código da tag
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build e push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/maxwbh/cobranca-api:${{ steps.tag.outputs.versao }}
            ghcr.io/maxwbh/cobranca-api:latest
          # a label linka o pacote ao repositório no GHCR (e herda a visibilidade)
          labels: |
            org.opencontainers.image.source=https://github.com/Maxwbh/cobranca-api
            org.opencontainers.image.licenses=MIT
