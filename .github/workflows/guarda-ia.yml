# Impede que atribuição a assistente de IA chegue ao repositório público.
#
# Cobre as TRÊS superfícies por onde a marca costuma escapar:
#   1. commits do PR — mensagem, autor e committer;
#   2. título e corpo do PR;
#   3. comentários (do PR, de issue e de review).
#
# A superfície 3 é a que quase todo guard esquece, e é por onde este projeto
# já vazou: o corpo do PR pode estar limpo enquanto um comentário carrega o
# rodapé. Vale registrar a diferença de força entre elas: os jobs de PR viram
# check e podem ser exigidos na branch protection; o job de comentário roda
# fora do check suite do PR, então ele DETECTA e avisa, mas não bloqueia o
# merge sozinho.
#
# Menção em prosa ("usamos a API da Anthropic") não dispara: os padrões miram
# domínio de fornecedor, trailer de co-autoria e rodapé de "generated by".
name: Guarda de atribuição a IA

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read

env:
  # Domínios de fornecedor, trailers de co-autoria, rodapés de geração e o
  # marcador de sessão — este último foi o que vazou aqui, e leva junto a URL
  # da sessão.
  # `\[?` não é detalhe: o rodapé vem em markdown — "Generated with [Claude
  # Code](...)" — e um padrão que exija "with Claude" colado deixa passar.
  # `claude\.com` também não é redundante com `claude\.ai`: o rodapé atual
  # aponta para claude.com/claude-code, e só o .ai não o pegaria.
  PADRAO_IA: 'claude\.(ai|com)|anthropic\.com|openai\.com|chatgpt\.com|gemini\.google\.com|bard\.google\.com|copilot\.(microsoft|github)\.com|grok\.x\.com|mistral\.ai|perplexity\.ai|[Cc]laude-[Ss]ession|[Cc]o-[Aa]uthored-[Bb]y:.*(laude|opilot|hatGPT|emini|nthropic)|[Gg]enerated (by|with) *\[?(AI|Claude|ChatGPT|Copilot|Gemini|Grok|GPT)|[Pp]owered by *\[?(AI|Claude|OpenAI|ChatGPT)'

jobs:
  commits:
    name: Commits sem atribuição a IA
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conferir mensagem, autor e committer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git cat-file -e "$BASE_SHA" 2>/dev/null || ! git cat-file -e "$HEAD_SHA" 2>/dev/null; then
            echo "SHA não resolvível — nada a verificar."
            exit 0
          fi

          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$BASE_SHA")
          commits=$(git log "$base..$HEAD_SHA" --format='%H')
          if [ -z "$commits" ]; then
            echo "Nenhum commit novo."
            exit 0
          fi

          # A identidade entra na varredura junto com a mensagem: commit
          # assinado por um bot de IA passa despercebido em quem olha só o texto.
          erros=0
          for sha in $commits; do
            alvo=$(git log -1 --format='%B%n%an <%ae>%n%cn <%ce>' "$sha")
            if printf '%s\n' "$alvo" | grep -qiE "$PADRAO_IA"; then
              echo "::error::$sha contém atribuição a IA:"
              printf '%s\n' "$alvo" | grep -iE "$PADRAO_IA" | sed 's/^/    /'
              erros=1
            fi
          done

          if [ "$erros" -ne 0 ]; then
            echo "Reescreva os commits sem essas marcas (git rebase -i / git commit --amend),"
            echo "conferindo tambem --author e --committer."
            exit 1
          fi
          echo "OK — commits limpos."

  descricao:
    name: Título e corpo do PR sem atribuição a IA
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conferir título e corpo
        env:
          # Sempre por variável de ambiente, nunca interpolado direto no script:
          # corpo de PR é texto de terceiro e fecharia as aspas do shell.
          PR_TITULO: ${{ github.event.pull_request.title }}
          PR_CORPO: ${{ github.event.pull_request.body }}
        run: |
          erros=0
          conferir() {
            if printf '%s\n' "$2" | grep -qiE "$PADRAO_IA"; then
              echo "::error::$1 do PR contém atribuição a IA:"
              printf '%s\n' "$2" | grep -iE "$PADRAO_IA" | sed 's/^/    /'
              erros=1
            fi
          }
          conferir "Título" "$PR_TITULO"
          conferir "Corpo" "$PR_CORPO"

          if [ "$erros" -ne 0 ]; then
            echo "Edite o PR removendo as marcas. Atenção ao rodapé automático:"
            echo "ele reaparece a cada publicação, entao confira depois de salvar."
            exit 1
          fi
          echo "OK — título e corpo limpos."

  comentario:
    name: Comentário sem atribuição a IA
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o comentário recém-publicado
        env:
          CORPO: ${{ github.event.comment.body || github.event.review.body }}
          AUTOR: ${{ github.event.comment.user.login || github.event.review.user.login }}
          LINK: ${{ github.event.comment.html_url || github.event.review.html_url }}
        run: |
          if [ -z "$CORPO" ]; then
            echo "Comentário vazio — nada a verificar."
            exit 0
          fi
          if printf '%s\n' "$CORPO" | grep -qiE "$PADRAO_IA"; then
            echo "::error::Comentário de @$AUTOR contém atribuição a IA — edite em $LINK"
            printf '%s\n' "$CORPO" | grep -iE "$PADRAO_IA" | sed 's/^/    /'
            exit 1
          fi
          echo "OK — comentário limpo."
