# Atualização automática de dependências.
# Agrupado por ecossistema e limitado a poucos PRs abertos para não afogar a
# fila de review — o que importa é não ficar para trás em correção de segurança.
version: 2
updates:
  # Dependências do serviço (gateway FastAPI + engine pyCobrança)
  - package-ecosystem: pip
    directory: "/gateway"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "[CHORE]"
    groups:
      gateway:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # SDK Python publicado no PyPI
  - package-ecosystem: pip
    directory: "/python-client"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "[CHORE]"
    groups:
      python-client:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Actions usadas pelo CI (checkout, setup-python, buildx, …)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "[CHORE]"
    groups:
      actions:
        patterns:
          - "*"

  # Imagem base do Dockerfile (python:3.12-slim)
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: "[CHORE]"
