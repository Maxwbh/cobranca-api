# Cobranca-API — serviço único 100% Python (FastAPI + engine pyCobranca).
# Uso: docker compose up --build  →  http://localhost:8000
#   /docs (gateway) · /api/docs (offline) · /health · /api/health
services:
  cobranca_api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # critical|error|warning|info|debug|trace — use debug para ver cada request
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
