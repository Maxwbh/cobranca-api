# Configuração para Render.com Free Tier
# Documentação: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cobranca-api
    runtime: docker
    region: oregon
    plan: free

    # SERVIÇO ÚNICO 100% Python: FastAPI + engine pyCobranca (in-process).
    # A conexão com o Banking Core BrCobrança (Ruby) foi DESCONTINUADA.
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Deploy automático
    autoDeploy: true

    # Deploy segue a main (v2.0.0 em diante).
    branch: main

    # Health check do gateway (o /api/health é servido pela engine embutida)
    healthCheckPath: /health

    # Variáveis de ambiente (free tier 512MB)
    # IMPORTANTE: valores no Render são strings — sempre entre aspas.
    envVars:
      - key: PORT
        value: "8000"

      # Vira --log-level do uvicorn. critical|error|warning|info|debug|trace
      # (a caixa não importa). Valor inválido não derruba o serviço: o
      # container avisa e assume "info".
      - key: LOG_LEVEL
        value: "info"

      # Cofre de credenciais (SQLite em diretório gravável pelo usuário app).
      # Para Postgres/Supabase, defina SUPABASE_DB_URL/DATABASE_URL no painel.
      - key: CREDENTIAL_DB_PATH
        value: "/app/data/credentials.db"

      # Artefatos de jobs em disco (efêmero no free tier: some a cada deploy —
      # retenção curta e download logo após a conclusão do job).
      - key: ARTIFACT_DIR
        value: "/app/data/jobs"

      - key: ARTIFACT_TTL_DIAS
        value: "7"

      # Teto de itens por lote. Declarados aqui para aparecerem no painel: num
      # plano maior, trocar o número é editar a variável — não precisa deploy.
      #
      # As duas NÃO escalam igual, e o gargalo de cada uma é diferente:
      #
      # JOB_MAX_ITENS (assíncrono) é o barato de subir. A chamada responde 202
      # em ~1s e o trabalho segue em background; o custo é memória e tempo de
      # fundo.
      #
      # LOTE_MAX_ITENS (síncrono, /api/boleto/multi e /api/render/carne) segura
      # a conexão HTTP até o PDF ficar pronto. Medido no free tier: 200 boletos
      # = 15,9s no multi. Dobrar põe a requisição perto de 30s, onde proxy,
      # balanceador ou o próprio cliente desistem — e o servidor gasta o tempo
      # inteiro gerando um PDF que ninguém recebe. Acima de ~200 o caminho é o
      # job, não um teto maior.
      - key: LOTE_MAX_ITENS
        value: "200"

      - key: JOB_MAX_ITENS
        value: "200"
