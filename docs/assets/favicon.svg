<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"
     role="img" aria-label="Cobranca-API">
  <!--
    Favicon da Cobranca-API — desenho PRÓPRIO para tamanhos pequenos.

    Não é marca.svg reduzida, e isso é deliberado: a marca tem três barras, e a
    mais fina (4 de 64) daria 1px a 16px — some ou vira cinza. Aqui são duas
    barras, mais grossas, e o mesmo vão de respiro antes do chevron.
    Barras 1-4 e 5,5-8; chevron nasce em 10. Topo e base em 3 e 13 nos dois.

    O arquivo carrega o próprio tema: a barra de abas do navegador é clara ou
    escura conforme o sistema, e uma marca navy fixa desaparece na escura.
    Chrome, Firefox e Safari respeitam prefers-color-scheme dentro do favicon.
  -->
  <style>
    .barra { fill: #0F172A; }
    .seta  { stroke: #0891B2; }
    @media (prefers-color-scheme: dark) {
      .barra { fill: #F8FAFC; }
      .seta  { stroke: #06B6D4; }
    }
  </style>
  <g class="barra">
    <rect x="1"   y="3" width="3"   height="10" rx="0.5"/>
    <rect x="5.5" y="3" width="2.5" height="10" rx="0.5"/>
  </g>
  <path class="seta" d="M11.25 4.25 L14 8 L11.25 11.75" fill="none"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
