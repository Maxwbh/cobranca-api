<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Fluxo de POST /cobranca: router valida, token bapi_ e decifrado, registry escolhe o provider, o provider chama a API do banco ou a engine offline, e a resposta volta normalizada">
  <defs>
    <marker id="f1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
    <marker id="f2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#06B6D4"/>
    </marker>
    <style>
      .t   { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .cap { font-size: 11.5px; fill: #64748B; letter-spacing: .7px; font-weight: 700; }
      .n   { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
      .d   { font-size: 11.5px; fill: #475569; }
      .num { font-size: 13px; font-weight: 700; fill: #fff; }
    </style>
  </defs>

  <rect width="1200" height="500" fill="#F8FAFC"/>
  <text x="600" y="30" text-anchor="middle" class="t cap">FLUXO DE UMA REQUISIÇÃO — POST /cobranca</text>

  <!-- etapas -->
  <g class="t">
    <!-- 1 -->
    <rect x="40" y="60" width="200" height="86" rx="10" fill="#fff" stroke="#CBD5E1"/>
    <circle cx="64" cy="84" r="13" fill="#1E40AF"/><text x="64" y="89" text-anchor="middle" class="num">1</text>
    <text x="86" y="89" class="n">Router</text>
    <text x="56" y="112" class="d">valida o corpo (pydantic)</text>
    <text x="56" y="130" class="d">CobrancaIn</text>

    <!-- 2 -->
    <rect x="270" y="60" width="220" height="86" rx="10" fill="#fff" stroke="#CBD5E1"/>
    <circle cx="294" cy="84" r="13" fill="#1E40AF"/><text x="294" y="89" text-anchor="middle" class="num">2</text>
    <text x="316" y="89" class="n">Credenciais</text>
    <text x="286" y="112" class="d">decifra o token bapi_</text>
    <text x="286" y="130" class="d">AAD amarra tenant+provider</text>

    <!-- 3 -->
    <rect x="520" y="60" width="220" height="86" rx="10" fill="#fff" stroke="#1E40AF" stroke-width="2"/>
    <circle cx="544" cy="84" r="13" fill="#1E40AF"/><text x="544" y="89" text-anchor="middle" class="num">3</text>
    <text x="566" y="89" class="n">Registry</text>
    <text x="536" y="112" class="d">escolhe o provider</text>
    <text x="536" y="130" class="d">registered_ready → fallback</text>

    <!-- 4 -->
    <rect x="770" y="60" width="200" height="86" rx="10" fill="#fff" stroke="#CBD5E1"/>
    <circle cx="794" cy="84" r="13" fill="#1E40AF"/><text x="794" y="89" text-anchor="middle" class="num">4</text>
    <text x="816" y="89" class="n">Provider</text>
    <text x="786" y="112" class="d">traduz p/ o dialeto</text>
    <text x="786" y="130" class="d">do banco escolhido</text>

    <!-- 5 -->
    <rect x="1000" y="60" width="160" height="86" rx="10" fill="#0F172A"/>
    <circle cx="1024" cy="84" r="13" fill="#06B6D4"/><text x="1024" y="89" text-anchor="middle" class="num">5</text>
    <text x="1046" y="89" class="n" fill="#fff">Resposta</text>
    <text x="1016" y="112" class="d" fill="#E2E8F0">201 + Location</text>
    <text x="1016" y="130" class="d" fill="#67E8F9">CobrancaOut</text>
  </g>

  <!-- setas entre etapas -->
  <line x1="244" y1="103" x2="266" y2="103" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#f1)"/>
  <line x1="494" y1="103" x2="516" y2="103" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#f1)"/>
  <line x1="744" y1="103" x2="766" y2="103" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#f1)"/>
  <line x1="974" y1="103" x2="996" y2="103" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#f1)"/>

  <!-- bifurcacao do provider -->
  <line x1="870" y1="150" x2="870" y2="196" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="700" y1="196" x2="1040" y2="196" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="700" y1="196" x2="700" y2="228" stroke="#06B6D4" stroke-width="2.5" marker-end="url(#f2)"/>
  <line x1="1040" y1="196" x2="1040" y2="228" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#f1)"/>

  <rect x="560" y="236" width="280" height="62" rx="10" fill="#06B6D4"/>
  <text x="700" y="262" text-anchor="middle" class="t n" fill="#fff">Engine pyCobrança</text>
  <text x="700" y="283" text-anchor="middle" class="t d" fill="#083344">in-process · sem rede · sem credencial</text>

  <rect x="900" y="236" width="280" height="62" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1040" y="262" text-anchor="middle" class="t n">API do banco</text>
  <text x="1040" y="283" text-anchor="middle" class="t d">OAuth + mTLS · online</text>

  <!-- erros -->
  <rect x="40" y="236" width="480" height="242" rx="10" fill="#fff" stroke="#CBD5E1"/>
  <text x="64" y="262" class="t n">Tradução de erro — nunca 500 opaco</text>
  <g class="t" font-size="12">
    <text x="64" y="288" fill="#B45309" font-weight="700">424</text>
    <text x="106" y="288" fill="#475569">banco recusou a credencial (401/403 upstream)</text>
    <text x="64" y="312" fill="#B45309" font-weight="700">409</text>
    <text x="106" y="312" fill="#475569">registro na CIP ainda em curso — re-tentar</text>
    <text x="64" y="336" fill="#B45309" font-weight="700">422</text>
    <text x="106" y="336" fill="#475569">operação exige provider REST</text>
    <text x="64" y="360" fill="#B45309" font-weight="700">422</text>
    <text x="106" y="360" fill="#475569">banco não oferece a operação (aponta alternativa)</text>
    <text x="64" y="384" fill="#B45309" font-weight="700">400</text>
    <text x="106" y="384" fill="#475569">dados do boleto inválidos + validation_errors</text>
    <text x="64" y="408" fill="#B45309" font-weight="700">502</text>
    <text x="106" y="408" fill="#475569">falha do banco — re-tentar com backoff</text>
    <text x="64" y="432" fill="#B45309" font-weight="700">504</text>
    <text x="106" y="432" fill="#475569">banco indisponível ou tempo esgotado</text>
    <text x="64" y="458" fill="#94A3B8" font-size="11">o 424 separa "o banco recusou" de "o serviço quebrou"</text>
  </g>

  <text x="860" y="330" text-anchor="middle" class="t d" fill="#94A3B8">o consumidor recebe o mesmo contrato nos dois caminhos</text>
</svg>
