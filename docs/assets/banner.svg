<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%"
     role="img" aria-label="Cobranca-API — plataforma unificada de cobrança bancária para o Brasil. Offline, na engine embutida: boletos em PDF, carnês, CNAB 240/400 e OFX para 18 bancos. Online, nas APIs dos bancos: Pix, Bolepix e link de pagamento com cartão.">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Principal -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)"/>

  <!-- Detalhes de Grade/Background de Código -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200 M0 300H1200 M0 350H1200" />
    <path d="M100 0V400 M200 0V400 M300 0V400 M400 0V400 M500 0V400 M600 0V400 M700 0V400 M800 0V400 M900 0V400 M1000 0V400 M1100 0V400" />
  </g>

  <!-- Barra Neon de Topo -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent-grad)"/>

  <!-- Lado Esquerdo: Marca e Título -->
  <g transform="translate(80, 80)">
    <!-- Tag Supertítulo -->
    <rect x="0" y="0" width="210" height="28" rx="14" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1"/>
    <text x="105" y="18" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">OPEN SOURCE &amp; REST API</text>

    <!-- Título Principal -->
    <text x="0" y="75" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">Cobranca-API</text>

    <!-- Subtítulo / Descrição -->
    <text x="0" y="115" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
      Plataforma Unificada de Cobrança Bancária para o Brasil
    </text>

    <!-- Highlights com Pills/Badges -->
    <g transform="translate(0, 155)">
      <!-- Features Pills -->
      <g transform="translate(0,0)">
        <rect width="130" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="65" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ 100% Python</text>
      </g>
      <g transform="translate(140,0)">
        <rect width="130" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="65" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🏦 18 Bancos</text>
      </g>
      <g transform="translate(280,0)">
        <rect width="130" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="65" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔗 API + Engine</text>
      </g>
    </g>

    <!-- Linguagens / Suporte -->
    <text x="0" y="235" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      INTEGRAÇÃO UNIVERSAL: Oracle APEX · PL/SQL · Python · Java · Node · C# · PHP · Delphi
    </text>
  </g>

  <!-- Lado Direito: Card Ilustrativo de Funcionalidades -->
  <g transform="translate(720, 65)" filter="url(#shadow)">
    <!-- Frame do Card -->
    <rect width="400" height="270" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>

    <!-- Cabeçalho da Janela/Card -->
    <path d="M0 12C0 5.37258 5.37258 0 12 0H388C394.627 0 400 5.37258 400 12V36H0V12Z" fill="#0F172A" opacity="0.6"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="5" fill="#10B981"/>
    <text x="380" y="22" fill="#64748B" font-family="monospace" font-size="11" text-anchor="end">POST /cobranca</text>

    <!-- Lista de Recursos no Card -->
    <g transform="translate(24, 60)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="32" height="32" rx="6" fill="#3B82F6" fill-opacity="0.1"/>
        <text x="16" y="21" fill="#3B82F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">📄</text>
        <text x="44" y="15" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Boletos PDF &amp; Carnês</text>
      <rect x="296" y="1" width="56" height="16" rx="8" fill="#94A3B8" fill-opacity="0.13" stroke="#94A3B8" stroke-opacity="0.35" stroke-width="1"/>
      <text x="324.0" y="12" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.8" text-anchor="middle">OFFLINE</text>
        <text x="44" y="30" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Layouts A4 de 18 bancos e carnê 3 vias</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 50)">
        <rect width="32" height="32" rx="6" fill="#06B6D4" fill-opacity="0.1"/>
        <text x="16" y="21" fill="#06B6D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">⚡</text>
        <text x="44" y="15" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Pix &amp; Bolepix Híbrido</text>
      <rect x="302" y="1" width="50" height="16" rx="8" fill="#06B6D4" fill-opacity="0.13" stroke="#06B6D4" stroke-opacity="0.35" stroke-width="1"/>
      <text x="327.0" y="12" fill="#06B6D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.8" text-anchor="middle">ONLINE</text>
        <text x="44" y="30" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">QR Code dinâmico e Pix Automático BACEN</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 100)">
        <rect width="32" height="32" rx="6" fill="#10B981" fill-opacity="0.1"/>
        <text x="16" y="21" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🔄</text>
        <text x="44" y="15" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">CNAB 240/400 &amp; OFX</text>
      <rect x="296" y="1" width="56" height="16" rx="8" fill="#94A3B8" fill-opacity="0.13" stroke="#94A3B8" stroke-opacity="0.35" stroke-width="1"/>
      <text x="324.0" y="12" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.8" text-anchor="middle">OFFLINE</text>
        <text x="44" y="30" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Remessa, retorno e conciliação de extrato</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 150)">
        <rect width="32" height="32" rx="6" fill="#8B5CF6" fill-opacity="0.1"/>
        <text x="16" y="21" fill="#8B5CF6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">💳</text>
        <text x="44" y="15" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Link de Pagamento Cartão</text>
      <rect x="302" y="1" width="50" height="16" rx="8" fill="#06B6D4" fill-opacity="0.13" stroke="#06B6D4" stroke-opacity="0.35" stroke-width="1"/>
      <text x="327.0" y="12" fill="#06B6D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.8" text-anchor="middle">ONLINE</text>
        <text x="44" y="30" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Checkout seguro com crédito/débito</text>
      </g>
    </g>
  </g>
</svg>
