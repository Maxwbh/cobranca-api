<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Cobranca-API — plataforma open source de cobrança bancária: boleto, Pix, CNAB e OFX para 18 bancos brasileiros, 100% Python">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#3B5A82"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="270" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="270" rx="14" fill="url(#fade)"/>

  <!-- motivo: código de barras (boleto) à direita -->
  <g opacity="0.55">
    <rect x="905" y="58" width="6"  height="154" fill="#FFFFFF" opacity="0.85"/>
    <rect x="917" y="58" width="3"  height="154" fill="#FFFFFF" opacity="0.55"/>
    <rect x="926" y="58" width="10" height="154" fill="#FFFFFF" opacity="0.9"/>
    <rect x="942" y="58" width="4"  height="154" fill="#06B6D4"/>
    <rect x="952" y="58" width="7"  height="154" fill="#FFFFFF" opacity="0.75"/>
    <rect x="965" y="58" width="3"  height="154" fill="#FFFFFF" opacity="0.5"/>
    <rect x="974" y="58" width="12" height="154" fill="#FFFFFF" opacity="0.9"/>
    <rect x="992" y="58" width="5"  height="154" fill="#06B6D4"/>
    <rect x="1003" y="58" width="3" height="154" fill="#FFFFFF" opacity="0.6"/>
    <rect x="1012" y="58" width="8" height="154" fill="#FFFFFF" opacity="0.85"/>
    <rect x="1026" y="58" width="4" height="154" fill="#FFFFFF" opacity="0.5"/>
    <rect x="1036" y="58" width="10" height="154" fill="#FFFFFF" opacity="0.9"/>
    <rect x="1052" y="58" width="3" height="154" fill="#06B6D4"/>
    <rect x="1061" y="58" width="6" height="154" fill="#FFFFFF" opacity="0.7"/>
    <rect x="1073" y="58" width="12" height="154" fill="#FFFFFF" opacity="0.9"/>
    <rect x="1091" y="58" width="4" height="154" fill="#FFFFFF" opacity="0.55"/>
    <rect x="1101" y="58" width="8" height="154" fill="#FFFFFF" opacity="0.8"/>
    <rect x="1115" y="58" width="3" height="154" fill="#06B6D4"/>
    <rect x="1124" y="58" width="7" height="154" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- motivo: losango Pix abstrato (ciano) -->
  <g transform="translate(836,135) rotate(45)" opacity="0.9">
    <rect x="-26" y="-26" width="52" height="52" rx="10" fill="none" stroke="#06B6D4" stroke-width="6"/>
    <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#06B6D4"/>
  </g>

  <!-- título -->
  <text x="64" y="122" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">Cobranca-API</text>

  <!-- linha de acento -->
  <rect x="66" y="142" width="150" height="5" rx="2.5" fill="#06B6D4"/>

  <!-- tagline -->
  <text x="64" y="182" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#E2E8F0">Boleto · Pix · Pix Automático · CNAB · OFX</text>
  <text x="64" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#94A3B8">18 bancos · REST 100% Python (FastAPI + PyCobrança) · qualquer linguagem · MIT</text>
</svg>
