<!--
  Ponto de extensão do tema Cayman: o layout fecha o <head> chamando este
  arquivo DEPOIS da folha de estilo do tema. É por isso que as regras abaixo
  vencem sem !important.

  NÃO escreva a tag de include deste arquivo aqui dentro, nem como exemplo em
  comentário: Liquid não respeita comentário de HTML e processa a tag mesmo
  assim, o arquivo passa a incluir a si mesmo e a build do Pages morre com
  "stack level too deep" após dez mil níveis, sem apontar o culpado. Foi o que
  derrubou o site em 07/08/2026.
-->

<!-- Verificação do Google Search Console. Dois métodos de propósito: a meta
     tag aqui e o arquivo googlec*.html em docs/ — se um plugin do Pages
     embrulhar o arquivo num layout, a meta tag segura a verificação. -->
<meta name="google-site-verification" content="XS9wvfG-V6V1tGDI7BT0zbeqiQyE3-tkc5LhfL0tvbc" />

<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" sizes="32x32">
<link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">

<style>
  /* ---------- Cabeçalho: o banner do README é o herói ---------- */
  .page-header {
    background-color: #0F172A;
    background-image: linear-gradient(120deg, #0F172A, #152449);
    padding: 2.4rem 1rem 2.6rem;
  }

  .banner-cabecalho {
    display: block;
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    border-radius: 14px;
    box-shadow: 0 18px 44px rgba(2, 6, 23, 0.5);
  }

  .acoes-cabecalho { text-align: center; margin-top: 1.3rem; }

  .so-leitor-de-tela {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap; border: 0;
  }

  .btn {
    color: #F8FAFC;
    border-color: rgba(248, 250, 252, 0.4);
    margin: 0.25rem 0.35rem;
  }
  .btn:hover {
    border-color: rgba(248, 250, 252, 0.85);
    background-color: rgba(248, 250, 252, 0.12);
  }
  /* Um botão primário cheio: hierarquia em vez de três iguais. Texto navy
     sobre ciano = 7,35 de contraste (o branco sobre ciano reprova AA). */
  .btn-primario {
    background-color: #06B6D4;
    border-color: #06B6D4;
    color: #0F172A;
    font-weight: 700;
  }
  .btn-primario:hover {
    background-color: #22D3EE;
    border-color: #22D3EE;
    color: #0F172A;
  }

  /* ---------- Conteúdo ---------- */
  .main-content { max-width: 62rem; }

  .main-content h1, .main-content h2 { color: #0F172A; }
  .main-content h2 {
    border-bottom: 1px solid #E2E8F0;
    padding-bottom: 0.35rem;
  }

  /* Ciano fechado, não o #06B6D4 da identidade: link é texto pequeno sobre
     branco, e ali o ciano aberto dá 2,43 de contraste. Este dá 3,68 no corpo
     e sobe para 4,6 no hover. */
  .main-content a { color: #0891B2; }
  .main-content a:hover { color: #0E7490; }

  .main-content blockquote {
    color: #475569;
    border-left-color: #06B6D4;
    background: #F8FAFC;
    padding: 0.6rem 1rem;
    border-radius: 0 8px 8px 0;
  }

  /* Tabelas como cartões: canto arredondado, zebra e hover. O radius exige
     border-collapse separate — com collapse o canto não corta. */
  .main-content table {
    display: table;
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    border: 1px solid #E2E8F0;
    border-radius: 10px;
    overflow: hidden;
  }
  .main-content table th {
    background-color: #0F172A;
    color: #F8FAFC;
    border: 0;
    border-bottom: 2px solid #06B6D4;
  }
  .main-content table td { border: 0; border-bottom: 1px solid #EEF2F7; }
  .main-content table tr:last-child td { border-bottom: 0; }
  .main-content table tr:nth-child(even) { background: #F8FAFC; }
  .main-content table tr:hover { background: #F0F9FF; }

  /* Bloco de código como terminal: o mesmo navy da identidade. */
  .main-content pre {
    background-color: #0F172A;
    color: #E2E8F0;
    border: 0;
    border-radius: 10px;
    box-shadow: 0 8px 22px rgba(2, 6, 23, 0.18);
  }
  .main-content pre code { color: #E2E8F0; }
  .main-content .highlight { background: transparent; }
  .main-content .highlight pre { background-color: #0F172A; }
  .main-content code {
    background-color: #F1F5F9;
    color: #0F172A;
  }
  .main-content pre code { background: transparent; }

  hr { background: #E2E8F0; height: 1px; margin: 2rem 0; }

  /* ---------- Faixa de números (mesma do social preview) ---------- */
  .faixa-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin: 1.6rem 0 0.4rem;
  }
  .faixa-stats > div {
    flex: 1 1 10rem;
    background: #0F172A;
    border-radius: 10px;
    padding: 0.9rem 1rem 0.8rem;
    text-align: center;
  }
  .faixa-stats strong {
    display: block;
    font-size: 1.7rem;
    line-height: 1.15;
    color: #FFFFFF;
  }
  .faixa-stats > div:last-child strong { color: #06B6D4; }
  .faixa-stats span { color: #94A3B8; font-size: 0.82rem; }

  /* ---------- Demo (SVG do terminal) ---------- */
  .demo-terminal {
    display: block;
    max-width: 780px;
    width: 100%;
    margin: 1.4rem auto 0.3rem;
    border-radius: 10px;
    box-shadow: 0 14px 34px rgba(2, 6, 23, 0.25);
  }
  .legenda {
    display: block;
    text-align: center;
    color: #64748B;
    font-size: 0.82rem;
    margin-bottom: 1.4rem;
  }

  .site-footer { border-top: 1px solid #E2E8F0; }

  /* Corpo um ponto maior que o default do Cayman — texto de 16px em tela
     larga cansa; 62rem de coluna + 1.05rem dá medida de ~75 caracteres. */
  .main-content { font-size: 1.05rem; }

  /* ---------- Chips de banco (nome é uso nominativo; logo é marca) ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0 0.9rem; }
  .chip {
    display: inline-block;
    background: #0F172A;
    color: #F8FAFC;
    border: 1px solid #334155;
    border-radius: 999px;
    padding: 0.18rem 0.75rem;
    font-size: 0.82rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .chip-on { border-color: #06B6D4; color: #67E8F9; }

  /* Selos vivos (shields) sob o hero: versão, build, licença e stars. */
  .selos { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.4rem 0 0.2rem; }
  .selos img { height: 22px; }

  /* ---------- Blocos online/offline e grade de casos de uso ---------- */
  .blocos-bancos, .grade-casos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
    gap: 1rem;
    margin: 1.4rem 0;
  }
  .bloco-banco, .caso {
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    padding: 1rem 1.2rem;
    background: #FFFFFF;
    box-shadow: 0 4px 14px rgba(2, 6, 23, 0.05);
  }
  .bloco-banco h3, .caso h3 { margin-top: 0.2rem; color: #0F172A; }
  .bloco-banco ul { margin-bottom: 0.4rem; }
  .caso p { margin-bottom: 0.3rem; font-size: 0.97rem; }

  /* ---------- CTA final ---------- */
  .cta-final {
    background: linear-gradient(120deg, #0F172A, #152449);
    border-radius: 14px;
    text-align: center;
    padding: 2rem 1.4rem 1.7rem;
    margin: 2.4rem 0 2rem;
  }
  .cta-final h2 { color: #FFFFFF; border-bottom: 0; margin-top: 0; }
  .cta-final p { color: #CBD5E1; max-width: 34rem; margin: 0.6rem auto 1rem; }

  /* ---------- Botão copiar nos blocos de código ---------- */
  .main-content pre { position: relative; }
  .botao-copiar {
    position: absolute;
    top: 0.5rem; right: 0.5rem;
    background: rgba(248, 250, 252, 0.12);
    color: #CBD5E1;
    border: 1px solid rgba(248, 250, 252, 0.25);
    border-radius: 6px;
    font-size: 0.72rem;
    padding: 0.15rem 0.55rem;
    cursor: pointer;
  }
  .botao-copiar:hover { background: rgba(248, 250, 252, 0.22); color: #FFFFFF; }

  /* ---------- Mobile: hero compacto, títulos menores, tiles 2x2 ---------- */
  @media (max-width: 600px) {
    .page-header { padding: 1.2rem 0.7rem 1.6rem; }
    .banner-cabecalho { border-radius: 10px; }
    .acoes-cabecalho { margin-top: 1rem; }
    .acoes-cabecalho .btn {
      padding: 0.5rem 0.85rem;
      font-size: 0.85rem;
      margin: 0.18rem 0.18rem;
    }
    .main-content { padding: 1.6rem 1rem; font-size: 1rem; }
    .main-content h1 { font-size: 1.62rem; line-height: 1.25; }
    .main-content h2 { font-size: 1.3rem; }
    .faixa-stats { gap: 0.55rem; }
    .faixa-stats > div { flex: 1 1 42%; padding: 0.7rem 0.6rem 0.6rem; }
    .faixa-stats strong { font-size: 1.4rem; }
    .cta-final { padding: 1.5rem 1rem 1.3rem; }

    /* Tabela larga rola sozinha em vez de vazar da tela. O `display:table` +
       `overflow:hidden` lá em cima (que arredonda o canto) desfaz o
       comportamento padrão do Cayman, e a coluna da direita ficava cortada,
       sem nem sinalizar que havia mais — pior que barra de rolagem. Aqui o
       canto arredondado perde para a legibilidade. */
    .main-content table {
      display: block;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
    }
    .main-content table td, .main-content table th { white-space: normal; }
  }
</style>
