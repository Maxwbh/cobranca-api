  es: NAO_PERMITE | PERMITE_3R_7D
- pt: Id de locrec p/ adesão via QR (Jornada 2)
  es: Id de locrec para adhesión vía QR (Jornada 2)
- pt: ativacao.dadosJornada.txid (Jornadas 3/4)
  es: ativacao.dadosJornada.txid (Jornadas 3/4)
- pt: Campos BACEN adicionais (merge no payload)
  es: Campos BACEN adicionales (merge en el payload)
- pt: Vínculo de recorrência (Pix Automático) — o 'contrato de cobrança'.
  es: Vínculo de recurrencia (Pix Automático) — el 'contrato de cobranza'.
- pt: 'Resposta da sonda. Um campo, valor fixo — o contrato é a simplicidade.


    `"ok"` MINÚSCULO. O `GET /api/health` da superfície offline responde `"OK"`

    maiúsculo, por contrato herdado da v1.x: são sondas de processos diferentes

    dentro do mesmo container e os dois formatos têm consumidor — este é o que o

    `examples/oracle/cobranca_api_pkg.sql` e a coleção Postman comparam.'
  es: 'Respuesta de la sonda. Un campo, valor fijo — el contrato es la simplicidad.


    `"ok"` en MINÚSCULAS. El `GET /api/health` de la superficie offline responde `"OK"`

    en mayúsculas, por contrato heredado de la v1.x: son sondas de procesos distintos

    dentro del mismo container y los dos formatos tienen consumidor — este es el que el

    `examples/oracle/cobranca_api_pkg.sql` y la colección Postman comparan.'
- pt: 'O que o banco notifica naquela URL.


    O vocabulário nasceu do C6, que tem duas notificações (boleto e cartão). O

    Inter tem UMA — e a chama de `COBRANCA`: quem lê a documentação do Inter

    manda essa palavra e levava `422` listando só os termos do outro banco.

    `COBRANCA` entra como grafia do mesmo serviço; o provider do C6 traduz para

    a sua antes de falar com o banco, senão o alias viraria `400` lá na frente.'
  es: 'Qué notifica el banco en aquella URL.


    El vocabulario nació del C6, que tiene dos notificaciones (boleto y tarjeta).

    Inter tiene UNA — y la llama `COBRANCA`: quien lee la documentación de Inter

    manda esa palabra y recibía `422` listando solo los términos del otro banco.

    `COBRANCA` entra como grafía del mismo servicio; el provider del C6 la traduce a

    la suya antes de hablar con el banco, si no el alias se volvería `400` más adelante.'
- pt: Payload BACEN da solicrec (idRec, ...)
  es: Payload BACEN de la solicrec (idRec, ...)
- pt: solicrec — pedido de autorização enviado ao app do pagador (Jornada 1).
  es: solicrec — pedido de autorización enviado a la app del pagador (Jornada 1).
- pt: Status normalizado da cobrança (igual para qualquer banco).
  es: Status normalizado de la cobranza (igual para cualquier banco).
- pt: Estados possíveis de um item — o vocabulário fechado do filtro.
  es: Estados posibles de un ítem — el vocabulario cerrado del filtro.
- pt: 'URL **pública e https** que o banco chamará (ex: https://.../webhooks/c6/{tenant})'
  es: 'URL **pública y https** que el banco llamará (ej.: https://.../webhooks/c6/{tenant})'
- pt: Tipo do evento
  es: Tipo del evento
- pt: Id da cobrança / txid
  es: Id de la cobranza / txid
- pt: Data/hora do pagamento, se liquidado
  es: Fecha/hora del pago, si está liquidado
- pt: Valor pago, se aplicável
  es: Valor pagado, si aplica
- pt: O status foi reconsultado no banco? `true` confere; `false` o banco discordou e o `status` aqui
    é o DELE; `null` não foi possível perguntar (evento sem tenant, sem credencial no cofre, ou consulta
    desligada). Só status que move dinheiro é reconsultado.
  es: ¿El status fue reconsultado en el banco? `true` coincide; `false` el banco discrepó y el `status`
    aquí es el SUYO; `null` no fue posible preguntar (evento sin tenant, sin credencial en la bóveda,
    o consulta apagada). Solo el status que mueve dinero se reconsulta.
- pt: '`true` quando o push ao consumidor não saiu de primeira e o evento ficou no outbox para re-tentativa
    com backoff.'
  es: '`true` cuando el push al consumidor no salió a la primera y el evento quedó en el outbox para reintento
    con backoff.'
- pt: Evento normalizado de pagamento — também o corpo do push aos consumidores.
  es: Evento normalizado de pago — también el cuerpo del push a los consumidores.
- pt: Chave Pix do recebedor (a mesma das cobranças)
  es: Clave Pix del receptor (la misma de las cobranzas)
- pt: URL **pública e https** que o banco chamará quando um Pix cair na chave
  es: URL **pública y https** que el banco llamará cuando un Pix caiga en la clave
- pt: 'Webhook BACEN por chave — o banco chama a URL quando um Pix cai na chave.


    Era `body: dict`: o Swagger não descrevia campo nenhum, campo com nome errado

    passava calado e `credentials` viajava sem tipo dentro de um dicionário

    livre.'
  es: 'Webhook BACEN por clave — el banco llama a la URL cuando un Pix cae en la clave.


    Era `body: dict`: el Swagger no describía ningún campo, un campo con nombre equivocado

    pasaba callado y `credentials` viajaba sin tipo dentro de un diccionario

    libre.'
- pt: O status do banco é traduzido para o que o chamador precisa fazer, mas o original vai inteiro em
    `upstream` — traduzir a faixa não pode custar o diagnóstico.
  es: El status del banco se traduce a lo que quien llama necesita hacer, pero el original va entero en
    `upstream` — traducir la franja no puede costar el diagnóstico.
- pt: O que houve, em uma frase.
  es: Qué pasó, en una frase.
- pt: A resposta do banco, como veio.
  es: La respuesta del banco, tal como vino.
- pt: Status HTTP do banco.
  es: Status HTTP del banco.
- pt: Endpoint do banco chamado.
  es: Endpoint del banco llamado.
- pt: Corpo do banco (JSON, ou texto truncado em 500).
  es: Cuerpo del banco (JSON, o texto truncado en 500).
- pt: 'Token opaco devolvido por `POST /credenciais` — `Authorization: Bearer bapi_...`.


    **É opcional**, e a spec diz isso: as credenciais do banco podem vir no corpo (`credentials`), no
    header `X-Bank-Credentials` ou do cofre do servidor (`VAULT__<tenant>__<banco>__*` — a chave é o banco,
    não o caminho). Sem nenhuma das três, a rota responde `424`.'
  es: 'Token opaco devuelto por `POST /credenciais` — `Authorization: Bearer bapi_...`.


    **Es opcional**, y la spec lo dice: las credenciales del banco pueden venir en el cuerpo (`credentials`),
    en el header `X-Bank-Credentials` o de la bóveda del servidor (`VAULT__<tenant>__<banco>__*` — la
    clave es el banco, no el camino). Sin ninguna de las tres, la ruta responde `424`.'
- pt: 'Catálogo de bancos: caminhos (`on`/`off`) de cada um, capacidades reais (introspecção), o que **esta
    instalação** faz (`registrado_pronto`, `fallback_offline`) e o esquema de credenciais por banco. Catálogo
    completo de serviços por banco (incl. não implementados): [docs do repositório](https://github.com/Maxwbh/cobranca-api/tree/main/docs/development).'
  es: 'Catálogo de bancos: caminos (`on`/`off`) de cada uno, capacidades reales (introspección), qué hace
    **esta instalación** (`registrado_pronto`, `fallback_offline`) y el esquema de credenciales por banco.
    Catálogo completo de servicios por banco (incl. no implementados): [docs del repositorio](https://github.com/Maxwbh/cobranca-api/tree/main/docs/development).'
- pt: 'Tokenização zero-knowledge: cadastre as credenciais do banco UMA vez e use o token `bapi_` nas
    demais chamadas. **O mecanismo é um só; o esquema de campos é de cada banco** — C6 e Sicoob entregam
    PKCS12 (`pfx_base64` + `pfx_password`), o Inter entrega `.crt` + `.key` (`cert_pem` + `key_pem`, aceitos
    em PEM cru ou base64). Integrar banco novo não muda nada do lado do consumidor: o esquema vigente
    sai em `GET /bancos`.'
  es: 'Tokenización zero-knowledge: registre las credenciales del banco UNA vez y use el token `bapi_`
    en las demás llamadas. **El mecanismo es uno solo; el esquema de campos es de cada banco** — C6 y
    Sicoob entregan PKCS12 (`pfx_base64` + `pfx_password`), Inter entrega `.crt` + `.key` (`cert_pem`
    + `key_pem`, aceptados en PEM crudo o base64). Integrar un banco nuevo no cambia nada del lado del
    consumidor: el esquema vigente sale en `GET /bancos`.'
- pt: 'Boleto: emitir, consultar, alterar, PDF e baixar. `provider=on` vai à API do banco, `provider=off`
    emite pela engine pyCobrança; `banco` diz qual instituição. Docs oficiais: [C6 Boleto](https://developers.c6bank.com.br/apis/bankslip)
    · [Sicoob Cobrança v3](https://developers.sicoob.com.br/portal/) · [Inter Cobrança v3](https://developers.bancointer.com.br/).


    **Alterar (`PUT`) existe no C6 e no Itaú** — no Sicoob e no Inter o caminho é baixar e reemitir, e
    a rota responde `422` dizendo isso.


    **PDF nem sempre vem do banco.** C6, Sicoob e Inter devolvem em base64; o **Itaú não devolve** — a
    API dele responde linha digitável e código de barras, e o PDF sai da engine (`POST /api/render/boleto`,
    `bank=itau`), com **os dados que o banco registrou**. O código de barras é determinístico: renderizar
    com um nosso número diferente do registrado gera um boleto que não concilia — confira a linha digitável
    antes de entregar ao pagador.


    `GET /bancos` responde a matriz exata, por introspecção.'
  es: 'Boleto: emitir, consultar, modificar, PDF y dar de baja. `provider=on` va a la API del banco, `provider=off`
    emite por la engine pyCobrança; `banco` dice qué institución. Docs oficiales: [C6 Boleto](https://developers.c6bank.com.br/apis/bankslip)
    · [Sicoob Cobrança v3](https://developers.sicoob.com.br/portal/) · [Inter Cobrança v3](https://developers.bancointer.com.br/).


    **Modificar (`PUT`) existe en C6 y en Itaú** — en Sicoob y en Inter el camino es dar de baja y reemitir,
    y la ruta responde `422` diciéndolo.


    **El PDF no siempre viene del banco.** C6, Sicoob e Inter lo devuelven en base64; **Itaú no lo devuelve**
    — su API responde línea digitable y código de barras, y el PDF sale de la engine (`POST /api/render/boleto`,
    `bank=itau`), con **los datos que el banco registró**. El código de barras es determinístico: renderizar
    con un nosso número distinto del registrado genera un boleto que no concilia — compare la línea digitable
    antes de entregarla al pagador.


    `GET /bancos` responde la matriz exacta, por introspección.'
