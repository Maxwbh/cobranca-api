    '
  es: 'Suma de los débitos, en reales — siempre positiva. Con

    `somente_creditos=true` vale `0`.

    '
- pt: Transações no extrato, depois do filtro.
  es: Transacciones en el extracto, después del filtro.
- pt: 'Seis campos, sempre estes. A página já prometeu `name`, `checknum` e

    `refnum`, que a resposta não traz, e chamava o identificador de

    `fitid` — ele vem em **`id`**, e é por ele que se deduplica ao

    reprocessar o mesmo período.

    '
  es: 'Seis campos, siempre estos. La página ya prometió `name`, `checknum` y

    `refnum`, que la respuesta no trae, y llamaba al identificador

    `fitid` — viene en **`id`**, y es por él que se deduplica al

    reprocesar el mismo período.

    '
- pt: 'FITID do arquivo — identificador único da transação no extrato.

    `null` quando o arquivo não o traz.

    '
  es: 'FITID del archivo — identificador único de la transacción en el extracto.

    `null` cuando el archivo no lo trae.

    '
- pt: 'Direção do lançamento, **normalizada** — não é o TRNTYPE cru do

    arquivo. Sai do TRNTYPE e não do sinal, porque a engine devolve

    `valor` sempre positivo.

    '
  es: 'Dirección del movimiento, **normalizada** — no es el TRNTYPE crudo del

    archivo. Sale del TRNTYPE y no del signo, porque la engine devuelve

    `valor` siempre positivo.

    '
- pt: Valor absoluto (sempre positivo — a direção está em `tipo`)
  es: Valor absoluto (siempre positivo — la dirección está en `tipo`)
- pt: Descrição da transação
  es: Descripción de la transacción
- pt: Nosso número extraído do memo com a regra do banco emissor
  es: Nosso número extraído del memo con la regla del banco emisor
- pt: 'Mensagem de erro. `error` é a chave canônica em toda a superfície;

    esta rota respondia só `erro` (em português), que segue presente

    como alias para não quebrar quem já lê por ele.

    '
  es: 'Mensaje de error. `error` es la clave canónica en toda la superficie;

    esta ruta respondía solo `erro` (en portugués), que sigue presente

    como alias para no romper a quien ya lee por él.

    '
- pt: Alias de `error` (compatibilidade).
  es: Alias de `error` (compatibilidad).
- pt: Detalhe do problema como lista (contrato PyCobrança).
  es: Detalle del problema como lista (contrato PyCobrança).
- pt: Mensagem de erro
  es: Mensaje de error
- pt: Lista plana — um item por campo violado (contrato PyCobrança ≥ 1.0.1).
  es: Lista plana — un ítem por campo violado (contrato PyCobrança ≥ 1.0.1).
- pt: 'Só em `/api/retorno`, que usa este nome no lugar de

    `validation_errors` — um item por problema do arquivo.

    '
  es: 'Solo en `/api/retorno`, que usa este nombre en lugar de

    `validation_errors` — un ítem por problema del archivo.

    '
- pt: O que fazer, quando a rota tem o que sugerir.
  es: Qué hacer, cuando la ruta tiene algo que sugerir.
- pt: '`json` (padrão) ou `csv`. O CSV traz as **mesmas dez colunas** do

    `RetornoItem`, sempre todas — vazias quando o arquivo não trouxe o

    campo —, separadas por ponto e vírgula e com vírgula decimal: abre

    direto na planilha. O **cabeçalho** sai no idioma do chamador

    (`Accept-Language: es` ou `lang=es`); os **valores**, não — a

    ocorrência fica no vocabulário do banco, e as datas como ele as

    gravou.

    '
  es: '`json` (default) o `csv`. El CSV trae las **mismas diez columnas** del

    `RetornoItem`, siempre todas — vacías cuando el archivo no trajo el

    campo —, separadas por punto y coma y con coma decimal: se abre

    directo en la planilla. El **encabezado** sale en el idioma de quien llama

    (`Accept-Language: es` o `lang=es`); los **valores**, no — la

    ocurrencia queda en el vocabulario del banco, y las fechas como él las

    grabó.

    '
