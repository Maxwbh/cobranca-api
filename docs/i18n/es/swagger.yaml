  es: 'Incremento de 3 posiciones del campo libre. Obligatorio en **BRB**.

    '
- pt: 'Portfólio de 3 posições do campo livre (**Citibank**). Sem ele o

    código de barras sai com as três posições zeradas — válido em

    estrutura, errado no destino, e sem erro.

    '
  es: 'Portafolio de 3 posiciones del campo libre (**Citibank**). Sin él el

    código de barras sale con las tres posiciones en cero — válido en

    estructura, equivocado en el destino, y sin error.

    '
- pt: Posto da cooperativa (**Sicredi**).
  es: Puesto de la cooperativa (**Sicredi**).
- pt: 'Byte identificador do nosso número. Obrigatório no **Sicredi**.

    '
  es: 'Byte identificador del nosso número. Obligatorio en **Sicredi**.

    '
- pt: 'Número de parcelas do carnê. **No Sicoob entra no campo livre do

    código de barras** — é o único banco onde ele muda o código, e por

    isso está nesta faixa e não entre os campos de impressão.


    O padrão é `001`: omitir num carnê de três parcelas produz um código

    de barras que diz **uma**, estruturalmente válido e com DV

    recalculado sobre o dígito errado — nenhum verificador de estrutura

    acusa. Nos demais bancos é só impresso.

    '
  es: 'Número de cuotas del carnet. **En Sicoob entra en el campo libre del

    código de barras** — es el único banco donde cambia el código, y por

    eso está en esta franja y no entre los campos de impresión.


    El default es `001`: omitirlo en un carnet de tres cuotas produce un código

    de barras que dice **una**, estructuralmente válido y con DV

    recalculado sobre el dígito equivocado — ningún verificador de estructura

    lo acusa. En los demás bancos solo se imprime.

    '
- pt: "⚠️ **Não é enviado ao boleto e não é impresso.** O campo é\naceito e descartado na emissão: a faixa\
    \ FEBRABAN\n— `(-) Desconto/Abatimento`, `(+) Mora/Multa`, `(=) Valor cobrado` —\nsai **em branco**\
    \ no PDF, sempre.\n\nDesconto, multa e juros dependem da **data do pagamento**, que não\nse sabe na\
    \ emissão: quem calcula e escreve na faixa é o caixa, no\nato. Número impresso antes disso induz o\
    \ pagador a erro, e estaria\nerrado em qualquer data que não a suposta.\n\nO campo é aceito porque\
    \ o mesmo registro de cobrança costuma\nalimentar o boleto **e** a remessa; recusar obrigaria a montar\
    \ dois\nobjetos para o mesmo título. Onde ele tem efeito de verdade:\n\n- a **regra** vai em `instrucoes`,\
    \ impressa no boleto (\"após o\n  vencimento, multa de 2% e juros de 1% ao mês\");\n- o **valor**\
    \ vai na remessa CNAB (`POST /api/remessa`), no\n  `Pagamento` — é o arquivo que o banco processa\
    \ para calcular na\n  data em que o título for pago.\n\n  Aqui: `cod_desconto` + `valor_desconto`\
    \ + `data_desconto`.\n"
  es: "⚠️ **No se envía al boleto y no se imprime.** El campo es\naceptado y descartado en la emisión:\
    \ la franja FEBRABAN\n— `(-) Desconto/Abatimento`, `(+) Mora/Multa`, `(=) Valor cobrado` —\nsale **en\
    \ blanco** en el PDF, siempre.\n\nDescuento, multa e intereses dependen de la **fecha del pago**,\
    \ que no\nse sabe en la emisión: quien calcula y escribe en la franja es el cajero, en el\nacto. Un\
    \ número impreso antes de eso induce al pagador a error, y estaría\nequivocado en cualquier fecha\
    \ que no fuera la supuesta.\n\nEl campo se acepta porque el mismo registro de cobranza suele\nalimentar\
    \ el boleto **y** la remesa; rechazarlo obligaría a montar dos\nobjetos para el mismo título. Dónde\
    \ tiene efecto de verdad:\n\n- la **regla** va en `instrucoes`, impresa en el boleto (\"después del\n\
    \  vencimiento, multa del 2% e intereses del 1% mensual\");\n- el **valor** va en la remesa CNAB (`POST\
    \ /api/remessa`), en el\n  `Pagamento` — es el archivo que el banco procesa para calcular en la\n\
    \  fecha en que el título sea pagado.\n\n  Aquí: `cod_desconto` + `valor_desconto` + `data_desconto`.\n"
