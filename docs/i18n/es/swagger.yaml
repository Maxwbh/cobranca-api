    `pagina` começa em **1**, como no resto da API. O Inter pagina a partir de

    zero e o provider converte: repassar a página crua devolveria a segunda

    para quem pediu a primeira, sem erro nenhum.'
  es: 'Boletos del período — la colección que la API no sabía devolver.


    `pagina` empieza en **1**, como en el resto de la API. Inter pagina desde

    cero y el provider convierte: pasar la página cruda devolvería la segunda a

    quien pidió la primera, sin ningún error.'
