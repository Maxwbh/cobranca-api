- pt: Gerar múltiplos boletos · 📄 resposta binária
  es: Generar múltiples boletos · 📄 respuesta binaria
- pt: 'Gera múltiplos boletos em um único arquivo.


    **Lote resiliente:** a falha de um item **não** cancela o lote. O PDF sai

    com os itens válidos e o resultado por item vem nos headers

    `X-Boletos-Info` (ok), `X-Boletos-Errors`, `X-Boletos-Failed` e

    `X-Batch-Status` (`completed` | `partially_completed`). Com

    `include_data=true`, o JSON traz `{status, total, completed, failed,

    boletos, erros}`. **400** só quando nenhum item é válido.


    ⚠️ **Limite**: `LOTE_MAX_ITENS` (default **200**) — acima disso responde

    **413**; para lotes maiores use processamento assíncrono

    (ver `docs/development/plano-jobs-lote.md`).

    '
  es: 'Genera múltiples boletos en un único archivo.


    **Lote resiliente:** la falla de un ítem **no** cancela el lote. El PDF sale

    con los ítems válidos y el resultado por ítem viene en los headers

    `X-Boletos-Info` (ok), `X-Boletos-Errors`, `X-Boletos-Failed` y

    `X-Batch-Status` (`completed` | `partially_completed`). Con

    `include_data=true`, el JSON trae `{status, total, completed, failed,

    boletos, erros}`. **400** solo cuando ningún ítem es válido.


    ⚠️ **Límite**: `LOTE_MAX_ITENS` (default **200**) — por encima de eso responde

    **413**; para lotes mayores use el procesamiento asincrónico

    (ver `docs/development/plano-jobs-lote.md`).

    '
- pt: Formato de saída (só `pdf`; qualquer outro responde 400).
  es: Formato de salida (solo `pdf`; cualquier otro responde 400).
- pt: 'Se `true`, retorna JSON com os metadados de cada boleto + o PDF

    combinado em base64. Caso contrário, retorna o binário + os

    headers `X-Boletos-*`.

    '
  es: 'Si es `true`, devuelve JSON con los metadatos de cada boleto + el PDF

    combinado en base64. En caso contrario, devuelve el binario + los

    headers `X-Boletos-*`.

    '
