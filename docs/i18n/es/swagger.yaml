    Só as cobranças enviadas são revisadas; as demais do lote ficam como estão.

    Vale para qualquer provider de dialeto BACEN — C6, Sicoob e Inter.'
  es: 'Revisa cobranzas dentro de un lote de cobv (PATCH BACEN `/lotecobv/{id}`).


    Solo se revisan las cobranzas enviadas; las demás del lote quedan como están.

    Vale para cualquier provider de dialecto BACEN — C6, Sicoob e Inter.'
