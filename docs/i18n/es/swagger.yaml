- pt: 'Modelo visual do PDF. O padrão é `moderno`, que traz **o logo do

    banco emissor** no cabeçalho — vale para todos os bancos com marca

    empacotada na engine (o Citibank não tem, e cai na sigla). Envie

    `logo` em `data` para usar a sua própria imagem.


    `classico` também está disponível nesta rota. O template `carne`

    (3 vias por A4) vale em `/api/boleto/multi` e `/api/render/carne`.


    A faixa de marca opcional é montada a partir dos campos passados em

    `data` (ver schema `BoletoData`: `logo_empresa`, `cor_marca`,

    `marca_dagua`, `rodape_contato`, `parcela_atual`, `total_parcelas`)

    e **só existe no `moderno`** — pedi-la com `classico` responde `400`

    em vez de devolver um boleto sem marca alguma.

    '
  es: 'Modelo visual del PDF. El default es `moderno`, que trae **el logo del

    banco emisor** en el encabezado — vale para todos los bancos con marca

    empaquetada en la engine (Citibank no la tiene, y cae en la sigla). Envíe

    `logo` en `data` para usar su propia imagen.


    `classico` también está disponible en esta ruta. El template `carne`

    (3 vías por A4) vale en `/api/boleto/multi` y `/api/render/carne`.


    La franja de marca opcional se monta a partir de los campos pasados en

    `data` (ver schema `BoletoData`: `logo_empresa`, `cor_marca`,

    `marca_dagua`, `rodape_contato`, `parcela_atual`, `total_parcelas`)

    y **solo existe en el `moderno`** — pedirla con `classico` responde `400`

    en vez de devolver un boleto sin marca alguna.

    '
- pt: 'Sem include_data: arquivo binário + headers `X-Nosso-Numero*`.

    Com include_data=true: JSON contendo dados + `content_base64`.

    '
  es: 'Sin include_data: archivo binario + headers `X-Nosso-Numero*`.

    Con include_data=true: JSON con los datos + `content_base64`.

    '
- pt: 'Nosso número como veio no payload — a API **não** completa com

    zeros à esquerda; quem pede `123` recebe `123`. O preenchimento

    aparece no formatado.

    '
  es: 'Nosso número tal como vino en el payload — la API **no** completa con

    ceros a la izquierda; quien pide `123` recibe `123`. El relleno

    aparece en el formateado.

    '
