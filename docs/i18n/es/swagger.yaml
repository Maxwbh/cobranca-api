# Dicionário PT -> ES dos textos do Swagger (gateway e offline).
#
# A spec é gerada do código, em português; esta é a MESMA spec com os textos
# trocados. O português inteiro é a chave: mudou uma palavra no código, a
# entrada deixa de casar e `tests/test_swagger_em_espanhol.py` acusa — a
# tradução não envelhece em silêncio.
#
# Para listar o que falta: PYTHONPATH=gateway python scripts/gerar-swagger-estatico.py --faltam-es
textos:
- pt: "Serviço único de cobrança **100% Python** — **4 bancos ON** (**C6** 336 · **Sicoob** 756 · **Inter**\
    \ 077 · **Itaú** 341) **e 19 OFF** pela engine [pyCobrança](https://github.com/Maxwbh/pyCobranca)\
    \ embutida.\n\nO Itaú entra com o provider REST implementado e **desligado por padrão** (`ITAU_REGISTERED_READY`):\
    \ sem a flag, ele emite pela engine, que tem o layout 341. `GET /bancos` diz o que **esta instalação**\
    \ faz com cada um.\n\n**Dois eixos, dois campos:** `provider` é o **caminho** — `on` (API do banco)\
    \ ou `off` (engine pyCobrança) — e `banco` é a **instituição** (`c6`, `sicoob`, `itau`, `banco_brasil`…).\
    \ Trocar de caminho é trocar `provider`; o `banco` fica. O nome do banco no `provider` (`provider=c6`)\
    \ segue aceito como **apelido legado** e sai na 4.0.0.\n\n**Nem todo banco faz tudo** — e isso é dado,\
    \ não parágrafo: `GET /bancos` devolve as capacidades por **introspecção das classes de provider**,\
    \ então não há como a lista envelhecer. Ele diz também o que **esta instalação** faz com cada banco\
    \ (`registrado_pronto`, `fallback_offline`, `caminho_efetivo`) — capacidade do banco e caminho da\
    \ instalação são coisas diferentes. Pedir ao banco algo que ele não oferece responde `422` dizendo\
    \ **para onde ir**, nunca `500`.\n\n**Superfície offline (`/api/*`):** boleto/CNAB/OFX de **19 bancos**\
    \ sem banco online, gerada **nativamente** pela pyCobrança no próprio processo (sem sidecar) e sem\
    \ autenticação — doc própria em [**Swagger Offline → `/api/docs`**](/api/docs) ([spec](/api/openapi.yaml)).\n\
    \n**Produto standalone** consumido por múltiplos sistemas; escopo por `tenant_id`. **Instalação em\
    \ uma linha** — imagem pronta publicada a cada release: `docker run -p 8000:8000 ghcr.io/maxwbh/cobranca-api:latest`.\
    \ Documentação completa: [maxwbh.github.io/cobranca-api](https://maxwbh.github.io/cobranca-api/).\n\
    \n### Emissão em lote — qual caminho usar\n\n| Volume | Caminho | O que devolve |\n|---|---|---|\n\
    | até **200** | `POST /api/boleto/multi` | **um PDF** com o lote (síncrono) |\n| até **200** | `POST\
    \ /jobs/boletos` | **202 + `job_id`**: artefatos, estado e webhook |\n| acima de 200 | dividir em\
    \ jobs de até 200 | ambos respondem **413** acima do teto |\n\n`LOTE_MAX_ITENS` e `JOB_MAX_ITENS`\
    \ (default **200**) limitam os **dois** caminhos. O limite protege **memória** — o PDF do lote é montado\
    \ em RAM —, não tempo: o custo por boleto é o mesmo lote a lote.\n\n**Referência medida** (HML, free\
    \ tier, engine offline): ~**65 ms por boleto**, estável de 50 a 200 itens — 100 boletos ≈ 7 s, 200\
    \ ≈ 14 s. O job **não é mais rápido** (mesma engine, `BackgroundTasks` no mesmo processo): ele devolve\
    \ em ~0,4 s em vez de segurar a conexão, e entrega estado consultável, artefatos com `sha256` e webhook\
    \ de conclusão.\n\n**Push de eventos (saída, não é um path desta API):** ao receber o webhook do banco,\
    \ o gateway envia o evento normalizado (`WebhookEvent`) por `POST` ao consumidor dono do tenant, assinado\
    \ em `X-Signature: sha256=<hmac_sha256(secret, raw_body)>`. Destino por tenant via `SUB__<tenant>__URL/SECRET`,\
    \ com fallback global `EVENT_WEBHOOK_URL/SECRET`.\n\n**Respostas `dict` (passthrough):** rotas Pix/Pix\
    \ Automático/extrato/conciliação devolvem o corpo do banco como veio (padrão BACEN/documentação do\
    \ banco), sem re-tipagem — o contrato é o do banco; o gateway normaliza autenticação, multi-tenant\
    \ e erros.\n\n### Como testar (serviço único)\n\n```bash\n# 1. As duas superfícies na mesma URL\n\
    curl {base}/health          # gateway\ncurl {base}/api/health      # engine offline (pyCobrança)\n\
    \n# 2. Boleto offline em PDF (sem credencial)\ncurl -G {base}/api/boleto --data-urlencode 'bank=banco_brasil'\
    \ \\\n  --data-urlencode 'type=pdf' --data-urlencode 'data={...json do boleto...}' -o boleto.pdf\n\
    \n# 3. Cobrança registrada (após POST /credenciais -> token bapi_)\ncurl -X POST {base}/cobranca -H\
    \ 'Authorization: Bearer bapi_...' \\\n  -H 'Content-Type: application/json' -d '{...CobrancaIn...}'\n\
    ```\n\n---\n\n**Documentação oficial dos bancos:** [C6 Bank](https://developers.c6bank.com.br) · [Sicoob](https://developers.sicoob.com.br/portal/)\
    \ · [Pix BACEN](https://bacen.github.io/pix-api/) — guias de integração por banco (incl. catálogo\
    \ de serviços): [repositório](https://github.com/Maxwbh/cobranca-api/tree/main/docs/development)."
  es: "Servicio único de cobranza **100% Python** — **4 bancos ON** (**C6** 336 · **Sicoob** 756 · **Inter**\
    \ 077 · **Itaú** 341) **y 19 OFF** mediante la engine [pyCobrança](https://github.com/Maxwbh/pyCobranca)\
    \ embebida.\n\nItaú entra con el provider REST implementado y **apagado por defecto** (`ITAU_REGISTERED_READY`):\
    \ sin la flag, emite por la engine, que tiene el layout 341. `GET /bancos` dice qué hace **esta instalación**\
    \ con cada uno.\n\n**Dos ejes, dos campos:** `provider` es el **camino** — `on` (API del banco) u\
    \ `off` (engine pyCobrança) — y `banco` es la **institución** (`c6`, `sicoob`, `itau`, `banco_brasil`…).\
    \ Cambiar de camino es cambiar `provider`; el `banco` queda. El nombre del banco en `provider` (`provider=c6`)\
    \ sigue aceptado como **alias heredado** y sale en la 4.0.0.\n\n**No todo banco hace todo** — y eso\
    \ es dato, no párrafo: `GET /bancos` devuelve las capacidades por **introspección de las clases de\
    \ provider**, así que la lista no puede envejecer. Dice también qué hace **esta instalación** con\
    \ cada banco (`registrado_pronto`, `fallback_offline`, `caminho_efetivo`) — capacidad del banco y\
    \ camino de la instalación son cosas distintas. Pedirle al banco algo que no ofrece responde `422`\
    \ diciendo **adónde ir**, nunca `500`.\n\n**Superficie offline (`/api/*`):** boleto/CNAB/OFX de **19\
    \ bancos** sin banco online, generada **nativamente** por pyCobrança en el propio proceso (sin sidecar)\
    \ y sin autenticación — documentación propia en [**Swagger Offline → `/api/docs`**](/api/docs) ([spec](/api/openapi.yaml)).\n\
    \n**Producto standalone** consumido por múltiples sistemas; alcance por `tenant_id`. **Instalación\
    \ en una línea** — imagen lista publicada en cada release: `docker run -p 8000:8000 ghcr.io/maxwbh/cobranca-api:latest`.\
    \ Documentación completa: [maxwbh.github.io/cobranca-api](https://maxwbh.github.io/cobranca-api/).\n\
    \n### Emisión en lote — qué camino usar\n\n| Volumen | Camino | Qué devuelve |\n|---|---|---|\n| hasta\
    \ **200** | `POST /api/boleto/multi` | **un PDF** con el lote (sincrónico) |\n| hasta **200** | `POST\
    \ /jobs/boletos` | **202 + `job_id`**: artefactos, estado y webhook |\n| más de 200 | dividir en jobs\
    \ de hasta 200 | ambos responden **413** por encima del tope |\n\n`LOTE_MAX_ITENS` y `JOB_MAX_ITENS`\
    \ (default **200**) limitan los **dos** caminos. El límite protege **memoria** — el PDF del lote se\
    \ monta en RAM —, no tiempo: el costo por boleto es el mismo lote a lote.\n\n**Referencia medida**\
    \ (HML, free tier, engine offline): ~**65 ms por boleto**, estable de 50 a 200 ítems — 100 boletos\
    \ ≈ 7 s, 200 ≈ 14 s. El job **no es más rápido** (misma engine, `BackgroundTasks` en el mismo proceso):\
    \ devuelve en ~0,4 s en vez de retener la conexión, y entrega estado consultable, artefactos con `sha256`\
    \ y webhook de conclusión.\n\n**Push de eventos (salida, no es un path de esta API):** al recibir\
    \ el webhook del banco, el gateway envía el evento normalizado (`WebhookEvent`) por `POST` al consumidor\
    \ dueño del tenant, firmado en `X-Signature: sha256=<hmac_sha256(secret, raw_body)>`. Destino por\
    \ tenant vía `SUB__<tenant>__URL/SECRET`, con fallback global `EVENT_WEBHOOK_URL/SECRET`.\n\n**Respuestas\
    \ `dict` (passthrough):** las rutas Pix/Pix Automático/extracto/conciliación devuelven el cuerpo del\
    \ banco tal como vino (estándar BACEN/documentación del banco), sin re-tipado — el contrato es el\
    \ del banco; el gateway normaliza autenticación, multi-tenant y errores.\n\n### Cómo probar (servicio\
    \ único)\n\n```bash\n# 1. Las dos superficies en la misma URL\ncurl {base}/health          # gateway\n\
    curl {base}/api/health      # engine offline (pyCobrança)\n\n# 2. Boleto offline en PDF (sin credencial)\n\
    curl -G {base}/api/boleto --data-urlencode 'bank=banco_brasil' \\\n  --data-urlencode 'type=pdf' --data-urlencode\
    \ 'data={...json del boleto...}' -o boleto.pdf\n\n# 3. Cobranza registrada (tras POST /credenciais\
    \ -> token bapi_)\ncurl -X POST {base}/cobranca -H 'Authorization: Bearer bapi_...' \\\n  -H 'Content-Type:\
    \ application/json' -d '{...CobrancaIn...}'\n```\n\n---\n\n**Documentación oficial de los bancos:**\
    \ [C6 Bank](https://developers.c6bank.com.br) · [Sicoob](https://developers.sicoob.com.br/portal/)\
    \ · [Pix BACEN](https://bacen.github.io/pix-api/) — guías de integración por banco (incl. catálogo\
    \ de servicios): [repositorio](https://github.com/Maxwbh/cobranca-api/tree/main/docs/development)."
- pt: Catálogo de bancos desta instalação
  es: Catálogo de bancos de esta instalación
- pt: 'Bancos disponíveis, caminho (on/off) de cada um, capacidades reais e como autenticar.


    É a rota para onde o resto da documentação manda quem precisa da matriz

    exata — e ela respondia com `summary: "Listar"` e schema "objeto qualquer".

    Os campos que decidem integração estão descritos no schema da resposta.'
  es: 'Bancos disponibles, camino (on/off) de cada uno, capacidades reales y cómo autenticarse.


    Es la ruta adonde el resto de la documentación manda a quien necesita la matriz

    exacta — y respondía con `summary: "Listar"` y schema "objeto cualquiera".

    Los campos que deciden la integración están descritos en el schema de la respuesta.'
- pt: Successful Response
  es: Respuesta exitosa
- pt: O que `on` e `off` significam, e o apelido legado.
  es: Qué significan `on` y `off`, y el alias heredado.
- pt: Como autenticar — igual para todos os bancos.
  es: Cómo autenticarse — igual para todos los bancos.
- pt: Valor aceito em `banco` (e no `provider` legado).
  es: Valor aceptado en `banco` (y en el `provider` heredado).
- pt: COMPE. `null` no registro da engine, que não é um banco.
  es: COMPE. `null` en el registro de la engine, que no es un banco.
- pt: 'Caminhos que ESTE banco tem. O Inter só tem `on`: não há layout offline dele, e cair na engine
    emitiria um boleto de outro banco.'
  es: 'Caminos que tiene ESTE banco. Inter solo tiene `on`: no hay layout offline de él, y caer en la
    engine emitiría un boleto de otro banco.'
- pt: A flag desta instalação está ligada.
  es: La flag de esta instalación está encendida.
- pt: '**O que acontece de fato** ao pedir `provider=on` agora. Com a flag desligada e havendo fallback,
    vira `off` — a chamada responde `201` sem ter passado pelo banco.'
  es: '**Lo que ocurre de hecho** al pedir `provider=on` ahora. Con la flag apagada y habiendo fallback,
    pasa a `off` — la llamada responde `201` sin haber pasado por el banco.'
- pt: Slug da engine usado quando o `on` é rebaixado.
  es: Slug de la engine usado cuando el `on` se degrada.
- pt: Variável de ambiente que liga o caminho `on`.
  es: Variable de entorno que enciende el camino `on`.
- pt: Introspectadas das classes de provider — método sobrescrito = capacidade real, então a lista não
    envelhece com o código. Capacidade herdada de mixin só entra aqui depois de CONFIRMADA no banco; até
    lá aparece em `capacidades_nao_confirmadas`.
  es: Introspectadas de las clases de provider — método sobrescrito = capacidad real, así que la lista
    no envejece con el código. Una capacidad heredada de un mixin solo entra aquí después de CONFIRMADA
    en el banco; hasta entonces aparece en `capacidades_nao_confirmadas`.
- pt: '`capacidade -> variável que a libera`. O provider tem o dialeto e ninguém confirmou que ESTE banco
    expõe as rotas — dizer que ele não oferece seria outra afirmação sem lastro. Confirme com credencial
    real e ligue a variável.'
  es: '`capacidad -> variable que la libera`. El provider tiene el dialecto y nadie confirmó que ESTE
    banco expone las rutas — decir que no las ofrece sería otra afirmación sin respaldo. Confirme con
    credencial real y encienda la variable.'
- pt: Esquema de credenciais DESTE banco, para o `POST /credenciais`. O mecanismo é um só; os campos são
    de cada instituição.
  es: Esquema de credenciales de ESTE banco, para el `POST /credenciais`. El mecanismo es uno solo; los
    campos son de cada institución.
- pt: 'Só no registro da engine: os 18 slugs do catálogo offline.'
  es: 'Solo en el registro de la engine: los 18 slugs del catálogo offline.'
- pt: 'Só no registro da engine: quando ela entra sem ninguém pedir.'
  es: 'Solo en el registro de la engine: cuándo entra sin que nadie lo pida.'
- pt: Cadastrar
  es: Registrar credenciales
- pt: 'Armazena as credenciais cifradas (chave derivada do token) e devolve o token.


    O token é exibido UMA única vez — o servidor não consegue recuperá-lo nem

    decifrar as credenciais sem ele. Use-o nas demais rotas via

    `Authorization: Bearer bapi_...`.'
  es: 'Almacena las credenciales cifradas (clave derivada del token) y devuelve el token.


    El token se muestra UNA sola vez — el servidor no puede recuperarlo ni

    descifrar las credenciales sin él. Úselo en las demás rutas vía

    `Authorization: Bearer bapi_...`.'
- pt: Validation Error
  es: Error de validación
- pt: Token inválido, revogado ou de outro tenant.
  es: Token inválido, revocado o de otro tenant.
- pt: Revogar
  es: Revocar
- pt: Revoga o token imediatamente (apaga o registro cifrado).
  es: Revoca el token de inmediato (borra el registro cifrado).
- pt: Bearer bapi_...
  es: Bearer bapi_...
- pt: Consultar
  es: Consultar
- pt: 'O que está guardado sob este token — **sem** o segredo.


    Existe por causa de uma pergunta que a API não sabia responder: *quando a

    minha integração para de funcionar?* O certificado mTLS dos bancos vale um

    ano e não tem renovação in-place — vence, e toda chamada passa a falhar no

    handshake de uma vez, sem nada no código ter mudado.


    Responde também *qual* certificado está em uso, que é onde a confusão

    acontece de verdade: os bancos entregam pacotes com mais de um, e o ambiente

    está no **host** dentro do CN (`baas-api-sandbox` × `baas-api`). Carregar o

    do ambiente errado só aparecia no primeiro handshake.


    O `token` volta mascarado: ele é exibido uma única vez, no cadastro, e o

    servidor não consegue recuperá-lo — devolvê-lo aqui seria mentira.'
  es: 'Lo que está guardado bajo este token — **sin** el secreto.


    Existe por una pregunta que la API no sabía responder: *¿cuándo deja de

    funcionar mi integración?* El certificado mTLS de los bancos vale un año y no

    tiene renovación in-place — vence, y toda llamada pasa a fallar en el

    handshake de una vez, sin que nada en el código haya cambiado.


    Responde también *cuál* certificado está en uso, que es donde la confusión

    ocurre de verdad: los bancos entregan paquetes con más de uno, y el ambiente

    está en el **host** dentro del CN (`baas-api-sandbox` × `baas-api`). Cargar el

    del ambiente equivocado solo aparecía en el primer handshake.


    El `token` vuelve enmascarado: se muestra una sola vez, en el registro, y el

    servidor no puede recuperarlo — devolverlo aquí sería mentira.'
- pt: Registrar cobrança (boleto)
  es: Registrar cobranza (boleto)
- pt: 'Registra a cobrança (boleto). Dois eixos: `provider` diz o **caminho** —

    `on` = API REST do banco, `off` (default) = CNAB offline pela engine

    pyCobrança — e `banco` diz a **instituição** (`c6`, `sicoob`, `itau`…).


    O nome do banco no `provider` (`provider=c6`) segue aceito como apelido de

    `on` + `banco`, e sai na 4.0.0. Resposta normalizada, igual nos dois

    caminhos. Combinação que não existe responde `422` dizendo quais existem.'
  es: 'Registra la cobranza (boleto). Dos ejes: `provider` dice el **camino** —

    `on` = API REST del banco, `off` (default) = CNAB offline por la engine

    pyCobrança — y `banco` dice la **institución** (`c6`, `sicoob`, `itau`…).


    El nombre del banco en `provider` (`provider=c6`) sigue aceptado como alias de

    `on` + `banco`, y sale en la 4.0.0. Respuesta normalizada, igual en los dos

    caminos. Una combinación que no existe responde `422` diciendo cuáles existen.'
- pt: Bearer bapi_... (token do /credenciais)
  es: Bearer bapi_... (token del /credenciais)
- pt: 'Cobrança registrada. **Cheque `status`**: por compatibilidade, dados recusados pela engine também
    respondem `201`, com `status: "erro"`, `id: null` e sem `Location`. `COBRANCA_ERRO_HTTP=1` faz esse
    caso responder `422`, que passa a ser o default na 4.0.0.'
  es: 'Cobranza registrada. **Revise `status`**: por compatibilidad, los datos rechazados por la engine
    también responden `201`, con `status: "erro"`, `id: null` y sin `Location`. `COBRANCA_ERRO_HTTP=1`
    hace que ese caso responda `422`, que pasa a ser el default en la 4.0.0.'
- pt: URL de consulta do recurso criado, já com tenant_id, provider e banco
  es: URL de consulta del recurso creado, ya con tenant_id, provider y banco
- pt: 'Três origens, distinguíveis pelo corpo:


    1. **Validação do contrato** (`detail` em lista) — o corpo ou a query não batem com o schema;

    2. **Capacidade ausente** (`detail` em texto) — o banco não oferece a operação; a mensagem diz para
    onde ir. Confira em `GET /bancos`;

    3. **O banco recusou os dados** (`400`/`422`/`405` no upstream) — traz `upstream` com a resposta original.
    Re-tentar igual não resolve.'
  es: 'Tres orígenes, distinguibles por el cuerpo:


    1. **Validación del contrato** (`detail` en lista) — el cuerpo o la query no coinciden con el schema;

    2. **Capacidad ausente** (`detail` en texto) — el banco no ofrece la operación; el mensaje dice adónde
    ir. Verifique en `GET /bancos`;

    3. **El banco rechazó los datos** (`400`/`422`/`405` en el upstream) — trae `upstream` con la respuesta
    original. Reintentar igual no resuelve.'
- pt: Token `bapi_` ausente do cofre, inválido ou revogado.
  es: Token `bapi_` ausente de la bóveda, inválido o revocado.
- pt: 'O token não é deste par tenant+**banco**. O `bapi_` amarra os dois: token do C6 numa rota do Sicoob
    é recusado de propósito, e o mesmo vale para o token de outro tenant.'
  es: 'El token no es de este par tenant+**banco**. El `bapi_` ata a los dos: un token del C6 en una ruta
    del Sicoob se rechaza a propósito, y lo mismo vale para el token de otro tenant.'
- pt: Recurso não encontrado no banco.
  es: Recurso no encontrado en el banco.
- pt: 'Conflito no banco: já existe, ou o estado não permite. Inclui o **registro assíncrono na CIP ainda
    em curso** (`ProcessamentoPendente`) — nesse caso é transitório e a mesma chamada funciona em instantes.'
  es: 'Conflicto en el banco: ya existe, o el estado no lo permite. Incluye el **registro asincrónico
    en la CIP aún en curso** (`ProcessamentoPendente`) — en ese caso es transitorio y la misma llamada
    funciona en instantes.'
- pt: 'Credenciais: ausentes no cofre para o par tenant/**banco** (a credencial é da instituição, não
    do caminho), ou rejeitadas pelo banco. Todo erro no endpoint de **token** responde `424`, qualquer
    que seja o status do banco — o Inter, por exemplo, devolve `400` para `client_credentials` inválido,
    e chamar aquilo de payload inválido manda procurar defeito no lugar errado.'
  es: 'Credenciales: ausentes en la bóveda para el par tenant/**banco** (la credencial es de la institución,
    no del camino), o rechazadas por el banco. Todo error en el endpoint de **token** responde `424`,
    cualquiera sea el status del banco — Inter, por ejemplo, devuelve `400` para `client_credentials`
    inválido, y llamar a eso payload inválido manda a buscar el defecto en el lugar equivocado.'
- pt: Limite de requisições do banco atingido. O `Retry-After` é repassado quando o banco o envia.
  es: Límite de solicitudes del banco alcanzado. El `Retry-After` se reenvía cuando el banco lo manda.
- pt: Falha do banco (`5xx` ou status não mapeado) — re-tentar com backoff.
  es: Falla del banco (`5xx` o status no mapeado) — reintentar con backoff.
- pt: Banco indisponível ou tempo esgotado (rede/timeout).
  es: Banco no disponible o tiempo agotado (red/timeout).
- pt: Consulta o status normalizado do boleto (registrado|pendente|liquidado|baixado).
  es: Consulta el status normalizado del boleto (registrado|pendente|liquidado|baixado).
- pt: Identificador do tenant — é ele que resolve as credenciais do banco no cofre. Não é o número da
    conta.
  es: Identificador del tenant — es el que resuelve las credenciales del banco en la bóveda. No es el
    número de cuenta.
- pt: '**Caminho**: `on` = API do banco · `off` = engine pyCobrança. Diz por onde, não qual banco — a
    instituição é o `banco`. Nome de banco aqui (`c6`) é apelido legado de `on` + `banco`, e sai na 4.0.0.'
  es: '**Camino**: `on` = API del banco · `off` = engine pyCobrança. Dice por dónde, no qué banco — la
    institución es el `banco`. Un nombre de banco aquí (`c6`) es alias heredado de `on` + `banco`, y sale
    en la 4.0.0.'
- pt: Instituição (`c6`, `sicoob`, `inter`, `itau`…). Use com `provider=on`. Omitido, o `provider` legado
    (nome do banco) resolve.
  es: Institución (`c6`, `sicoob`, `inter`, `itau`…). Úselo con `provider=on`. Omitido, el `provider`
    heredado (nombre del banco) resuelve.
- pt: Conta no banco, quando a consulta exige. O Sicoob identifica o boleto por numeroCliente + codigoModalidade
    + nossoNumero; o C6 identifica só pelo id e ignora estes campos.
  es: Cuenta en el banco, cuando la consulta lo exige. Sicoob identifica el boleto por numeroCliente +
    codigoModalidade + nossoNumero; C6 lo identifica solo por el id e ignora estos campos.
- pt: 'Credenciais do banco (JSON em base64) — só memória, nunca persistidas. Fallback: cofre VAULT__*.'
  es: 'Credenciales del banco (JSON en base64) — solo memoria, nunca persistidas. Fallback: bóveda VAULT__*.'
- pt: Alterar
  es: Modificar
- pt: Altera boleto emitido (amount, due_date, discount, interest, fine).
  es: Modifica un boleto emitido (amount, due_date, discount, interest, fine).
- pt: Baixar
  es: Dar de baja
- pt: Baixa/cancela o boleto (409 enquanto a CIP processa o registro).
  es: Da de baja/cancela el boleto (409 mientras la CIP procesa el registro).
- pt: PDF do boleto
  es: PDF del boleto
- pt: 'PDF do boleto registrado — **quando o banco fornece**.


    C6, Sicoob e Inter devolvem o PDF em base64. O **Itaú não**: a API dele responde

    linha digitável e código de barras, e o desenho é renderizar pela engine,

    que já tem o layout 341. Nesse caso a rota responde `422` dizendo o caminho

    exato — `POST /api/render/boleto` com `bank` do banco e **os dados que o

    banco registrou**.


    A ressalva do `422` não é formalidade: o código de barras é determinístico,

    então renderizar com um nosso número diferente do registrado produz um

    boleto que ninguém concilia. Confira a linha digitável calculada contra a

    que o banco devolveu antes de entregar ao pagador.'
  es: 'PDF del boleto registrado — **cuando el banco lo provee**.


    C6, Sicoob e Inter devuelven el PDF en base64. **Itaú no**: su API responde

    línea digitable y código de barras, y el dibujo es renderizar por la engine,

    que ya tiene el layout 341. En ese caso la ruta responde `422` diciendo el

    camino exacto — `POST /api/render/boleto` con el `bank` del banco y **los

    datos que el banco registró**.


    La salvedad del `422` no es formalidad: el código de barras es determinístico,

    así que renderizar con un nosso número distinto del registrado produce un

    boleto que nadie concilia. Compare la línea digitable calculada contra la que

    el banco devolvió antes de entregarla al pagador.'
- pt: Gerar carnê
  es: Generar carnet
- pt: 'Registra N parcelas no provider e monta o carnê (3-vias A4) no engine.


    Bancos registram cobranças individuais; o PDF de carnê é montado

    in-process pela engine pyCobrança. Quando o banco devolve um nosso_numero

    registrado, ele é repassado ao render para o carnê bater com a cobrança.


    **Tudo que dá para recusar é recusado ANTES do registro**: lote acima do

    teto, parcela duplicada, banco sem layout e dado que a engine não desenha.

    Depois do primeiro `registrar` existe boleto no banco, e um erro ali deixa

    títulos vivos que a resposta não menciona.'
  es: 'Registra N cuotas en el provider y monta el carnet (3 vías A4) en la engine.


    Los bancos registran cobranzas individuales; el PDF del carnet se monta

    in-process por la engine pyCobrança. Cuando el banco devuelve un nosso_numero

    registrado, se pasa al render para que el carnet coincida con la cobranza.


    **Todo lo que se puede rechazar se rechaza ANTES del registro**: lote por

    encima del tope, cuota duplicada, banco sin layout y dato que la engine no

    dibuja. Después del primer `registrar` existe un boleto en el banco, y un error

    ahí deja títulos vivos que la respuesta no menciona.'
- pt: Lote acima de 200 parcelas
  es: Lote por encima de 200 cuotas
- pt: Criar Job Boletos
  es: Crear Job de Boletos
- pt: 'Cria um job de emissão em lote e responde **202** com o `job_id`.


    Corpo: `{tenant_id, boletos: [...], template?}`. Cada item aceita

    `external_id` (idempotência por item) além dos campos do boleto e `bank`.'
  es: 'Crea un job de emisión en lote y responde **202** con el `job_id`.


    Cuerpo: `{tenant_id, boletos: [...], template?}`. Cada ítem acepta

    `external_id` (idempotencia por ítem) además de los campos del boleto y `bank`.'
- pt: Acima de JOB_MAX_ITENS (default 200) — divida o volume em jobs menores.
  es: Por encima de JOB_MAX_ITENS (default 200) — divida el volumen en jobs menores.
- pt: Campos do boleto (mesmos de /api/boleto) + `bank` e, opcionalmente, `external_id` para idempotência
    por item.
  es: Campos del boleto (los mismos de /api/boleto) + `bank` y, opcionalmente, `external_id` para idempotencia
    por ítem.
- pt: 'Idempotência por item: repetir não duplica.'
  es: 'Idempotencia por ítem: repetir no duplica.'
- pt: Consultar Job
  es: Consultar Job
- pt: Estado do job + contadores (received/processing/completed/partially_completed/failed).
  es: Estado del job + contadores (received/processing/completed/partially_completed/failed).
- pt: Job não encontrado para o tenant.
  es: Job no encontrado para el tenant.
- pt: Listar Itens
  es: Listar Ítems
- pt: Itens do job (paginado; filtro opcional por `status`).
  es: Ítems del job (paginado; filtro opcional por `status`).
- pt: Filtra por estado do item
  es: Filtra por estado del ítem
