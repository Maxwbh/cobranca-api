- pt: Renderizar fatura (corpo livre) + boleto em PDF
  es: Renderizar factura (cuerpo libre) + boleto en PDF
- pt: "Gera a **fatura**: um corpo livre no topo da página e o **boleto de\npagamento** logo abaixo, num\
    \ único PDF (engine pyCobrança\n`render_fatura_pdf`).\n\n**Passthrough**: o gateway não soma nem calcula\
    \ nada — o `valor` do\nboleto e os totais vêm prontos no payload da aplicação. Dois níveis de\ncorpo,\
    \ expressáveis por JSON:\n- **Nível 1 — `itens`**: tabela simples de linhas\n  `{descricao, quantidade,\
    \ valor_unitario}`.\n- **Nível 2 — `fatura.blocos`**: corpo declarativo (blocos `campos`,\n  `tabela`,\
    \ `texto`, `total`, `separador`, `espaco`).\n\nPrecedência do engine: `fatura.blocos` > `itens`. Sem\
    \ `itens` nem\n`fatura`, o engine devolve o boleto sozinho.\n\nO **nível 3** (`fatura.desenhar`) é\
    \ um callback Python e **não** trafega\npor JSON: enviar `fatura.desenhar` retorna **400** (a API\
    \ recusa em vez\nde repassar um valor inútil ao engine). Para arte livre, chame a engine\npyCobrança\
    \ in-process na aplicação.\n"
  es: "Genera la **factura**: un cuerpo libre en la parte superior de la página y el **boleto de\npago**\
    \ justo debajo, en un único PDF (engine pyCobrança\n`render_fatura_pdf`).\n\n**Passthrough**: el gateway\
    \ no suma ni calcula nada — el `valor` del\nboleto y los totales vienen listos en el payload de la\
    \ aplicación. Dos niveles de\ncuerpo, expresables por JSON:\n- **Nivel 1 — `itens`**: tabla simple\
    \ de líneas\n  `{descricao, quantidade, valor_unitario}`.\n- **Nivel 2 — `fatura.blocos`**: cuerpo\
    \ declarativo (bloques `campos`,\n  `tabela`, `texto`, `total`, `separador`, `espaco`).\n\nPrecedencia\
    \ de la engine: `fatura.blocos` > `itens`. Sin `itens` ni\n`fatura`, la engine devuelve el boleto\
    \ solo.\n\nEl **nivel 3** (`fatura.desenhar`) es un callback Python y **no** viaja\npor JSON: enviar\
    \ `fatura.desenhar` devuelve **400** (la API rechaza en vez\nde pasar un valor inútil a la engine).\
    \ Para arte libre, llame a la engine\npyCobrança in-process en la aplicación.\n"
- pt: 'Dados do título que vai abaixo do corpo da fatura, incluindo

