  es: Nosso número formateado (impreso en el boleto).
- pt: 'Dígito verificador do nosso número, quando o banco o calcula à

    parte. Vem **vazio** nos bancos que já o embutem no formatado —

    o Banco do Brasil é um deles.

    '
  es: 'Dígito verificador del nosso número, cuando el banco lo calcula por

    separado. Viene **vacío** en los bancos que ya lo embeben en el formateado —

    Banco do Brasil es uno de ellos.

    '
