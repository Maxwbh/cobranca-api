  es: Descarga del consolidado (`.zip`), del `manifest.json` o del `errors.json`.
- pt: Criar Job Remessas
  es: Crear Job de Remesas
- pt: 'Cria um job de remessa CNAB em lote com **sublotes determinísticos**.


    Corpo: `{tenant_id, titulos: [...]}`. Cada título traz o cabeçalho da

    remessa (`bank`, `cnab_type`, convênio, carteira, conta…) e seus

    `pagamentos`. Títulos **incompatíveis nunca entram no mesmo arquivo** —

    são separados por (banco, layout, convênio, carteira, conta, agência,

    variação, pix), gerando um arquivo CNAB por sublote.'
  es: 'Crea un job de remesa CNAB en lote con **sublotes determinísticos**.


    Cuerpo: `{tenant_id, titulos: [...]}`. Cada título trae el encabezado de la

    remesa (`bank`, `cnab_type`, convenio, cartera, cuenta…) y sus

    `pagamentos`. Títulos **incompatibles nunca entran en el mismo archivo** —

    se separan por (banco, layout, convenio, cartera, cuenta, sucursal,

    variación, pix), generando un archivo CNAB por sublote.'
- pt: Cada título traz o cabeçalho da remessa e seus `pagamentos`. Títulos incompatíveis viram sublotes
    separados (um arquivo CNAB cada).
  es: Cada título trae el encabezado de la remesa y sus `pagamentos`. Los títulos incompatibles se vuelven
    sublotes separados (un archivo CNAB cada uno).
- pt: Consultar Job Remessas
  es: Consultar Job de Remesas
- pt: 'Estado do job de remessa e a lista de **sublotes** gerados.


    O lote é dividido por banco/layout/convênio/carteira/conta — um arquivo por

    combinação, porque o banco não aceita remessa misturada. Os arquivos ficam

    em `/jobs/cnab/remessas/{job_id}/files`.'
  es: 'Estado del job de remesa y la lista de **sublotes** generados.


    El lote se divide por banco/layout/convenio/cartera/cuenta — un archivo por

    combinación, porque el banco no acepta remesa mezclada. Los archivos quedan

    en `/jobs/cnab/remessas/{job_id}/files`.'
- pt: Listar Arquivos Remessa
  es: Listar Archivos de Remesa
