  es: Manifiesto de Artefactos
- pt: 'Manifesto do job: arquivos, `sha256`, tamanhos, expiração e consolidado `.zip`.


    Contrato doc 12: o lote entrega **referências**, nunca PDFs em base64.'
  es: 'Manifiesto del job: archivos, `sha256`, tamaños, expiración y consolidado `.zip`.


    Contrato doc 12: el lote entrega **referencias**, nunca PDFs en base64.'
