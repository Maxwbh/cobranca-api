- pt: 'Um título na remessa CNAB. Os nomes dos campos do sacado seguem a

    convenção da API (`sacado`, `sacado_documento`, `sacado_endereco`…),

    idêntica à do boleto — a API traduz para o layout internamente.


    **Encargos** (multa, juros/mora, desconto, IOF, abatimento) são

    opcionais e seguem o modelo de **trio** código/tipo → valor → data.

    A unidade (% ou R$) e o suporte variam por banco/layout: veja o guia

    [docs/api/encargos.md](https://github.com/Maxwbh/cobranca-api/blob/main/docs/api/encargos.md).

    '
  es: 'Un título en la remesa CNAB. Los nombres de los campos del pagador siguen la

    convención de la API (`sacado`, `sacado_documento`, `sacado_endereco`…),

    idéntica a la del boleto — la API traduce al layout internamente.


    **Cargos** (multa, intereses/mora, descuento, IOF, rebaja) son

    opcionales y siguen el modelo de **trío** código/tipo → valor → fecha.

    La unidad (% o R$) y el soporte varían por banco/layout: vea la guía

    [docs/api/encargos.md](https://github.com/Maxwbh/cobranca-api/blob/main/docs/api/encargos.md).

    '
