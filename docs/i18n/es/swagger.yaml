  es: PDF del Bolepix
- pt: PDF do Bolepix em base64.
  es: PDF del Bolepix en base64.
- pt: 'Cria o link de pagamento e devolve a `url` para onde mandar o pagador.


    Aceita cartão e, com `pix: true`, Pix no mesmo link. Expira em 7 dias quando

    `expira_em` é omitido (default do banco).


    Mande `Idempotency-Key` se houver botão humano na frente disto: sem a chave,

    duplo clique cria **dois links para a mesma venda**, e nada impede o pagador

    de pagar os dois.'
  es: 'Crea el link de pago y devuelve la `url` adonde mandar al pagador.


    Acepta tarjeta y, con `pix: true`, Pix en el mismo link. Expira en 7 días

    cuando se omite `expira_em` (default del banco).


    Mande `Idempotency-Key` si hay un botón humano delante de esto: sin la clave,

    un doble clic crea **dos links para la misma venta**, y nada impide que el

    pagador pague los dos.'
- pt: Reenvio com a mesma chave devolve O MESMO link, sem criar outro no banco. Mesma chave com outro
    pedido — corpo, provider ou banco diferentes — é 422.
  es: Reenviar con la misma clave devuelve EL MISMO link, sin crear otro en el banco. La misma clave con
    otro pedido — cuerpo, provider o banco distintos — es 422.
- pt: URL de consulta do link criado, já com tenant_id, provider e banco
  es: URL de consulta del link creado, ya con tenant_id, provider y banco
