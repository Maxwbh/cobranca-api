  es: Número del documento
- pt: Endereço completo do sacado
  es: Dirección completa del sacado (pagador)
- pt: 'Endereço do beneficiário, impresso abaixo do nome. Sem ele a linha

    sai vazia — não há padrão.

    '
  es: 'Dirección del beneficiario, impresa debajo del nombre. Sin ella la línea

    sale vacía — no hay default.

    '
- pt: 'Sacador/avalista do título, impresso no campo próprio da ficha. No

    modelo `classico` o rótulo sai sempre, com `—` quando ausente.

    '
  es: 'Librador/avalista del título, impreso en el campo propio de la ficha. En el

    modelo `classico` el rótulo sale siempre, con `—` cuando está ausente.

    '
- pt: 'Texto do campo *Local de pagamento*. Padrão:

    `Pagável em qualquer banco até o vencimento`. Substituí-lo é o que

    permite instruir a rede ("pagável somente na rede X") — o texto é

    impresso como veio, sem validação do banco.

    '
  es: 'Texto del campo *Local de pagamento*. Default:

    `Pagável em qualquer banco até o vencimento`. Sustituirlo es lo que

    permite instruir a la red ("pagable solo en la red X") — el texto se

    imprime como vino, sin validación del banco.

    '
- pt: 'Espécie do documento na ficha (`DM` duplicata mercantil, `NP` nota

    promissória, `RC` recibo…). Padrão `DM`. Só impressão: não muda o

    código de barras nem a forma de cobrança.

    '
  es: 'Tipo del documento en la ficha (`DM` duplicata mercantil, `NP` pagaré,

    `RC` recibo…). Default `DM`. Solo impresión: no cambia el

    código de barras ni la forma de cobranza.

    '
- pt: 'Espécie de moeda impressa na ficha. Padrão `R$`.


    ⚠️ **Só troca o rótulo.** O valor no código de barras é sempre em

    reais, no fator FEBRABAN — escrever `USD` imprime um boleto que diz

    dólar e cobra o mesmo número em real.

    '
  es: 'Moneda impresa en la ficha. Default `R$`.


    ⚠️ **Solo cambia el rótulo.** El valor en el código de barras es siempre en

    reales, en el factor FEBRABAN — escribir `USD` imprime un boleto que dice

    dólar y cobra el mismo número en reales.

    '
- pt: 'Aceite do sacado na ficha. Padrão `N`.

    '
  es: 'Aceptación del pagador en la ficha. Default `N`.

    '
- pt: 'Bloco de instruções do beneficiário — **é este o campo que a engine

    desenha**. Aceita lista de linhas ou um texto único com quebras

    (`\n`); as duas formas produzem o mesmo PDF.


    Quantas linhas cabem e que largura cada uma comporta **depende do

    modelo** e de haver Bolepix: a moldura do `moderno` encolhe cerca de

    um quarto com o QR ao lado. O gateway mede o limite na própria

    engine e **recusa** o excedente, com o número exato na mensagem —

    reescrever o texto de um documento de cobrança é do cliente, que

    sabe onde a frase pode ser cortada.

    '
  es: 'Bloque de instrucciones del beneficiario — **es este el campo que la engine

    dibuja**. Acepta una lista de líneas o un texto único con saltos

    (`\n`); las dos formas producen el mismo PDF.


    Cuántas líneas caben y qué ancho soporta cada una **depende del

    modelo** y de haber Bolepix: el marco del `moderno` se encoge cerca de

    un cuarto con el QR al lado. El gateway mide el límite en la propia

    engine y **rechaza** el excedente, con el número exacto en el mensaje —

    reescribir el texto de un documento de cobranza es del cliente, que

    sabe dónde se puede cortar la frase.

    '
- pt: 'Texto do demonstrativo, com as mesmas regras de `instrucoes`

    (lista ou texto com quebras, medido e recusado se não couber).

    '
  es: 'Texto del demostrativo, con las mismas reglas de `instrucoes`

    (lista o texto con saltos, medido y rechazado si no cabe).

    '
- pt: 'Primeira linha do bloco de instruções. `instrucao1`..`instrucao6`

    são juntadas em ordem e viram `instrucoes`; enviar as duas formas no

    mesmo payload responde `400`, porque uma delas seria descartada.

    '
  es: 'Primera línea del bloque de instrucciones. `instrucao1`..`instrucao6`

    se juntan en orden y se vuelven `instrucoes`; enviar las dos formas en el

    mismo payload responde `400`, porque una de ellas se descartaría.

    '
- pt: Segunda linha do bloco de instruções.
  es: Segunda línea del bloque de instrucciones.
- pt: Terceira linha do bloco de instruções.
  es: Tercera línea del bloque de instrucciones.
- pt: Quarta linha do bloco de instruções.
  es: Cuarta línea del bloque de instrucciones.
- pt: Quinta linha do bloco de instruções.
  es: Quinta línea del bloque de instrucciones.
- pt: Sexta linha do bloco de instruções.
  es: Sexta línea del bloque de instrucciones.
- pt: '**Responde 400.** A engine nunca leu este campo: ele existia só no

    schema, herdado da era Ruby, e o boleto saía sem QR com `200`. Use

    `chave_pix`.

    '
  es: '**Responde 400.** La engine nunca leyó este campo: existía solo en el

    schema, heredado de la era Ruby, y el boleto salía sin QR con `200`. Use

    `chave_pix`.

    '
- pt: '**Responde 400.** A legenda do QR é do modelo, não do payload.

    '
  es: '**Responde 400.** La leyenda del QR es del modelo, no del payload.

    '
- pt: 'Chave PIX do beneficiário (CPF, CNPJ, e-mail, telefone ou

    aleatória). Gera um QR no PDF.


    ⚠️ **Este QR não é Bolepix e não liquida o título.** O BR Code

    montado a partir da chave é **estático**: quem paga credita a sua

    chave, mas o banco não sabe que aquele PIX quitou *este* boleto — o

    título fica **em aberto**, com risco de segunda cobrança ou de

    protesto de boleto já pago.


    Bolepix exige QR **dinâmico**, gerado pelo banco no registro da

    cobrança. Para tê-lo: registre pelo caminho `on` e mande o EMV que o

    banco devolveu em `pix_copia_cola` (abaixo), que tem precedência

    sobre este campo e funciona em qualquer banco.


    A resposta diz qual dos dois saiu no papel, em `pix_vinculado`.


    Só nos sete bancos que a engine sabe montar o BR Code — Banco do

    Brasil, Bradesco, Caixa, Itaú, Santander, Sicoob e C6. Nos demais

    responde `400` (`banco 041 (Banrisul) não suporta PIX`) em vez de

    imprimir o boleto sem o QR pedido.

    '
  es: 'Clave PIX del beneficiario (CPF, CNPJ, e-mail, teléfono o

    aleatoria). Genera un QR en el PDF.


    ⚠️ **Este QR no es Bolepix y no liquida el título.** El BR Code

    montado a partir de la clave es **estático**: quien paga acredita su

    clave, pero el banco no sabe que ese PIX pagó *este* boleto — el

    título queda **en abierto**, con riesgo de segunda cobranza o de

    protesto de un boleto ya pagado.


    Bolepix exige QR **dinámico**, generado por el banco en el registro de la

    cobranza. Para tenerlo: registre por el camino `on` y mande el EMV que el

    banco devolvió en `pix_copia_cola` (abajo), que tiene precedencia

    sobre este campo y funciona en cualquier banco.


    La respuesta dice cuál de los dos salió en el papel, en `pix_vinculado`.


    Solo en los siete bancos para los que la engine sabe montar el BR Code — Banco do

    Brasil, Bradesco, Caixa, Itaú, Santander, Sicoob y C6. En los demás

    responde `400` (`banco 041 (Banrisul) não suporta PIX`) en vez de

    imprimir el boleto sin el QR pedido.

    '
- pt: '⚠️ **Conferido, não usado.** O código de barras que o **banco** já

    atribuiu ao título. O boleto continua saindo do cálculo local; este

    campo só diz *"o resultado tem de ser este"*, e a API responde `400`

    quando os dois discordam.


    Existe porque os dois caminhos se sobrepõem. Registrar no `on` e

    renderizar o PDF no `off` é o ciclo que dá o QR que liquida

    (`pix_copia_cola`) — e nele o papel sai de um cálculo **nosso**

    enquanto o título registrado é do **banco**. Divergir imprime um

    boleto que não corresponde ao título: PDF perfeito, pagamento que

    não concilia, e o erro só aparece semanas depois.


    Não é hipótese remota: no **Inter** o caminho `on` nunca envia nosso

    número — quem numera é o banco —, então renderizar com o seu próprio

    número produz **outro título**. Use o `nossoNumero` que a consulta

    devolveu.


    Compara só os dígitos: pontuação e espaços não são divergência.

    '
  es: '⚠️ **Verificado, no usado.** El código de barras que el **banco** ya

    asignó al título. El boleto sigue saliendo del cálculo local; este

    campo solo dice *"el resultado tiene que ser este"*, y la API responde `400`

    cuando los dos discrepan.


    Existe porque los dos caminos se superponen. Registrar en el `on` y

    renderizar el PDF en el `off` es el ciclo que da el QR que liquida

    (`pix_copia_cola`) — y en él el papel sale de un cálculo **nuestro**

    mientras el título registrado es del **banco**. Divergir imprime un

    boleto que no corresponde al título: PDF perfecto, pago que

    no concilia, y el error solo aparece semanas después.


    No es una hipótesis remota: en **Inter** el camino `on` nunca envía nosso

    número — quien numera es el banco —, así que renderizar con su propio

    número produce **otro título**. Use el `nossoNumero` que la consulta

    devolvió.


    Compara solo los dígitos: puntuación y espacios no son divergencia.

    '
- pt: '⚠️ **Conferido, não usado** — igual a `codigo_barras`, para quem tem

    à mão a linha em vez do código. Formatada ou crua, tanto faz.

    '
  es: '⚠️ **Verificado, no usado** — igual que `codigo_barras`, para quien tiene

    a mano la línea en vez del código. Formateada o cruda, da lo mismo.

    '
- pt: 'Payload EMV que o **banco** devolveu ao registrar a cobrança — o

    Bolepix de verdade: QR dinâmico, vinculado ao título, com baixa

    automática.


    Vai para o QR como veio, tem **precedência sobre `chave_pix`** e

    funciona em qualquer banco (o desenho não depende de a engine saber

    montar o BR Code daquele layout).


    É o campo que fecha o ciclo entre os dois caminhos: registre pelo

    `on` (C6, Sicoob, Inter ou Itaú), pegue o `pix_copia_cola` da

    resposta e renderize o PDF pelo `off` com o QR que liquida.

    '
  es: 'Payload EMV que el **banco** devolvió al registrar la cobranza — el

    Bolepix de verdad: QR dinámico, vinculado al título, con baja

    automática.


    Va al QR tal como vino, tiene **precedencia sobre `chave_pix`** y

    funciona en cualquier banco (el dibujo no depende de que la engine sepa

    montar el BR Code de ese layout).


    Es el campo que cierra el ciclo entre los dos caminos: registre por el

    `on` (C6, Sicoob, Inter o Itaú), tome el `pix_copia_cola` de la

    respuesta y renderice el PDF por el `off` con el QR que liquida.

    '
- pt: 'Texto livre no campo 26-02 do BR Code, para descrever a cobrança a

    quem paga. Até 40 caracteres.

    '
  es: 'Texto libre en el campo 26-02 del BR Code, para describir la cobranza a

    quien paga. Hasta 40 caracteres.

    '
- pt: 'Aceito e **descartado** — a engine deduz o tipo do valor da chave.

    Mantido porque não muda o resultado; não conte com ele voltando.

    '
  es: 'Aceptado y **descartado** — la engine deduce el tipo del valor de la clave.

    Mantenido porque no cambia el resultado; no cuente con que vuelva.

    '
- pt: 'Identificador da transação Pix, gravado **dentro do BR Code**. Até

    25 alfanuméricos. Vazio, a engine deriva do nosso número — antes ia

    `***` e o crédito chegava órfão na conciliação por OFX.


    ⚠️ **Não é o mesmo `txid` do Pix cob/cobv**, que o BACEN define com

    26 a 35 caracteres — e que o gateway exige nesse tamanho nas rotas

    `/pix/*`. Os dois limites não se sobrepõem: copiar o txid de uma

    cobrança Pix para cá responde `400` explicando a diferença.

    '
  es: 'Identificador de la transacción Pix, grabado **dentro del BR Code**. Hasta

    25 alfanuméricos. Vacío, la engine lo deriva del nosso número — antes iba

    `***` y el crédito llegaba huérfano a la conciliación por OFX.


    ⚠️ **No es el mismo `txid` del Pix cob/cobv**, que el BACEN define con

    26 a 35 caracteres — y que el gateway exige en ese tamaño en las rutas

    `/pix/*`. Los dos límites no se superponen: copiar el txid de una

    cobranza Pix aquí responde `400` explicando la diferencia.

    '
- pt: 'Faixa de marca — **texto** da marca do cedente, desenhado na faixa

    (não é caminho de arquivo: a engine não lê arquivo do servidor).

    Preenche também o nome da empresa quando este não vier.


    Só no modelo `moderno` e na fatura.

    '
  es: 'Franja de marca — **texto** de la marca del beneficiario, dibujado en la franja

    (no es ruta de archivo: la engine no lee archivos del servidor).

    Rellena también el nombre de la empresa cuando este no viene.


    Solo en el modelo `moderno` y en la factura.

    '
- pt: 'Faixa de marca — cor em hexadecimal `RRGGBB`, com ou sem `#`. O

    contraste do texto é calculado automaticamente.


    Só no modelo `moderno` e na fatura.

    '
  es: 'Franja de marca — color en hexadecimal `RRGGBB`, con o sin `#`. El

    contraste del texto se calcula automáticamente.


    Solo en el modelo `moderno` y en la factura.

    '
- pt: 'Faixa de marca — texto da marca d''água diagonal antifraude,

    posicionada fora das zonas do código de barras/QR.


    Só no modelo `moderno` e na fatura.

    '
  es: 'Franja de marca — texto de la marca de agua diagonal antifraude,

    posicionada fuera de las zonas del código de barras/QR.


    Solo en el modelo `moderno` y en la factura.

    '
- pt: 'Faixa de marca — rodapé com o contato da empresa.


    Só no modelo `moderno` e na fatura.

    '
  es: 'Franja de marca — pie con el contacto de la empresa.


    Solo en el modelo `moderno` y en la factura.

    '
- pt: '**Responde 400.** Nunca houve suporte — nem aqui, nem na engine, que

    lista o campo entre os que ignora. O PDF é desenhado com as fontes

    padrão do formato (Helvetica), que já cobrem acentuação.

    '
  es: '**Responde 400.** Nunca hubo soporte — ni aquí, ni en la engine, que

    lista el campo entre los que ignora. El PDF se dibuja con las fuentes

    estándar del formato (Helvetica), que ya cubren la acentuación.

    '
- pt: '**Responde 400.** Não é a marca do cedente: é o logotipo do

    **banco**, que já vem preenchido — a engine empacota o PNG por

    código FEBRABAN e o boleto sai com a marca sem que se peça.


    Trocá-lo é capacidade real, mas só em processo: a engine aceita

    bytes ou `ImageReader`, e por JSON só chega **texto** — que era lido

    como **caminho de arquivo no disco do servidor**. Um caminho de

    imagem legível pelo processo devolvia `200` com aquele arquivo

    embutido no PDF; um caminho que não é imagem estourava `500` com o

    caminho na mensagem.


    Para marcar o boleto de quem emite use `logo_empresa` (texto),

    `cor_marca` e `marca_dagua`.

    '
  es: '**Responde 400.** No es la marca del beneficiario: es el logotipo del

    **banco**, que ya viene cargado — la engine empaqueta el PNG por

    código FEBRABAN y el boleto sale con la marca sin que se pida.


    Cambiarlo es capacidad real, pero solo en proceso: la engine acepta

    bytes o `ImageReader`, y por JSON solo llega **texto** — que se leía

    como **ruta de archivo en el disco del servidor**. Una ruta de

    imagen legible por el proceso devolvía `200` con ese archivo

    embebido en el PDF; una ruta que no es imagen estallaba en `500` con la

    ruta en el mensaje.


    Para marcar el boleto de quien emite use `logo_empresa` (texto),

    `cor_marca` y `marca_dagua`.

    '
- pt: 'Faixa de marca — número da parcela, no selo "Parcela n/N". Precisa

    vir junto de `total_parcelas`.


    Só no modelo `moderno` e na fatura: o carnê **não** desenha a faixa.

    '
  es: 'Franja de marca — número de la cuota, en el sello "Parcela n/N". Tiene que

    venir junto con `total_parcelas`.


    Solo en el modelo `moderno` y en la factura: el carnet **no** dibuja la franja.

    '
- pt: 'Faixa de marca — total de parcelas, no selo "Parcela n/N".

    '
  es: 'Franja de marca — total de cuotas, en el sello "Parcela n/N".

    '
- pt: '⚠️ **Não é impresso no boleto.** Identifica o **item dentro de um

    lote**: é uma das fontes do `item_id` que acusa parcela duplicada em

    `POST /api/boleto/multi` e `POST /api/render/carne` — dois itens com

    o mesmo identificador são o mesmo título emitido duas vezes, e o

    sobrescrito nunca seria cobrado.


    No boleto avulso é aceito e ignorado, porque o mesmo registro

    costuma alimentar o lote e a emissão unitária.

    '
  es: '⚠️ **No se imprime en el boleto.** Identifica el **ítem dentro de un

    lote**: es una de las fuentes del `item_id` que acusa cuota duplicada en

    `POST /api/boleto/multi` y `POST /api/render/carne` — dos ítems con

    el mismo identificador son el mismo título emitido dos veces, y el

    sobrescrito nunca se cobraría.


    En el boleto suelto se acepta y se ignora, porque el mismo registro

    suele alimentar el lote y la emisión unitaria.

    '
- pt: '⚠️ **Não é impresso no boleto.** Mesma função de `external_id` —

    identifica o item no lote. O campo impresso na ficha é

    `numero_documento`.


    No caminho `on` do **Inter** `seuNumero` é o identificador do

    título no banco; aqui, no `off`, ele não chega ao papel.

    '
  es: '⚠️ **No se imprime en el boleto.** Misma función que `external_id` —

    identifica el ítem en el lote. El campo impreso en la ficha es

    `numero_documento`.


    En el camino `on` de **Inter** `seuNumero` es el identificador del

    título en el banco; aquí, en el `off`, no llega al papel.

    '
- pt: '⚠️ **Aceito e não desenhado** em nenhum dos dois modelos. Existe no

    construtor da engine e fica guardado no objeto, sem consumidor no

    layout. A cidade vai dentro de `cedente_endereco`, que é impresso.

    '
  es: '⚠️ **Aceptado y no dibujado** en ninguno de los dos modelos. Existe en el

    constructor de la engine y queda guardado en el objeto, sin consumidor en el

    layout. La ciudad va dentro de `cedente_endereco`, que sí se imprime.

    '
- pt: '⚠️ **Aceito e não desenhado** em nenhum dos dois modelos — mesma

    situação de `cedente_cidade`. Para levar o contrato ao papel use

    `instrucoes` ou `demonstrativo`.

    '
  es: '⚠️ **Aceptado y no dibujado** en ninguno de los dos modelos — misma

    situación que `cedente_cidade`. Para llevar el contrato al papel use

    `instrucoes` o `demonstrativo`.

    '
- pt: 'O valor **como veio** no payload — a API não completa com zeros à

    esquerda. O preenchimento aparece no formatado.

    '
  es: 'El valor **tal como vino** en el payload — la API no completa con ceros a la

    izquierda. El relleno aparece en el formateado.

    '
- pt: 'Nosso número IMPRESSO no boleto (com carteira, convênio e/ou DV,

    conforme regra do banco). Usar este campo para exibição e conciliação.

    '
  es: 'Nosso número IMPRESO en el boleto (con cartera, convenio y/o DV,

    según la regla del banco). Use este campo para mostrar y conciliar.

    '
- pt: 'Dígito verificador isolado, nos bancos que o calculam à parte.

    **Vazio** quando o banco já o embute no formatado — é o caso do

    Banco do Brasil, e não é erro.

    '
  es: 'Dígito verificador aislado, en los bancos que lo calculan por separado.

    **Vacío** cuando el banco ya lo embebe en el formateado — es el caso de

    Banco do Brasil, y no es error.

    '
- pt: Código de barras (44 dígitos)
  es: Código de barras (44 dígitos)
- pt: Linha digitável formatada
  es: Línea digitable formateada
- pt: 'BR Code (EMV) do QR desenhado no boleto. **`null` quando o payload

    não traz PIX** — boleto sem QR não tem copia-e-cola, e a API não

    inventa um.


    Vem de `data.pix_copia_cola` quando informado (o EMV do banco), ou é

    montado pela engine a partir de `data.chave_pix`. `pix_vinculado`

    diz qual dos dois.


    É o mesmo campo que `POST /cobranca` devolve no caminho `on`

    (C6, Sicoob, Inter, Itaú). Sem ele, um QR só é pagável por quem

    consegue apontar a câmera para outra tela.

    '
  es: 'BR Code (EMV) del QR dibujado en el boleto. **`null` cuando el payload

    no trae PIX** — un boleto sin QR no tiene copia y pega, y la API no

    inventa uno.


    Viene de `data.pix_copia_cola` cuando se informa (el EMV del banco), o lo

    monta la engine a partir de `data.chave_pix`. `pix_vinculado`

    dice cuál de los dos.


    Es el mismo campo que `POST /cobranca` devuelve en el camino `on`

    (C6, Sicoob, Inter, Itaú). Sin él, un QR solo es pagable por quien

    logra apuntar la cámara a otra pantalla.

    '
- pt: "O QR do boleto **liquida o título**?\n\n- `true` — **Bolepix**: o EMV veio do banco (`data.pix_copia_cola`),\n\
    \  é dinâmico e vinculado ao título; pagar por ele dá baixa.\n- `false` — QR **avulso**, montado de\
    \ `data.chave_pix`. É estático:\n  credita a chave e o título fica **em aberto**, com risco de segunda\n\
    \  cobrança ou de protesto de boleto já pago.\n- `null` — boleto sem PIX.\n"
  es: "¿El QR del boleto **liquida el título**?\n\n- `true` — **Bolepix**: el EMV vino del banco (`data.pix_copia_cola`),\n\
    \  es dinámico y está vinculado al título; pagar por él da de baja.\n- `false` — QR **suelto**, montado\
    \ de `data.chave_pix`. Es estático:\n  acredita la clave y el título queda **en abierto**, con riesgo\
    \ de segunda\n  cobranza o de protesto de un boleto ya pagado.\n- `null` — boleto sin PIX.\n"
- pt: Vazio nos bancos que embutem o DV no formatado.
  es: Vacío en los bancos que embeben el DV en el formateado.
- pt: 'Lista plana — **um item por campo violado** (contrato da engine

    PyCobrança ≥ 1.0.1, que expõe `BoletoInvalido.erros`). Mapeie cada

    string ao campo do formulário. Nunca é um objeto por chave.

    '
  es: 'Lista plana — **un ítem por campo violado** (contrato de la engine

    PyCobrança ≥ 1.0.1, que expone `BoletoInvalido.erros`). Mapee cada

    string al campo del formulario. Nunca es un objeto por clave.

    '
