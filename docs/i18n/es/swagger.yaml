  es: Consultar Ítem
- pt: 'Um item do lote: estado, artefato e — se falhou — o erro daquele boleto.


    É por aqui que se investiga um `partially_completed`: o job segue em frente

    quando um item falha, e o motivo fica no item, não no job.'
  es: 'Un ítem del lote: estado, artefacto y — si falló — el error de ese boleto.


    Por aquí se investiga un `partially_completed`: el job sigue adelante cuando

    un ítem falla, y el motivo queda en el ítem, no en el job.'
