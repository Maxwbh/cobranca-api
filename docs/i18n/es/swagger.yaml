    Bancos com extrato: C6, Sicoob e Inter — `GET /bancos` diz quais nesta

    instalação. Quem não oferece responde `422`, não `500`.'
  es: 'Movimientos de la cuenta en el período. Respuesta cruda del banco (su shape).


    Bancos con extracto: C6, Sicoob e Inter — `GET /bancos` dice cuáles en esta

    instalación. El que no lo ofrece responde `422`, no `500`.'
- pt: 'Data final (YYYY-MM-DD). No Sicoob a API é MENSAL: as duas datas precisam cair no mesmo mês, senão
    422.'
  es: 'Fecha final (YYYY-MM-DD). En Sicoob la API es MENSUAL: las dos fechas tienen que caer en el mismo
    mes, si no, 422.'
- pt: Número da conta corrente — usado pelo Sicoob, que exige a conta na consulta. Omitido, vai `0`, que
    é o que a rota mandava sempre por não ter onde receber o valor.
  es: Número de cuenta corriente — usado por Sicoob, que exige la cuenta en la consulta. Omitido, va `0`,
    que es lo que la ruta mandaba siempre por no tener dónde recibir el valor.
- pt: Resposta CRUA do banco — o shape é o dele, não desta API. Os três diferem; veja os exemplos.
  es: Respuesta CRUDA del banco — el shape es el suyo, no el de esta API. Los tres difieren; vea los ejemplos.
