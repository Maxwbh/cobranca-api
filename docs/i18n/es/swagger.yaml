  es: Credenciales del banco (JSON en base64) — solo memoria, nunca persistidas.
- pt: Sumario
  es: Resumen
- pt: 'Totais do período por situação — o mesmo recorte da coleção, sem paginar.


    Responde "quanto está em aberto" sem baixar a coleção inteira para somar no

    cliente, que é o que fazia quem precisava do número.


    Os totais vêm em `sumario`: o Inter devolve array na raiz, e array na raiz

    não tem onde crescer. Os itens seguem passthrough, com os nomes do banco.


    Ordenação não entra aqui — o banco não a aceita no sumário, e aceitá-la na

    rota só para descartar prometeria um recorte que não acontece.'
  es: 'Totales del período por situación — el mismo recorte de la colección, sin paginar.


    Responde "cuánto está en abierto" sin bajar la colección entera para sumar en

    el cliente, que es lo que hacía quien necesitaba el número.


    Los totales vienen en `sumario`: Inter devuelve un array en la raíz, y un array

    en la raíz no tiene dónde crecer. Los ítems siguen en passthrough, con los

    nombres del banco.


    La ordenación no entra aquí — el banco no la acepta en el resumen, y aceptarla

    en la ruta solo para descartarla prometería un recorte que no ocurre.'
