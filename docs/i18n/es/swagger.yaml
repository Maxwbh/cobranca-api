  es: Código de la ocurrencia bancaria
- pt: 'Descrição da ocorrência, **no vocabulário do banco do arquivo**.


    O mesmo código significa coisas opostas em bancos diferentes: o `40`

    é *baixa por ter sido liquidado* no mapa geral e *baixa de título

    protestado* no **Safra**; o `07` é *liquidação parcial* no geral e

    *cancelado* no **Inter**. Numa conciliação, confundir os dois é dar

    por pago um título protestado.

    '
  es: 'Descripción de la ocurrencia, **en el vocabulario del banco del archivo**.


    El mismo código significa cosas opuestas en bancos distintos: el `40`

    es *baja por haber sido liquidado* en el mapa general y *baja de título

    protestado* en **Safra**; el `07` es *liquidación parcial* en el general y

    *cancelado* en **Inter**. En una conciliación, confundir los dos es dar

    por pagado un título protestado.

    '
- pt: '⚠️ `true` quando o arquivo foi lido com um **layout de reserva**, e

    não com o mapa do banco — a engine não tem o layout daquele código.


    O arquivo é lido até o fim e **nenhum erro é levantado**, mas os

    campos podem ter vindo de posições que não são as daquele banco. É a

    falha mais perigosa do parsing porque a saída é plausível: trate os

    valores como suspeitos e confira contra o extrato antes de conciliar.


    `false` quando o banco tem layout próprio (16 dos 19).

    '
  es: '⚠️ `true` cuando el archivo fue leído con un **layout de reserva**, y

    no con el mapa del banco — la engine no tiene el layout de ese código.


    El archivo se lee hasta el final y **no se levanta ningún error**, pero los

    campos pueden haber venido de posiciones que no son las de ese banco. Es la

    falla más peligrosa del parsing porque la salida es plausible: trate los

    valores como sospechosos y verifique contra el extracto antes de conciliar.


    `false` cuando el banco tiene layout propio (16 de los 19).

    '
