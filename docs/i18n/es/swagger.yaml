- pt: 'Pix BACEN: cob/cobv, revisão, listas, lote e Pix RECEBIDOS (conciliação). Dialeto idêntico em todos
    os bancos — [spec BACEN](https://bacen.github.io/pix-api/). Docs oficiais: [C6 Pix](https://developers.c6bank.com.br/apis/pix)
    · [Sicoob](https://developers.sicoob.com.br/portal/) · [Inter](https://developers.bancointer.com.br/).'
  es: 'Pix BACEN: cob/cobv, revisión, listas, lote y Pix RECIBIDOS (conciliación). Dialecto idéntico en
    todos los bancos — [spec BACEN](https://bacen.github.io/pix-api/). Docs oficiales: [C6 Pix](https://developers.c6bank.com.br/apis/pix)
    · [Sicoob](https://developers.sicoob.com.br/portal/) · [Inter](https://developers.bancointer.com.br/).'
- pt: 'Boleto híbrido online com QR Pix EVP embutido (exclusivo C6, /v2/bank_slips). Doc oficial: [C6
    Bolepix](https://developers.c6bank.com.br/apis/bolepix).'
  es: 'Boleto híbrido online con QR Pix EVP embebido (exclusivo C6, /v2/bank_slips). Doc oficial: [C6
    Bolepix](https://developers.c6bank.com.br/apis/bolepix).'
- pt: 'Link de pagamento com **cartão** (crédito/débito, parcelado) e, opcionalmente, Pix no mesmo link.
    **Modo link apenas:** o pagador digita o cartão na página do banco — nenhum dado de cartão passa por
    esta API, e por isso `save_card` e checkout transparente não existem no schema. Existe no banco que
    oferece a funcionalidade (hoje o C6). Doc oficial: [C6 Checkout](https://developers.c6bank.com.br/apis/checkout).'
  es: 'Link de pago con **tarjeta** (crédito/débito, en cuotas) y, opcionalmente, Pix en el mismo link.
    **Solo modo link:** el pagador digita la tarjeta en la página del banco — ningún dato de tarjeta pasa
    por esta API, y por eso `save_card` y el checkout transparente no existen en el schema. Existe en
    el banco que ofrece la funcionalidad (hoy el C6). Doc oficial: [C6 Checkout](https://developers.c6bank.com.br/apis/checkout).'
- pt: 'Débito recorrente via Pix (BACEN): recorrência, autorização do pagador, cobranças do ciclo e retentativa.
    O agendamento de cada cobrança fica no produto consumidor.


    **C6, Sicoob e Inter.** Os dois primeiros exercitados em sandbox; o Inter confirmado contra a spec
    OpenAPI do próprio banco — mesma base `/pix/v2`, com `rec`, `solicrec`, `cobr`, `locrec` e os dois
    webhooks. No Inter vale a restrição do BACEN: só para **CNPJ com 6+ meses de atividade**. O **Itaú**
    não oferece.


    Docs: [spec BACEN](https://bacen.github.io/pix-api/) · [C6 Pix Automático](https://developers.c6bank.com.br/apis/pix-automatico).'
  es: 'Débito recurrente vía Pix (BACEN): recurrencia, autorización del pagador, cobranzas del ciclo y
    reintento. El agendamiento de cada cobranza queda en el producto consumidor.


    **C6, Sicoob e Inter.** Los dos primeros ejercitados en sandbox; Inter confirmado contra la spec OpenAPI
    del propio banco — misma base `/pix/v2`, con `rec`, `solicrec`, `cobr`, `locrec` y los dos webhooks.
    En Inter vale la restricción del BACEN: solo para **CNPJ con 6+ meses de actividad**. **Itaú** no
    lo ofrece.


    Docs: [spec BACEN](https://bacen.github.io/pix-api/) · [C6 Pix Automático](https://developers.c6bank.com.br/apis/pix-automatico).'
- pt: 'Recebíveis e transações C6 Pay (extrato da adquirência). Doc oficial: [C6 Pay statements](https://developers.c6bank.com.br/apis/c6pay-statements).'
  es: 'Cuentas por cobrar y transacciones de C6 Pay (extracto de la adquirencia). Doc oficial: [C6 Pay
    statements](https://developers.c6bank.com.br/apis/c6pay-statements).'
- pt: 'Extrato da conta PJ (C6 /v1/statement; Sicoob conta-corrente v4 — mensal; Inter /banking/v2/extrato).
    Docs oficiais: [C6 Extrato](https://developers.c6bank.com.br/apis/statement) · [Sicoob](https://developers.sicoob.com.br/portal/)
    · [Inter](https://developers.bancointer.com.br/).'
  es: 'Extracto de la cuenta empresa (C6 /v1/statement; Sicoob cuenta corriente v4 — mensual; Inter /banking/v2/extrato).
    Docs oficiales: [C6 Extrato](https://developers.c6bank.com.br/apis/statement) · [Sicoob](https://developers.sicoob.com.br/portal/)
    · [Inter](https://developers.bancointer.com.br/).'
- pt: 'Configurações NO banco: URL de webhook (boleto e Pix por chave). Cadastro de webhook de boleto
    no **C6** e no **Inter**; o Sicoob não expõe a rota (responde `422`). O de Pix por chave é BACEN,
    igual em todos. Docs oficiais: [C6 Notificações](https://developers.c6bank.com.br/apis/notifications)
    · [Inter](https://developers.bancointer.com.br/) · [webhook Pix BACEN](https://bacen.github.io/pix-api/).'
  es: 'Configuraciones EN el banco: URL de webhook (boleto y Pix por clave). Registro de webhook de boleto
    en **C6** y en **Inter**; Sicoob no expone la ruta (responde `422`). El de Pix por clave es BACEN,
    igual en todos. Docs oficiales: [C6 Notificações](https://developers.c6bank.com.br/apis/notifications)
    · [Inter](https://developers.bancointer.com.br/) · [webhook Pix BACEN](https://bacen.github.io/pix-api/).'
- pt: 'Processamento em **lote assíncrono**: `202 Accepted` + `job_id`, itens rastreáveis e estado persistido.
    A falha de um item não cancela o job (`partially_completed`). Idempotência por `Idempotency-Key`.
    Boletos e **CNAB com sublotes determinísticos**; artefatos (PDF/`.rem`/zip) com `sha256` e expiração;
    **webhook de conclusão** assinado (HMAC) e métricas por job.'
  es: 'Procesamiento en **lote asincrónico**: `202 Accepted` + `job_id`, ítems rastreables y estado persistido.
    La falla de un ítem no cancela el job (`partially_completed`). Idempotencia por `Idempotency-Key`.
    Boletos y **CNAB con sublotes determinísticos**; artefactos (PDF/`.rem`/zip) con `sha256` y expiración;
    **webhook de conclusión** firmado (HMAC) y métricas por job.'
