- pt: 'BR Code (EMV) do Bolepix — **só aparece quando o payload traz

    `chave_pix`**. O corpo desta resposta é o PDF, então este é o

    único caminho por onde o copia-e-cola sai: sem ele o QR vai

    impresso e não há o texto para exibir ao lado, que é como paga

    quem está no celular (não dá para escanear a própria tela).

    ASCII por especificação do BR Code.

    '
  es: 'BR Code (EMV) del Bolepix — **solo aparece cuando el payload trae

    `chave_pix`**. El cuerpo de esta respuesta es el PDF, así que este es el

    único camino por donde sale el copia y pega: sin él el QR va

    impreso y no hay texto para mostrar al lado, que es como paga

    quien está en el celular (no se puede escanear la propia pantalla).

    ASCII por especificación del BR Code.

    '
