- pt: "Superfície **offline** da plataforma **Cobranca-API** (serviço único **100% Python**):\ngeração\
    \ de boletos bancários brasileiros, arquivos CNAB e parsing de extratos OFX —\nservida **nativamente**\
    \ pela engine [pyCobrança](https://github.com/Maxwbh/pyCobranca)\ndentro do próprio processo FastAPI\
    \ (sem sidecar, sem proxy).\n\n> **Nota de versão (v2.0.0):** os contratos desta superfície (paths,\
    \ campos,\n> headers `X-*`) permanecem compatíveis com a v1.x. A única mudança de escopo é\n> o formato\
    \ de saída: a engine emite **PDF** — `jpg`/`png`/`tif` respondem\n> **400**.\n\n## Offline (`/api/*`)\
    \ × Gateway (raiz) — quando usar cada um\n\n| | **Offline (esta doc)** | **Gateway REST** ([Swagger\
    \ `/docs`](/docs)) |\n|---|---|---|\n| O que faz | GERA o documento (boleto/CNAB) localmente | REGISTRA\
    \ a cobrança na API online do banco (C6, Sicoob, Inter, Itaú) |\n| Boleto | Não registrado (o banco\
    \ só conhece no pagamento) | **Registrado** (CIP, em tempo real) + Pix, Bolepix, webhooks |\n| Autenticação\
    \ | **Nenhuma** (por design — não toca em banco nem segredo) | Token `bapi_` (`POST /credenciais`)\
    \ |\n| Conciliação | Retorno CNAB / OFX (arquivos) | Webhooks + consultas online |\n\n> **Autenticação:**\
    \ esta superfície não tem `securitySchemes` de propósito.\n> O mecanismo `bapi_` pertence ao gateway\
    \ e está documentado no\n> [Swagger do gateway](/docs).\n\n## Como testar\n\n```bash\ncurl {base}/api/health\
    \                          # saúde do serviço\ncurl -G {base}/api/boleto -o boleto.pdf \\\n  --data-urlencode\
    \ 'bank=banco_brasil' --data-urlencode 'type=pdf' \\\n  --data-urlencode 'data={\"valor\":150.0,\"\
    cedente\":\"Empresa\",\"documento_cedente\":\"11222333000181\",\"sacado\":\"Cliente\",\"sacado_documento\"\
    :\"52998224725\",\"agencia\":\"3073\",\"conta_corrente\":\"12345678\",\"convenio\":\"1234567\",\"\
    carteira\":\"18\",\"nosso_numero\":\"123\",\"data_vencimento\":\"2027-12-30\"}'\n```\n\n**Links:**\
    \ [Repositório](https://github.com/Maxwbh/cobranca-api) ·\n[CHANGELOG](https://github.com/Maxwbh/cobranca-api/blob/main/CHANGELOG.md)\
    \ ·\n[Guias por banco](https://github.com/Maxwbh/cobranca-api/tree/main/docs/development)\n\n## Funcionalidades\n\
    \n- **Boletos**: Geração de boletos em **PDF** — 19 bancos, sem convênio\n- **Remessa**: Geração de\
    \ arquivos CNAB 240 e 400\n- **Retorno**: Parsing de arquivos de retorno CNAB 240 e 400\n- **OFX**:\
    \ Parsing de extratos bancários OFX v1 (SGML) e v2 (XML) com extração automática de nosso_numero\n\
    \n## Bancos Suportados\n\nOs 18, como a engine responde hoje. `GET /api/bancos` devolve esta mesma\n\
    matriz por introspecção do código — se as duas discordarem, a resposta\nmanda.\n\n| Banco | Código\
    \ | Boleto | CNAB 240 | CNAB 400 | PIX na remessa |\n|-------|--------|--------|----------|----------|-----|\n\
    | Banco do Brasil | 001 | ✅ | ✅ | ✅ | ✅ |\n| Banco do Nordeste | 004 | ✅ | — | ✅ | — |\n| Banestes\
    \ | 021 | ✅ | — | — | — |\n| Santander | 033 | ✅ | ✅ | ✅ | ✅ |\n| Banrisul | 041 | ✅ | — | ✅ | — |\n\
    | BRB — Banco de Brasília | 070 | ✅ | — | ✅ | — |\n| Ailos | 085 | ✅ | ✅ | — | — |\n| CrediSIS | 097\
    \ | ✅ | — | ✅ | — |\n| Caixa | 104 | ✅ | ✅ | — | ✅ |\n| Unicred | 136 | ✅ | ✅ | ✅ | — |\n| Bradesco\
    \ | 237 | ✅ | — | ✅ | ✅ |\n| Banco C6 | 336 | ✅ | — | ✅ | ✅ |\n| Itaú | 341 | ✅ | — | ✅ | ✅ |\n| HSBC\
    \ | 399 | ✅ | — | — | — |\n| Safra | 422 | ✅ | — | — | — |\n| Citibank | 745 | ✅ | — | ✅ | — |\n|\
    \ Sicredi | 748 | ✅ | ✅ | — | — |\n| Sicoob | 756 | ✅ | ✅ | ✅ | ✅ |\n\nBoleto em PDF vale para os\
    \ 18. As outras três colunas são do **arquivo de\nremessa**: banco sem CNAB aqui emite o boleto, mas\
    \ não gera remessa por\nesta superfície.\n"
  es: "Superficie **offline** de la plataforma **Cobranca-API** (servicio único **100% Python**):\ngeneración\
    \ de boletos bancarios brasileños, archivos CNAB y parsing de extractos OFX —\nservida **nativamente**\
    \ por la engine [pyCobrança](https://github.com/Maxwbh/pyCobranca)\ndentro del propio proceso FastAPI\
    \ (sin sidecar, sin proxy).\n\n> **Nota de versión (v2.0.0):** los contratos de esta superficie (paths,\
    \ campos,\n> headers `X-*`) siguen compatibles con la v1.x. El único cambio de alcance es\n> el formato\
    \ de salida: la engine emite **PDF** — `jpg`/`png`/`tif` responden\n> **400**.\n\n## Offline (`/api/*`)\
    \ × Gateway (raíz) — cuándo usar cada uno\n\n| | **Offline (esta doc)** | **Gateway REST** ([Swagger\
    \ `/docs`](/docs)) |\n|---|---|---|\n| Qué hace | GENERA el documento (boleto/CNAB) localmente | REGISTRA\
    \ la cobranza en la API online del banco (C6, Sicoob, Inter, Itaú) |\n| Boleto | No registrado (el\
    \ banco solo lo conoce en el pago) | **Registrado** (CIP, en tiempo real) + Pix, Bolepix, webhooks\
    \ |\n| Autenticación | **Ninguna** (por diseño — no toca banco ni secreto) | Token `bapi_` (`POST\
    \ /credenciais`) |\n| Conciliación | Retorno CNAB / OFX (archivos) | Webhooks + consultas online |\n\
    \n> **Autenticación:** esta superficie no tiene `securitySchemes` a propósito.\n> El mecanismo `bapi_`\
    \ pertenece al gateway y está documentado en el\n> [Swagger del gateway](/docs).\n\n## Cómo probar\n\
    \n```bash\ncurl {base}/api/health                          # salud del servicio\ncurl -G {base}/api/boleto\
    \ -o boleto.pdf \\\n  --data-urlencode 'bank=banco_brasil' --data-urlencode 'type=pdf' \\\n  --data-urlencode\
    \ 'data={\"valor\":150.0,\"cedente\":\"Empresa\",\"documento_cedente\":\"11222333000181\",\"sacado\"\
    :\"Cliente\",\"sacado_documento\":\"52998224725\",\"agencia\":\"3073\",\"conta_corrente\":\"12345678\"\
    ,\"convenio\":\"1234567\",\"carteira\":\"18\",\"nosso_numero\":\"123\",\"data_vencimento\":\"2027-12-30\"\
    }'\n```\n\n**Links:** [Repositorio](https://github.com/Maxwbh/cobranca-api) ·\n[CHANGELOG](https://github.com/Maxwbh/cobranca-api/blob/main/CHANGELOG.md)\
    \ ·\n[Guías por banco](https://github.com/Maxwbh/cobranca-api/tree/main/docs/development)\n\n## Funcionalidades\n\
    \n- **Boletos**: Generación de boletos en **PDF** — 19 bancos, sin convenio\n- **Remesa**: Generación\
    \ de archivos CNAB 240 y 400\n- **Retorno**: Parsing de archivos de retorno CNAB 240 y 400\n- **OFX**:\
    \ Parsing de extractos bancarios OFX v1 (SGML) y v2 (XML) con extracción automática de nosso_numero\n\
    \n## Bancos Soportados\n\nLos 18, tal como la engine responde hoy. `GET /api/bancos` devuelve esta\
    \ misma\nmatriz por introspección del código — si las dos discrepan, la respuesta\nmanda.\n\n| Banco\
    \ | Código | Boleto | CNAB 240 | CNAB 400 | PIX en la remesa |\n|-------|--------|--------|----------|----------|-----|\n\
    | Banco do Brasil | 001 | ✅ | ✅ | ✅ | ✅ |\n| Banco do Nordeste | 004 | ✅ | — | ✅ | — |\n| Banestes\
    \ | 021 | ✅ | — | — | — |\n| Santander | 033 | ✅ | ✅ | ✅ | ✅ |\n| Banrisul | 041 | ✅ | — | ✅ | — |\n\
    | BRB — Banco de Brasília | 070 | ✅ | — | ✅ | — |\n| Ailos | 085 | ✅ | ✅ | — | — |\n| CrediSIS | 097\
    \ | ✅ | — | ✅ | — |\n| Caixa | 104 | ✅ | ✅ | — | ✅ |\n| Unicred | 136 | ✅ | ✅ | ✅ | — |\n| Bradesco\
    \ | 237 | ✅ | — | ✅ | ✅ |\n| Banco C6 | 336 | ✅ | — | ✅ | ✅ |\n| Itaú | 341 | ✅ | — | ✅ | ✅ |\n| HSBC\
    \ | 399 | ✅ | — | — | — |\n| Safra | 422 | ✅ | — | — | — |\n| Citibank | 745 | ✅ | — | ✅ | — |\n|\
    \ Sicredi | 748 | ✅ | ✅ | — | — |\n| Sicoob | 756 | ✅ | ✅ | ✅ | ✅ |\n\nEl boleto en PDF vale para\
    \ los 18. Las otras tres columnas son del **archivo de\nremesa**: un banco sin CNAB aquí emite el\
    \ boleto, pero no genera remesa por\nesta superficie.\n"
