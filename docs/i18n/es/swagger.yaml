  es: URL de consulta del Bolepix creado, con tenant_id, provider y banco
- pt: Consulta o Bolepix pelo external_reference_id (26 chars A-Z0-9).
  es: Consulta el Bolepix por el external_reference_id (26 chars A-Z0-9).
- pt: 'Identificador do Bolepix: 26 caracteres, só maiúsculas e dígitos'
  es: 'Identificador del Bolepix: 26 caracteres, solo mayúsculas y dígitos'
- pt: Credenciais do banco (JSON base64) — só memória.
  es: Credenciales del banco (JSON base64) — solo memoria.
