    campos do schema `BoletoData` mais o `bank`. Outra forma

    (objeto, texto, número) responde **400** dizendo o que

    chegou; identificador repetido responde **422**.

    '
  es: 'Archivo JSON con un **array** de boletos — cada ítem tiene los

    campos del schema `BoletoData` más el `bank`. Otra forma

    (objeto, texto, número) responde **400** diciendo qué

    llegó; un identificador repetido responde **422**.

    '
- pt: 'Sem include_data: arquivo binário + headers `X-Boletos-Info` e `X-Boletos-Count`.

    Com include_data=true: JSON contendo array `boletos` + `content_base64`.

    '
  es: 'Sin include_data: archivo binario + headers `X-Boletos-Info` y `X-Boletos-Count`.

    Con include_data=true: JSON con el array `boletos` + `content_base64`.

    '
