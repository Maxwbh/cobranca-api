    no existe en la clase de remesa CNAB 240 de Sicoob.

    '
- pt: 'Código do cedente/beneficiário. **OBRIGATÓRIO para Banco C6** (CNAB 400).

    Até 10 dígitos, fornecido pelo banco ao cedente.

    '
  es: 'Código del cedente/beneficiario. **OBLIGATORIO para Banco C6** (CNAB 400).

    Hasta 10 dígitos, provisto por el banco al beneficiario.

