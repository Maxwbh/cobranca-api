- pt: 'Webhook global (consumidor único / destino default).


    Exige `WEBHOOK_TOKEN__<BANCO>` (ou o opt-out explícito). **Sem tenant na

    rota não há confirmação no banco** — o cofre é por tenant; prefira a rota

    com tenant se o status precisa ser verificado.'
  es: 'Webhook global (consumidor único / destino default).


    Exige `WEBHOOK_TOKEN__<BANCO>` (o el opt-out explícito). **Sin tenant en la

    ruta no hay confirmación en el banco** — la bóveda es por tenant; prefiera la

    ruta con tenant si el status necesita verificarse.'
- pt: 'Banco que está notificando — é o slug usado na URL cadastrada nele (`c6`, `sicoob`, `inter`), **em
    minúsculas**. Define qual `WEBHOOK_TOKEN__<BANCO>` valida a chamada. Slug fora da lista é `422`, e
    não `200`: 200 faria o banco parar de reentregar um evento que ninguém processou. Não confundir com
    o parâmetro `banco` das rotas de cobrança, que é a instituição do request.'
  es: 'Banco que está notificando — es el slug usado en la URL registrada en él (`c6`, `sicoob`, `inter`),
    **en minúsculas**. Define qué `WEBHOOK_TOKEN__<BANCO>` valida la llamada. Un slug fuera de la lista
    es `422`, y no `200`: 200 haría que el banco dejara de reentregar un evento que nadie procesó. No
    confundir con el parámetro `banco` de las rutas de cobranza, que es la institución del request.'
- pt: Receber Por Tenant
  es: Recibir por Tenant
- pt: 'Webhook por tenant (multi-sistema). O banco aponta o callback de cada conta

    para esta URL; o tenant vem do path e roteia para o consumidor dono.'
  es: 'Webhook por tenant (multisistema). El banco apunta el callback de cada cuenta

    a esta URL; el tenant viene del path y enruta al consumidor dueño.'
- pt: Sonda de disponibilidade
  es: Sonda de disponibilidad
- pt: 'Prova que **o processo está de pé e roteando** — e só isso.


    É a rota que o `HEALTHCHECK` do Dockerfile, o `docker-compose` e o health

    check do host consultam, e os três **matam o container** quando ela falha. Por isso não toca em rede,
    banco nem disco: uma sonda que

    reprovasse por problema transitório reiniciaria o serviço em laço, que é

    pior que o problema detectado. Estado por banco fica em `GET /bancos`.


    O schema era o genérico do FastAPI (`additionalProperties: string`, sem

    exemplo): a rota mais consumida por automação era a menos especificada da

    API.'
  es: 'Prueba que **el proceso está en pie y enrutando** — y solo eso.


    Es la ruta que el `HEALTHCHECK` del Dockerfile, el `docker-compose` y el health

    check del host consultan, y los tres **matan el container** cuando falla. Por eso no toca red,

    banco ni disco: una sonda que

    reprobara por un problema transitorio reiniciaría el servicio en bucle, que es

    peor que el problema detectado. El estado por banco queda en `GET /bancos`.


    El schema era el genérico de FastAPI (`additionalProperties: string`, sin

    ejemplo): la ruta más consumida por automatización era la menos especificada de la

    API.'
- pt: 'Instituição — as 19 tratadas, independente do caminho.


    Os quatro primeiros têm caminho ON (API REST implementada); todos, menos o

    Inter, têm caminho OFF (layout na engine). `GET /bancos` responde a matriz

    exata por introspecção, e a combinação impossível (`on` + banco sem API,

    `off` + Inter) responde `422` dizendo quais existem.'
  es: 'Institución — las 19 tratadas, independientemente del camino.


    Las cuatro primeras tienen camino ON (API REST implementada); todas, menos

    Inter, tienen camino OFF (layout en la engine). `GET /bancos` responde la matriz

    exacta por introspección, y la combinación imposible (`on` + banco sin API,

    `off` + Inter) responde `422` diciendo cuáles existen.'
- pt: 'Slugs que esta API sabe normalizar.


    Era `str` livre, e a combinação com o `_check_token` (que faz `.upper()`)

    deixava passar: `/webhooks/C6` autenticava — o token bate — e caía no

    `_NORMALIZERS.get("C6")`, que é `None`. O evento virava `ignorado` com

    **200**, e 200 diz ao banco "recebi, pode parar de reentregar". Uma

    maiúscula na URL cadastrada, e toda liquidação sumia em silêncio.'
  es: 'Slugs que esta API sabe normalizar.


    Era `str` libre, y la combinación con el `_check_token` (que hace `.upper()`)

    dejaba pasar: `/webhooks/C6` autenticaba — el token coincide — y caía en el

    `_NORMALIZERS.get("C6")`, que es `None`. El evento se volvía `ignorado` con

    **200**, y 200 le dice al banco "recibí, puedes dejar de reentregar". Una

    mayúscula en la URL registrada, y toda liquidación desaparecía en silencio.'
- pt: Valor da cobrança — maior que zero
  es: Valor de la cobranza — mayor que cero
- pt: Descrição da cobrança (obrigatória no Bolepix)
  es: Descripción de la cobranza (obligatoria en el Bolepix)
- pt: 'endereco OBRIGATORIO: {address|logradouro+numero, neighborhood|bairro, city|cidade, state|uf, zip_code|cep}
    — os 3 ultimos sao exigidos pelo C6 /v2'
  es: 'dirección OBLIGATORIA: {address|logradouro+numero, neighborhood|bairro, city|cidade, state|uf,
    zip_code|cep} — los 3 últimos son exigidos por el C6 /v2'
- pt: '`^[A-Z0-9]{26}$` — 26 caracteres, só maiúsculas e dígitos. Gerado automaticamente se omitido, e
    devolvido em `id`. **É por ele que se consulta o Bolepix**, e reenviar o mesmo devolve a cobrança
    existente em vez de criar outra — mande o seu se houver botão humano na frente. String vazia vale
    como omitido: template que substitui variável não preenchida produz `""`, e isso sempre significou
    "gere um".'
  es: '`^[A-Z0-9]{26}$` — 26 caracteres, solo mayúsculas y dígitos. Generado automáticamente si se omite,
    y devuelto en `id`. **Es por él que se consulta el Bolepix**, y reenviar el mismo devuelve la cobranza
    existente en vez de crear otra — mande el suyo si hay un botón humano delante. La cadena vacía vale
    como omitido: una plantilla que sustituye una variable no llenada produce `""`, y eso siempre significó
    "genere uno".'
- pt: Chave EVP do recebedor. Sem ela (aqui ou em `account_config.chave_pix`) não há segmento Pix, e o
    resultado é um boleto comum — que é `/cobranca`, não Bolepix. Por isso a ausência responde 422.
  es: Clave EVP del receptor. Sin ella (aquí o en `account_config.chave_pix`) no hay segmento Pix, y el
    resultado es un boleto común — que es `/cobranca`, no Bolepix. Por eso la ausencia responde 422.
- pt: days_after_due_date — dias de tolerância APÓS o vencimento; negativo não existe (o boleto não vence
    antes de vencer)
  es: days_after_due_date — días de tolerancia DESPUÉS del vencimiento; negativo no existe (el boleto
    no vence antes de vencer)
- pt: '**Instituição**: `c6`, `sicoob`, `inter`, `itau`… Use com `provider=on`. Omitido, o `provider`
    legado (nome do banco) resolve.'
  es: '**Institución**: `c6`, `sicoob`, `inter`, `itau`… Úselo con `provider=on`. Omitido, el `provider`
    heredado (nombre del banco) resuelve.'
- pt: Identificador do tenant
  es: Identificador del tenant
- pt: Blob por provider (ver CobrancaIn)
  es: Blob por provider (ver CobrancaIn)
- pt: 'Slug do layout na engine pyCobrança. **Redundante**: o layout vem do `banco`. Aceito por compatibilidade
    e precisa concordar — `bank` divergente responde 422, porque carnê desenhado como um banco e registrado
    em outro não é pagável.'
  es: 'Slug del layout en la engine pyCobrança. **Redundante**: el layout viene del `banco`. Aceptado
    por compatibilidad y tiene que coincidir — un `bank` divergente responde 422, porque un carnet dibujado
    como un banco y registrado en otro no es pagable.'
- pt: Parcelas do carnê (registradas individualmente). Pelo menos uma, e cada uma com identificador próprio
    (`seu_numero`/`nosso_numero`)
  es: Cuotas del carnet (registradas individualmente). Al menos una, y cada una con identificador propio
    (`seu_numero`/`nosso_numero`)
- pt: 'Credenciais do banco no request (só memória; fallback: cofre VAULT__*).'
  es: 'Credenciales del banco en el request (solo memoria; fallback: bóveda VAULT__*).'
- pt: PDF do carnê 3-vias em base64
  es: PDF del carnet de 3 vías en base64
- pt: Cobranças registradas (uma por parcela)
  es: Cobranzas registradas (una por cuota)
- pt: '`ok` · `expirando` · `expirado` · `ilegivel`. O limiar de `expirando` acompanha a **vida** do certificado:
    30 dias para um anual, um terço da validade para os de vida curta. Fixo em 30, o certificado do Inter
    — que vive 30 dias — nascia `expirando`.'
  es: '`ok` · `expirando` · `expirado` · `ilegivel`. El umbral de `expirando` acompaña la **vida** del
    certificado: 30 días para uno anual, un tercio de la validez para los de vida corta. Fijo en 30, el
    certificado de Inter — que vive 30 días — nacía `expirando`.'
- pt: 'CN do certificado. Os bancos escrevem `<RAZAO><CNPJ>-<host>`, e o **host diz o ambiente**: `baas-api-sandbox`
    é sandbox, `baas-api` é produção. É por aqui que se confere qual certificado está em uso.'
  es: 'CN del certificado. Los bancos escriben `<RAZAO><CNPJ>-<host>`, y el **host dice el ambiente**:
    `baas-api-sandbox` es sandbox, `baas-api` es producción. Por aquí se verifica qué certificado está
    en uso.'
- pt: Quantos dias restantes fazem este certificado virar `expirando`. Varia com a vida dele — sem este
    campo, `expirando` com 9 dias num caso e `ok` com 25 noutro pareceria incoerência.
  es: Cuántos días restantes hacen que este certificado pase a `expirando`. Varía con su vida — sin este
    campo, `expirando` con 9 días en un caso y `ok` con 25 en otro parecería una incoherencia.
- pt: 'Negativo quando já venceu. O certificado dos bancos vale um ano e **não tem renovação in-place**:
    vence e toda chamada passa a falhar no handshake, de uma vez.'
  es: 'Negativo cuando ya venció. El certificado de los bancos vale un año y **no tiene renovación in-place**:
    vence y toda llamada pasa a fallar en el handshake, de una vez.'
- pt: O host extraído do CN — é ele que diz o ambiente. `null` quando o banco não carimba host no CN (o
    do Inter é só o nome da aplicação).
  es: El host extraído del CN — es el que dice el ambiente. `null` cuando el banco no estampa host en
    el CN (el de Inter es solo el nombre de la aplicación).
- pt: Para onde ESTE servidor está apontado naquele banco.
  es: Adónde está apuntado ESTE servidor en aquel banco.
- pt: O certificado é do mesmo ambiente da `base_em_uso`? `false` significa que toda chamada vai falhar
    no handshake — o banco responde `403 mTLS`, que se lê como credencial inválida e manda conferir client_id
    e secret, que estão certos. `null` = não dá para dizer (sem host no CN).
  es: ¿El certificado es del mismo ambiente que `base_em_uso`? `false` significa que toda llamada va a
    fallar en el handshake — el banco responde `403 mTLS`, que se lee como credencial inválida y manda
    a revisar client_id y secret, que están bien. `null` = no se puede decir (sin host en el CN).
- pt: Por que não deu para ler, quando `ilegivel`.
  es: Por qué no se pudo leer, cuando `ilegivel`.
- pt: Extraído do CN, para conferência num olhar.
  es: Extraído del CN, para verificar de un vistazo.
- pt: A chave privada é a DESTE certificado? `null` quando não há par PEM para comparar. `false` é o erro
    clássico da troca de certificado — `.crt` novo com `.key` antigo —, que no handshake vira uma mensagem
    de TLS que não aponta o par trocado.
  es: ¿La clave privada es la de ESTE certificado? `null` cuando no hay par PEM para comparar. `false`
    es el error clásico del cambio de certificado — `.crt` nuevo con `.key` viejo —, que en el handshake
    se vuelve un mensaje de TLS que no señala el par cambiado.
- pt: Metadado do certificado mTLS. **Nunca** o certificado nem a chave.
  es: Metadato del certificado mTLS. **Nunca** el certificado ni la clave.
- pt: Valor total do checkout — maior que zero
  es: Valor total del checkout — mayor que cero
- pt: credito | debito
  es: credito | debito
- pt: 'Máximo de parcelas oferecido ao pagador (ele escolhe abaixo disso, salvo `parcelas_fixas`). Repassado
    ao banco COMO VEIO: não há teto aqui, e **valor mínimo de parcela não existe nesta API** — é regra
    comercial de quem chama, que calcula o número antes de enviar (ex.: `min(3, valor // 100)`). Se o
    banco recusar o número enviado, a resposta é `422` com o motivo dele em `upstream`, e o ajuste é reenviar
    com outra configuração.'
  es: 'Máximo de cuotas ofrecido al pagador (él elige por debajo de eso, salvo `parcelas_fixas`). Pasado
    al banco TAL COMO VINO: no hay tope aquí, y **el valor mínimo de cuota no existe en esta API** — es
    regla comercial de quien llama, que calcula el número antes de enviar (ej.: `min(3, valor // 100)`).
    Si el banco rechaza el número enviado, la respuesta es `422` con su motivo en `upstream`, y el ajuste
    es reenviar con otra configuración.'
- pt: 'Quem paga o juro do parcelamento: loja (BY_SELLER) ou emissor (BY_ISSUER)'
  es: 'Quién paga el interés de las cuotas: la tienda (BY_SELLER) o el emisor (BY_ISSUER)'
- pt: Se o pagador NÃO pode escolher a quantidade de parcelas
  es: Si el pagador NO puede elegir la cantidad de cuotas
- pt: Autenticação pelo emissor — apetite de risco do chamador
  es: Autenticación por el emisor — apetito de riesgo de quien llama
- pt: Sinaliza cobrança recorrente
  es: Señala cobranza recurrente
- pt: Oferece Pix no mesmo link (QR gerado pelo banco)
  es: Ofrece Pix en el mismo link (QR generado por el banco)
- pt: 'Default do banco: 7 dias'
  es: 'Default del banco: 7 días'
- pt: Para onde o pagador volta após pagar — http(s) apenas
  es: Adónde vuelve el pagador después de pagar — solo http(s)
- pt: Seu identificador
  es: Su identificador
- pt: Se enviado com endereço, exige street|logradouro, number|numero (numérico), city|cidade, state|uf
    e zip_code|cep — o C6 recusa endereço incompleto
  es: Si se envía con dirección, exige street|logradouro, number|numero (numérico), city|cidade, state|uf
    y zip_code|cep — el C6 rechaza dirección incompleta
- pt: 'Corpo do link de pagamento. Tudo aqui é do CONSUMIDOR da API: varia de

    cliente para cliente e viaja na requisição — esta API não guarda regra

    comercial de ninguém.


    Isso vale em particular para **política de parcelamento**: teto de parcelas e

    valor mínimo de parcela são da loja, e a aplicação que consome resolve os

    dois ANTES de chamar. Replicá-los aqui criaria uma segunda fonte de verdade

    que envelhece — e recusaria como inválido um parcelamento que o banco

    aceita.'
  es: 'Cuerpo del link de pago. Todo aquí es del CONSUMIDOR de la API: varía de

    cliente a cliente y viaja en la solicitud — esta API no guarda la regla

    comercial de nadie.


    Esto vale en particular para la **política de cuotas**: el tope de cuotas y

    el valor mínimo de cuota son de la tienda, y la aplicación que consume resuelve

    los dos ANTES de llamar. Replicarlos aquí crearía una segunda fuente de verdad

    que envejece — y rechazaría como inválido un plan de cuotas que el banco

    acepta.'
- pt: Id do checkout no banco
  es: Id del checkout en el banco
- pt: URL do link — para onde o pagador vai
  es: URL del link — adonde va el pagador
- pt: Resposta crua do banco (debug)
  es: Respuesta cruda del banco (debug)
- pt: Resposta normalizada do link de pagamento.
  es: Respuesta normalizada del link de pago.
- pt: Valor da cobrança
  es: Valor de la cobranza
- pt: Data de vencimento (ISO)
  es: Fecha de vencimiento (ISO)
- pt: Nosso número (opcional; o banco pode atribuir)
  es: Nosso número (opcional; el banco puede asignarlo)
- pt: Seu número / identificador do emissor (opcional)
  es: Su número / identificador del emisor (opcional)
- pt: 'Multa — repassada à API do banco (forma do banco). Ex.: {"tipo": "PERCENTUAL", "valor": 2.0}. No
    CNAB use o `pagamento` da remessa (guia: docs/api/encargos.md).'
  es: 'Multa — pasada a la API del banco (en la forma del banco). Ej.: {"tipo": "PERCENTUAL", "valor":
    2.0}. En CNAB use el `pagamento` de la remesa (guía: docs/api/encargos.md).'
- pt: Juros/mora — repassado à API do banco (forma do banco).
  es: Intereses/mora — pasado a la API del banco (en la forma del banco).
- pt: Desconto — repassado à API do banco (forma do banco).
  es: Descuento — pasado a la API del banco (en la forma del banco).
- pt: Identificador do tenant (resolve credenciais no cofre)
  es: Identificador del tenant (resuelve las credenciales en la bóveda)
- pt: '**Caminho**: `on` = API do banco · `off` = engine pyCobrança (default). Nome de banco aqui é apelido
    legado (`c6` = `on` + `banco=c6`) e sai na 4.0.0.'
  es: '**Camino**: `on` = API del banco · `off` = engine pyCobrança (default). Un nombre de banco aquí
    es alias heredado (`c6` = `on` + `banco=c6`) y sale en la 4.0.0.'
- pt: '**Instituição**: `c6`, `sicoob`, `inter`, `itau`, `banco_brasil`… Obrigatório com `provider=on|off`;
    no caminho `off` ainda é aceito em `account_config.bank`. Combinação inexistente responde `422` dizendo
    quais existem.'
  es: '**Institución**: `c6`, `sicoob`, `inter`, `itau`, `banco_brasil`… Obligatorio con `provider=on|off`;
    en el camino `off` todavía se acepta en `account_config.bank`. Una combinación inexistente responde
    `422` diciendo cuáles existen.'
- pt: 'Blob por provider (não unificado de propósito). c6: {agencia, conta, convenio}; sicoob: {cooperativa,
    conta, numeroCliente, codigoModalidade}.'
  es: 'Blob por provider (no unificado a propósito). c6: {agencia, conta, convenio}; sicoob: {cooperativa,
    conta, numeroCliente, codigoModalidade}.'
- pt: Credenciais do banco enviadas NO REQUEST (client_id, client_secret, pfx_base64, pfx_password). Usadas
    só em memória, nunca persistidas. Se omitidas, caem no cofre do servidor (VAULT__*).
  es: Credenciales del banco enviadas EN EL REQUEST (client_id, client_secret, pfx_base64, pfx_password).
    Usadas solo en memoria, nunca persistidas. Si se omiten, caen en la bóveda del servidor (VAULT__*).
- pt: Id da cobrança no banco (nosso número/txid)
  es: Id de la cobranza en el banco (nosso número/txid)
- pt: PIX copia-e-cola (EMV), quando híbrido
  es: PIX copia y pega (EMV), cuando es híbrido
- pt: 'O QR **liquida o título**? `true` = Bolepix: QR dinâmico registrado no banco, e pagar por ele dá
    baixa. `false` = QR **avulso**, montado a partir de `chave_pix`: credita a chave e deixa o título
    **em aberto** — risco de segunda cobrança ou de protesto de boleto já pago. `null` = boleto sem PIX.
    O caminho `on` sempre devolve `true`; no `off` depende de você mandar `pix_copia_cola` (do banco)
    ou `chave_pix`.'
  es: '¿El QR **liquida el título**? `true` = Bolepix: QR dinámico registrado en el banco, y pagar por
    él da de baja. `false` = QR **suelto**, montado a partir de `chave_pix`: acredita la clave y deja
    el título **en abierto** — riesgo de segunda cobranza o de protesto de un boleto ya pagado. `null`
    = boleto sin PIX. El camino `on` siempre devuelve `true`; en el `off` depende de que usted mande `pix_copia_cola`
    (del banco) o `chave_pix`.'
- pt: PDF do boleto em base64, quando disponível
  es: PDF del boleto en base64, cuando está disponible
- pt: Resposta normalizada — mesmo shape para qualquer provider.
  es: Respuesta normalizada — el mismo shape para cualquier provider.
- pt: idRec da recorrência aprovada
  es: idRec de la recurrencia aprobada
- pt: Valor da parcela do ciclo — maior que zero
  es: Valor de la cuota del ciclo — mayor que cero
- pt: Vencimento da parcela. O BACEN quer o agendamento com pelo menos **2 dias** de antecedência; menos
    que isso o banco pode recusar. Data no PASSADO é recusada aqui — não existe agendar para ontem.
  es: Vencimiento de la cuota. El BACEN quiere el agendamiento con al menos **2 días** de anticipación;
    con menos, el banco puede rechazar. Una fecha en el PASADO se rechaza aquí — no existe agendar para
    ayer.
- pt: 'Uma cobrança do ciclo (cobr) — agendar >= 2 dias antes do vencimento.

    O agendamento é responsabilidade do produto consumidor (gateway stateless).'
  es: 'Una cobranza del ciclo (cobr) — agendar >= 2 días antes del vencimiento.

    El agendamiento es responsabilidad del producto consumidor (gateway stateless).'
- pt: Página de recebíveis/transações — itens crus do banco + paginação.
  es: Página de cuentas por cobrar/transacciones — ítems crudos del banco + paginación.
- pt: Tenant dono destas credenciais
  es: Tenant dueño de estas credenciales
- pt: 'Caminho (`on`) ou o nome do banco no formato legado (ex: c6)'
  es: 'Camino (`on`) o el nombre del banco en el formato heredado (ej.: c6)'
- pt: '**Instituição** destas credenciais. É por ela que a credencial é guardada e procurada — com `provider=on`,
    é o que separa o C6 do Sicoob do mesmo tenant.'
  es: '**Institución** de estas credenciales. Es por ella que la credencial se guarda y se busca — con
    `provider=on`, es lo que separa el C6 del Sicoob del mismo tenant.'
- pt: Esquema **próprio de cada banco** — o vigente sai em `GET /bancos`. Cifradas em repouso; a chave
    é derivada do token, então o servidor não decifra sozinho.
  es: Esquema **propio de cada banco** — el vigente sale en `GET /bancos`. Cifradas en reposo; la clave
    se deriva del token, así que el servidor no descifra solo.
- pt: Cadastro de credenciais do banco — devolve um token opaco (única vez).
  es: Registro de credenciales del banco — devuelve un token opaco (una sola vez).
- pt: 'Token opaco (bapi_...) — exibido UMA única vez; guarde-o. Use nas demais rotas via Authorization:
    Bearer'
  es: 'Token opaco (bapi_...) — mostrado UNA sola vez; guárdelo. Úselo en las demás rutas vía Authorization:
    Bearer'
- pt: Instituição destas credenciais (eco do request).
  es: Institución de estas credenciales (eco del request).
- pt: 'Metadado do certificado mTLS enviado, quando há. Vem no cadastro porque é onde o erro custa menos:
    carregar o certificado do ambiente errado só aparecia no primeiro handshake, horas depois.'
  es: 'Metadato del certificado mTLS enviado, cuando lo hay. Viene en el registro porque es donde el error
    cuesta menos: cargar el certificado del ambiente equivocado solo aparecía en el primer handshake,
    horas después.'
- pt: Quem paga o juro do parcelamento. Default `loja` = BY_SELLER (decisão 1).
  es: Quién paga el interés de las cuotas. Default `loja` = BY_SELLER (decisión 1).
- pt: Cada item exige txid e data_vencimento
  es: Cada ítem exige txid y data_vencimento
- pt: As cobranças a revisar — mesma forma da criação. Cada item exige txid, data_vencimento e devedor
  es: Las cobranzas a revisar — misma forma que la creación. Cada ítem exige txid, data_vencimento y devedor
- pt: 'Revisão de lote de cobv (PATCH BACEN `/lotecobv/{id}`).


    Sem `descricao`, ao contrário do `LoteCobvIn`: o PATCH do BACEN carrega

    apenas `cobsv`. Reaproveitar o schema da criação obrigaria a mandar um campo

    que o banco ignora — e um campo que o chamador acha que está alterando, mas

    não está, é pior que campo ausente. Daí o `extra="forbid"`: mandar

    `descricao` aqui é `422`, não silêncio.'
  es: 'Revisión de un lote de cobv (PATCH BACEN `/lotecobv/{id}`).


    Sin `descricao`, a diferencia del `LoteCobvIn`: el PATCH del BACEN lleva

    solo `cobsv`. Reaprovechar el schema de la creación obligaría a mandar un campo

    que el banco ignora — y un campo que quien llama cree que está modificando, pero

    no, es peor que un campo ausente. De ahí el `extra="forbid"`: mandar

    `descricao` aquí es `422`, no silencio.'
- pt: Nome do pagador
  es: Nombre del pagador
- pt: CPF ou CNPJ (só dígitos)
  es: CPF o CNPJ (solo dígitos)
- pt: Endereço do pagador (opcional)
  es: Dirección del pagador (opcional)
- pt: Valor original da cobrança
  es: Valor original de la cobranza
- pt: Chave Pix do recebedor. Se omitida, usa `account_config.chave_pix`.
  es: Clave Pix del receptor. Si se omite, usa `account_config.chave_pix`.
- pt: 'Txid do BACEN: 26 a 35 caracteres, só letras e dígitos. Obrigatório na cobv. Na cob é opcional
    — enviado, é o identificador da cobrança (`PUT`); omitido, o banco gera um.'
  es: 'Txid del BACEN: 26 a 35 caracteres, solo letras y dígitos. Obligatorio en la cobv. En la cob es
    opcional — enviado, es el identificador de la cobranza (`PUT`); omitido, el banco genera uno.'
- pt: Validade da cob imediata, em segundos (ignorado na cobv).
  es: Validez de la cob inmediata, en segundos (ignorado en la cobv).
- pt: Se presente, emite cobv (cobrança com vencimento) em vez de cob imediata.
  es: Si está presente, emite cobv (cobranza con vencimiento) en vez de cob inmediata.
- pt: Dias corridos em que a cobv ainda pode ser paga após o vencimento.
  es: Días corridos en que la cobv todavía puede pagarse después del vencimiento.
- pt: Devedor (obrigatório na cobv)
  es: Deudor (obligatorio en la cobv)
- pt: solicitacaoPagador (texto ao pagador)
  es: solicitacaoPagador (texto al pagador)
- pt: 'Cobrança Pix dinâmica (padrão BACEN: cob imediata ou cobv com vencimento).'
  es: 'Cobranza Pix dinámica (estándar BACEN: cob inmediata o cobv con vencimiento).'
- pt: '**Caminho**: só `on` (API do banco) — Pix dinâmico não existe offline, e `off` responde `422`.
    Nome de banco aqui é apelido legado (`c6` = `on` + `banco=c6`).'
  es: '**Camino**: solo `on` (API del banco) — el Pix dinámico no existe offline, y `off` responde `422`.
    Un nombre de banco aquí es alias heredado (`c6` = `on` + `banco=c6`).'
- pt: 'Blob por provider. c6: {chave_pix, ...}'
  es: 'Blob por provider. c6: {chave_pix, ...}'
- pt: 'Credenciais do banco enviadas NO REQUEST (client_id, client_secret, pfx_base64, pfx_password).
    Só em memória; fallback: cofre VAULT__*.'
  es: 'Credenciales del banco enviadas EN EL REQUEST (client_id, client_secret, pfx_base64, pfx_password).
    Solo en memoria; fallback: bóveda VAULT__*.'
- pt: Valor original da cobrança, como o banco devolveu
  es: Valor original de la cobranza, tal como lo devolvió el banco
- pt: Payload EMV (copia-e-cola)
  es: Payload EMV (copia y pega)
- pt: URL do payload (loc.location)
  es: URL del payload (loc.location)
- pt: Instante em que a cobrança deixa de ser pagável. Na cob imediata é criação + expiração; na cobv
    é o vencimento + a validade após ele.
  es: Instante en que la cobranza deja de ser pagable. En la cob inmediata es creación + expiración; en
    la cobv es el vencimiento + la validez posterior.
- pt: Resposta normalizada da cobrança Pix.
  es: Respuesta normalizada de la cobranza Pix.
- pt: "**Caminho** da cobrança — e só isso. Qual banco é o campo `banco`.\n\n- `on`  — **ON-line**: a\
    \ API do banco (OAuth2 + mTLS). Exige credencial.\n- `off` — **OFF-line**: a engine [pyCobrança](https://github.com/Maxwbh/pyCobranca)\n\
    \  no próprio processo. Sem rede, sem convênio.\n\nOs dois eixos eram um campo só, e o preço aparecia\
    \ na borda: \"qual banco\"\nvivia no `provider` quando online e dentro do `account_config` quando\n\
    offline. Separados, trocar de mundo é trocar `provider` — o `banco` fica.\n\nOs nomes de banco continuam\
    \ aceitos como **apelido legado** (`c6` = `on` +\n`banco=c6`), para não quebrar quem já integrou.\
    \ Saem na 4.0.0."
  es: "**Camino** de la cobranza — y solo eso. Qué banco es el campo `banco`.\n\n- `on`  — **ON-line**:\
    \ la API del banco (OAuth2 + mTLS). Exige credencial.\n- `off` — **OFF-line**: la engine [pyCobrança](https://github.com/Maxwbh/pyCobranca)\n\
    \  en el propio proceso. Sin red, sin convenio.\n\nLos dos ejes eran un solo campo, y el precio aparecía\
    \ en el borde: \"qué banco\"\nvivía en el `provider` cuando online y dentro del `account_config` cuando\n\
    offline. Separados, cambiar de mundo es cambiar `provider` — el `banco` queda.\n\nLos nombres de banco\
    \ siguen aceptados como **alias heredado** (`c6` = `on` +\n`banco=c6`), para no romper a quien ya\
    \ integró. Salen en la 4.0.0."
- pt: Identificador do contrato no recebedor
  es: Identificador del contrato en el receptor
- pt: Descrição do objeto do contrato
  es: Descripción del objeto del contrato
- pt: SEMANAL | MENSAL | TRIMESTRAL | SEMESTRAL | ANUAL
  es: SEMANAL | MENSAL | TRIMESTRAL | SEMESTRAL | ANUAL
