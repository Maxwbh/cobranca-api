- pt: '**Campo sem valor no arquivo não vem na resposta** — a chave é omitida,

    não vem `null`. `numero_documento` e `data_credito` são os que mais

    faltam: em retorno de liquidação simples, nenhum dos dois costuma vir.


    As **datas saem como o banco as escreveu**, sem conversão: `DDMMAA` no

    CNAB 400 (`"150726"` = 15/07/2026) e `DDMMAAAA` no CNAB 240. Não é

    ISO — converta antes de comparar com data do seu sistema.

    '
  es: '**Un campo sin valor en el archivo no viene en la respuesta** — la clave se omite,

    no viene `null`. `numero_documento` y `data_credito` son los que más

    faltan: en un retorno de liquidación simple, ninguno de los dos suele venir.


    Las **fechas salen como el banco las escribió**, sin conversión: `DDMMAA` en el

    CNAB 400 (`"150726"` = 15/07/2026) y `DDMMAAAA` en el CNAB 240. No es

    ISO — convierta antes de comparar con la fecha de su sistema.

    '
