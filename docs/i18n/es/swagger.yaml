  es: Revisar
- pt: 'Revisa a cobrança (PATCH BACEN): valor, solicitacaoPagador, calendario...'
  es: 'Revisa la cobranza (PATCH BACEN): valor, solicitacaoPagador, calendario...'
- pt: 'Emite Bolepix (boleto + QR Pix EVP). Reenvio com o mesmo

    external_reference_id devolve a cobrança existente (idempotente no banco).


    Omitido, o `external_reference_id` é gerado aqui — e volta em `id` e no

    `Location`. É o único identificador de consulta, então perdê-lo é perder o

    boleto.'
  es: 'Emite un Bolepix (boleto + QR Pix EVP). Reenviar con el mismo

    external_reference_id devuelve la cobranza existente (idempotente en el banco).


    Omitido, el `external_reference_id` se genera aquí — y vuelve en `id` y en el

    `Location`. Es el único identificador de consulta, así que perderlo es perder

    el boleto.'
