    de 3 com 1 falha, vale 2 (e `X-Boletos-Failed` vale 1).

    '
  es: 'Boletos **generados** — no el tamaño del lote enviado. En un lote

    de 3 con 1 falla, vale 2 (y `X-Boletos-Failed` vale 1).

    '
- pt: 'Array JSON com o registro de cada boleto gerado: `item_id`,

    `indice`, `bank`, `status`, `nosso_numero`,

    `nosso_numero_formatado`, `nosso_numero_dv`, `codigo_barras` e

    `linha_digitavel`.

    '
  es: 'Array JSON con el registro de cada boleto generado: `item_id`,

    `indice`, `bank`, `status`, `nosso_numero`,

    `nosso_numero_formatado`, `nosso_numero_dv`, `codigo_barras` y

    `linha_digitavel`.

    '
- pt: Quantidade de itens que falharam na validação.
  es: Cantidad de ítems que fallaron en la validación.
- pt: 'Array JSON com os itens que falharam (`item_id`, `indice`,

    `bank`, `status`, `errors`). `[]` quando não há falhas.

    '
  es: 'Array JSON con los ítems que fallaron (`item_id`, `indice`,

    `bank`, `status`, `errors`). `[]` cuando no hay fallas.

    '
- pt: Resultado global do lote.
  es: Resultado global del lote.
- pt: 'Presente **só** quando `X-Boletos-Info` não coube no header e

    virou `[]`. O PDF continua sendo entregue e os contadores

    (`X-Boletos-Count`, `X-Boletos-Failed`) seguem válidos —

    para o detalhe por item, use `include_data=true`.


    Por que existe: o metadado cresce ~300 B por boleto (100 itens

    ≈ 30 KB, 200 ≈ 60 KB). Acima de ~64 KB o `http.client` do Python

    recusa a resposta **inteira** e o cliente perde até o PDF.

    Com `LOTE_MAX_ITENS` no default (200) isso **nunca** dispara;

    ajuste `HEADER_JSON_MAX_BYTES` (ex.: `6144`) se estiver atrás de

    nginx (8 KB) ou ALB (16 KB).

    '
  es: 'Presente **solo** cuando `X-Boletos-Info` no cupo en el header y

    se volvió `[]`. El PDF sigue entregándose y los contadores

    (`X-Boletos-Count`, `X-Boletos-Failed`) siguen válidos —

    para el detalle por ítem, use `include_data=true`.


    Por qué existe: el metadato crece ~300 B por boleto (100 ítems

    ≈ 30 KB, 200 ≈ 60 KB). Por encima de ~64 KB el `http.client` de Python

    rechaza la respuesta **entera** y el cliente pierde hasta el PDF.

    Con `LOTE_MAX_ITENS` en el default (200) esto **nunca** se dispara;

    ajuste `HEADER_JSON_MAX_BYTES` (ej.: `6144`) si está detrás de

    nginx (8 KB) o ALB (16 KB).

    '
- pt: 'O mesmo que `X-Boletos-Info-Truncado`, para `X-Boletos-Errors`.

    '
  es: 'Lo mismo que `X-Boletos-Info-Truncado`, para `X-Boletos-Errors`.

    '
- pt: Onde buscar o detalhe quando houve truncagem.
  es: Dónde buscar el detalle cuando hubo truncamiento.
- pt: Response com include_data=true (lote de 3, 1 falha)
  es: Respuesta con include_data=true (lote de 3, 1 falla)
- pt: 'Nenhum item do lote é válido, `data` não é um array de objetos, ou

    `type`/`template` fora dos valores aceitos.

    '
  es: 'Ningún ítem del lote es válido, `data` no es un array de objetos, o

    `type`/`template` fuera de los valores aceptados.

    '
- pt: 'Lote acima do limite `LOTE_MAX_ITENS` (default **200**), ou arquivo

    acima de `UPLOAD_MAX_BYTES` (default **10 MB**). O teto de bytes é

    conferido ANTES de carregar o conteúdo.

    Para volumes maiores, use o processamento assíncrono

    (`POST /jobs/boletos`, no gateway).

    '
  es: 'Lote por encima del límite `LOTE_MAX_ITENS` (default **200**), o archivo

    por encima de `UPLOAD_MAX_BYTES` (default **10 MB**). El tope de bytes se

    verifica ANTES de cargar el contenido.

    Para volúmenes mayores, use el procesamiento asincrónico

    (`POST /jobs/boletos`, en el gateway).

    '
- pt: Gerar arquivo de remessa · 📄 arquivo CNAB (texto)
  es: Generar archivo de remesa · 📄 archivo CNAB (texto)
- pt: 'Gera arquivo de remessa CNAB 240 ou 400.

    Com `pix=true`, gera remessa com segmento PIX (boleto híbrido).


    **O nome do arquivo importa em alguns bancos.** O `Content-Disposition`

    traz o nome que o BANCO exige quando o layout o define — no **Inter**,

    `CI400_001_<sequencial>.REM`, com o mesmo sequencial gravado no header,

    e o Internet Banking recusa o upload se os dois divergirem. Nos demais

    segue o descritivo (`remessa-<banco>-<tipo>.rem`), que não é exigência

    de ninguém. **Suba o arquivo com o nome que veio no header.**


    **Encargos por pagamento** — cada um é um **trio** código/tipo → valor →

    data (a data é opcional). Use os nomes exatos; não há apelido:


    | Encargo | Código/tipo | Valor | Data |

    |---|---|---|---|

    | Multa | `codigo_multa` (`0` isento, `1` valor fixo, `2` percentual) | `percentual_multa` · `valor_multa`
    (só Inter) | `data_multa` |

    | Juros/Mora | `tipo_mora` (`1` valor/dia, `2` taxa mensal %, `3` isento) | `valor_mora` (400) · `percentual_mora`
    (240 e Inter) | `data_mora` |

    | Desconto 1º/2º/3º | `cod_desconto` (`4` = percentual, só Inter) | `valor_desconto` · `percentual_desconto`
    (só Inter) | `data_desconto` … |

    | IOF | — | `valor_iof` | — |

    | Abatimento | — | `valor_abatimento` | — |

    | Protesto | `codigo_protesto` | `dias_protesto` | — |


    > **A unidade (% ou R\$) muda por layout — e a API valida.** No

    > **CNAB 240** o código/tipo é gravado no arquivo, então o banco sabe a

    > unidade: multa `codigo_multa` (`1` valor fixo, `2` percentual), mora

    > `tipo_mora` (`1` valor/dia, `2` taxa mensal %). No **CNAB 400** o

    > código **não** é gravado — a unidade é fixa: multa sempre percentual,

    > mora sempre valor/dia. Por isso, no 400, `codigo_multa=1`,

    > `tipo_mora=2` e `percentual_mora` sozinho respondem **400** (seriam

    > cobrados na unidade errada — R\$ 50 lido como 50%). Bancos onde a

    > multa vai por instrução (BB e Itaú no 400) não têm posição de multa.

    >

    > **O Inter (077) é a exceção nos três eixos.** O layout dele tem os

    > **dois** campos de cada encargo (itens 10/11, 14/15 e 30/31 do registro

    > tipo 1) e escolhe pelo código, então `valor_multa`, `percentual_mora` e

    > `percentual_desconto` valem lá — e **só lá**, no CNAB 400. Medido A/B

    > em todos os layouts: nos outros o campo entra, não é gravado e some.

    > Por isso a API recusa em vez de deixar o encargo sumir; o erro diz quem

    > grava o campo.


    📖 **Guia completo com a matriz por banco:** [docs/api/encargos.md](https://github.com/Maxwbh/cobranca-api/blob/main/docs/api/encargos.md)


    > **Campo não reconhecido responde 400** com a dica do trio correto.

    > Antes era descartado em silêncio: a API devolvia 200 e o arquivo ia

    > para o banco **sem o encargo pedido**.

    '
  es: 'Genera el archivo de remesa CNAB 240 o 400.

    Con `pix=true`, genera la remesa con segmento PIX (boleto híbrido).


    **El nombre del archivo importa en algunos bancos.** El `Content-Disposition`

    trae el nombre que el BANCO exige cuando el layout lo define — en **Inter**,

    `CI400_001_<sequencial>.REM`, con el mismo secuencial grabado en el header,

    y el Internet Banking rechaza la subida si los dos divergen. En los demás

    sigue el descriptivo (`remessa-<banco>-<tipo>.rem`), que no es exigencia

    de nadie. **Suba el archivo con el nombre que vino en el header.**


    **Cargos por pago** — cada uno es un **trío** código/tipo → valor →

    fecha (la fecha es opcional). Use los nombres exactos; no hay alias:


    | Cargo | Código/tipo | Valor | Fecha |

    |---|---|---|---|

    | Multa | `codigo_multa` (`0` exento, `1` valor fijo, `2` porcentual) | `percentual_multa` · `valor_multa`
    (solo Inter) | `data_multa` |

    | Intereses/Mora | `tipo_mora` (`1` valor/día, `2` tasa mensual %, `3` exento) | `valor_mora` (400)
    · `percentual_mora` (240 e Inter) | `data_mora` |

    | Descuento 1º/2º/3º | `cod_desconto` (`4` = porcentual, solo Inter) | `valor_desconto` · `percentual_desconto`
    (solo Inter) | `data_desconto` … |

    | IOF | — | `valor_iof` | — |

    | Rebaja | — | `valor_abatimento` | — |

    | Protesto | `codigo_protesto` | `dias_protesto` | — |


    > **La unidad (% o R\$) cambia por layout — y la API valida.** En el

    > **CNAB 240** el código/tipo se graba en el archivo, así que el banco sabe la

    > unidad: multa `codigo_multa` (`1` valor fijo, `2` porcentual), mora

    > `tipo_mora` (`1` valor/día, `2` tasa mensual %). En el **CNAB 400** el

    > código **no** se graba — la unidad es fija: multa siempre porcentual,

    > mora siempre valor/día. Por eso, en el 400, `codigo_multa=1`,

    > `tipo_mora=2` y `percentual_mora` solo responden **400** (se

    > cobrarían en la unidad equivocada — R\$ 50 leído como 50%). Los bancos donde la

    > multa va por instrucción (BB e Itaú en el 400) no tienen posición de multa.

    >

    > **Inter (077) es la excepción en los tres ejes.** Su layout tiene los

    > **dos** campos de cada cargo (ítems 10/11, 14/15 y 30/31 del registro

    > tipo 1) y elige por el código, así que `valor_multa`, `percentual_mora` y

    > `percentual_desconto` valen ahí — y **solo ahí**, en el CNAB 400. Medido A/B

    > en todos los layouts: en los otros el campo entra, no se graba y desaparece.

    > Por eso la API rechaza en vez de dejar que el cargo desaparezca; el error dice quién

    > graba el campo.


    📖 **Guía completa con la matriz por banco:** [docs/api/encargos.md](https://github.com/Maxwbh/cobranca-api/blob/main/docs/api/encargos.md)


    > **Un campo no reconocido responde 400** con la pista del trío correcto.

    > Antes se descartaba en silencio: la API devolvía 200 y el archivo iba

    > al banco **sin el cargo pedido**.

    '
- pt: 'Se `true`, usa classe PIX do banco para adicionar segmento PIX

    na remessa CNAB. CNAB 400 PIX: Bradesco, Itaú, C6, Santander.

    CNAB 240 PIX: Sicoob, Caixa, Banco do Brasil.

    '
  es: 'Si es `true`, usa la clase PIX del banco para agregar el segmento PIX

    en la remesa CNAB. CNAB 400 PIX: Bradesco, Itaú, C6, Santander.

    CNAB 240 PIX: Sicoob, Caixa, Banco do Brasil.

    '
- pt: Arquivo JSON com dados da remessa e pagamentos
  es: Archivo JSON con los datos de la remesa y los pagos
- pt: Banco C6 — CNAB 400
  es: Banco C6 — CNAB 400
- pt: 'Use `codigo_beneficiario` (obrigatório). NÃO enviar `convenio`. Campos do pagamento: `nome_sacado`,
    `documento_sacado`, endereço separado.

    '
  es: 'Use `codigo_beneficiario` (obligatorio). NO enviar `convenio`. Campos del pago: `nome_sacado`,
    `documento_sacado`, dirección separada.

    '
- pt: Sicoob — CNAB 240
  es: Sicoob — CNAB 240
- pt: 'NÃO enviar `variacao` (campo do boleto, não existe na remessa CNAB240 Sicoob).

    '
  es: 'NO enviar `variacao` (campo del boleto, no existe en la remesa CNAB240 Sicoob).

    '
- pt: Arquivo de remessa gerado
  es: Archivo de remesa generado
- pt: '⚠️ Presente **só quando há aviso** — JSON com o que o layout

    **não gravou** do que você mandou.


    `carteira` está na base de toda remessa, mas **oito layouts não

    têm esse campo**: a CrediSIS e o Santander no CNAB 400, e seis

    dos sete no 240, onde a FEBRABAN separa o *código da carteira*

    (posição 58 do segmento P) da *modalidade* do banco.


    Quem monta a remessa com o mesmo dicionário do boleto — o

    caminho natural — acreditava ter escolhido a carteira, e o

    arquivo saía com a do padrão. **O arquivo está correto**; o que

    faltava era o sinal. O aviso nomeia o campo que aquele layout

    grava de verdade (`codigo_carteira`, `modalidade_carteira`…).

    '
  es: '⚠️ Presente **solo cuando hay aviso** — JSON con lo que el layout

    **no grabó** de lo que usted mandó.


    `carteira` está en la base de toda remesa, pero **ocho layouts no

    tienen ese campo**: CrediSIS y Santander en el CNAB 400, y seis

    de los siete en el 240, donde la FEBRABAN separa el *código de la cartera*

    (posición 58 del segmento P) de la *modalidad* del banco.


    Quien monta la remesa con el mismo diccionario del boleto — el

    camino natural — creía haber elegido la cartera, y el

    archivo salía con la del default. **El archivo está correcto**; lo que

    faltaba era la señal. El aviso nombra el campo que ese layout

    graba de verdad (`codigo_carteira`, `modalidade_carteira`…).

    '
- pt: Conteúdo do arquivo CNAB
  es: Contenido del archivo CNAB
- pt: 'Arquivo acima de `UPLOAD_MAX_BYTES` (default **10 MB**). O teto é

    conferido ANTES de carregar o conteúdo — sem ele, um envio grande

    derrubava o processo por memória antes de qualquer validação.

    '
  es: 'Archivo por encima de `UPLOAD_MAX_BYTES` (default **10 MB**). El tope se

    verifica ANTES de cargar el contenido — sin él, un envío grande

    tumbaba el proceso por memoria antes de cualquier validación.

    '
- pt: Processar arquivo de retorno
  es: Procesar archivo de retorno
- pt: 'Faz parsing de arquivo de retorno CNAB 240 ou 400.


    O **banco sai do header do arquivo**, não do `bank` do request: é dele

    que dependem o layout e o sentido de cada ocorrência. Quando os dois

    discordam a resposta é `400` — antes o `bank` era exigido e nunca lido,

    então subir o retorno do banco errado devolvia `200` com campos lidos

    pelo layout de outro banco.


    Cada item traz `layout_generico`: `true` avisa que a engine não tinha o

    mapa daquele banco e leu com um layout de reserva.

    '
  es: 'Hace el parsing del archivo de retorno CNAB 240 o 400.


    El **banco sale del header del archivo**, no del `bank` del request: de él

    dependen el layout y el sentido de cada ocurrencia. Cuando los dos

    discrepan la respuesta es `400` — antes el `bank` era exigido y nunca leído,

    así que subir el retorno del banco equivocado devolvía `200` con campos leídos

    por el layout de otro banco.


    Cada ítem trae `layout_generico`: `true` avisa que la engine no tenía el

    mapa de ese banco y leyó con un layout de reserva.

    '
- pt: 'Banco esperado. Conferido contra o header do arquivo; divergência

    responde `400` em vez de ler com o layout errado.

