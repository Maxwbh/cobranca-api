openapi: 3.0.3
info:
  title: Cobranca-API — Offline (engine pyCobranca)
  description: "Superficie **offline** de la plataforma **Cobranca-API** (servicio único **100% Python**):\n\
    generación de boletos bancarios brasileños, archivos CNAB y parsing de extractos OFX —\nservida **nativamente**\
    \ por la engine [pyCobrança](https://github.com/Maxwbh/pyCobranca)\ndentro del propio proceso FastAPI\
    \ (sin sidecar, sin proxy).\n\n> **Nota de versión (v2.0.0):** los contratos de esta superficie (paths,\
    \ campos,\n> headers `X-*`) siguen compatibles con la v1.x. El único cambio de alcance es\n> el formato\
    \ de salida: la engine emite **PDF** — `jpg`/`png`/`tif` responden\n> **400**.\n\n## Offline (`/api/*`)\
    \ × Gateway (raíz) — cuándo usar cada uno\n\n| | **Offline (esta doc)** | **Gateway REST** ([Swagger\
    \ `/docs`](./index.html)) |\n|---|---|---|\n| Qué hace | GENERA el documento (boleto/CNAB) localmente | REGISTRA\
    \ la cobranza en la API online del banco (C6, Sicoob, Inter, Itaú) |\n| Boleto | No registrado (el\
    \ banco solo lo conoce en el pago) | **Registrado** (CIP, en tiempo real) + Pix, Bolepix, webhooks\
    \ |\n| Autenticación | **Ninguna** (por diseño — no toca banco ni secreto) | Token `bapi_` (`POST\
    \ /credenciais`) |\n| Conciliación | Retorno CNAB / OFX (archivos) | Webhooks + consultas online |\n\
    \n> **Autenticación:** esta superficie no tiene `securitySchemes` a propósito.\n> El mecanismo `bapi_`\
    \ pertenece al gateway y está documentado en el\n> [Swagger del gateway](./index.html).\n\n## Cómo probar\n\
    \n```bash\ncurl {base}/api/health                          # salud del servicio\ncurl -G {base}/api/boleto\
    \ -o boleto.pdf \\\n  --data-urlencode 'bank=banco_brasil' --data-urlencode 'type=pdf' \\\n  --data-urlencode\
    \ 'data={\"valor\":150.0,\"cedente\":\"Empresa\",\"documento_cedente\":\"11222333000181\",\"sacado\"\
    :\"Cliente\",\"sacado_documento\":\"52998224725\",\"agencia\":\"3073\",\"conta_corrente\":\"12345678\"\
    ,\"convenio\":\"1234567\",\"carteira\":\"18\",\"nosso_numero\":\"123\",\"data_vencimento\":\"2027-12-30\"\
    }'\n```\n\n**Links:** [Repositorio](https://github.com/Maxwbh/cobranca-api) ·\n[CHANGELOG](https://github.com/Maxwbh/cobranca-api/blob/main/CHANGELOG.md)\
    \ ·\n[Guías por banco](https://github.com/Maxwbh/cobranca-api/tree/main/docs/development)\n\n## Funcionalidades\n\
    \n- **Boletos**: Generación de boletos en **PDF** — 19 bancos, sin convenio\n- **Remesa**: Generación\
    \ de archivos CNAB 240 y 400\n- **Retorno**: Parsing de archivos de retorno CNAB 240 y 400\n- **OFX**:\
    \ Parsing de extractos bancarios OFX v1 (SGML) y v2 (XML) con extracción automática de nosso_numero\n\
    \n## Bancos Soportados\n\nLos 18, tal como la engine responde hoy. `GET /api/bancos` devuelve esta\
    \ misma\nmatriz por introspección del código — si las dos discrepan, la respuesta\nmanda.\n\n| Banco\
    \ | Código | Boleto | CNAB 240 | CNAB 400 | PIX en la remesa |\n|-------|--------|--------|----------|----------|-----|\n\
    | Banco do Brasil | 001 | ✅ | ✅ | ✅ | ✅ |\n| Banco do Nordeste | 004 | ✅ | — | ✅ | — |\n| Banestes\
    \ | 021 | ✅ | — | — | — |\n| Santander | 033 | ✅ | ✅ | ✅ | ✅ |\n| Banrisul | 041 | ✅ | — | ✅ | — |\n\
    | BRB — Banco de Brasília | 070 | ✅ | — | ✅ | — |\n| Ailos | 085 | ✅ | ✅ | — | — |\n| CrediSIS | 097\
    \ | ✅ | — | ✅ | — |\n| Caixa | 104 | ✅ | ✅ | — | ✅ |\n| Unicred | 136 | ✅ | ✅ | ✅ | — |\n| Bradesco\
    \ | 237 | ✅ | — | ✅ | ✅ |\n| Banco C6 | 336 | ✅ | — | ✅ | ✅ |\n| Itaú | 341 | ✅ | — | ✅ | ✅ |\n| HSBC\
    \ | 399 | ✅ | — | — | — |\n| Safra | 422 | ✅ | — | — | — |\n| Citibank | 745 | ✅ | — | ✅ | — |\n|\
    \ Sicredi | 748 | ✅ | ✅ | — | — |\n| Sicoob | 756 | ✅ | ✅ | ✅ | ✅ |\n\nEl boleto en PDF vale para\
    \ los 18. Las otras tres columnas son del **archivo de\nremesa**: un banco sin CNAB aquí emite el\
    \ boleto, pero no genera remesa por\nesta superficie.\n"
  version: 3.0.0
  contact:
    name: Maxwell da Silva Oliveira — M&S do Brasil LTDA
    email: maxwbh@gmail.com
    url: https://msbrasil.inf.br
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:8000
  description: Local — `docker run -p 8000:8000 ghcr.io/maxwbh/cobranca-api:latest`
- url: '{base_url}'
  description: Su instancia alojada
  variables:
    base_url:
      default: http://localhost:8000
      description: Base URL de su instalación. Cámbiela por el hostname que muestre su proveedor de hosting.
tags:
- name: Health
  description: Verificación de salud de la API
- name: Boleto
  description: Operaciones con boletos bancarios
- name: Remessa
  description: Generación de archivos de remesa CNAB
- name: Retorno
  description: Parsing de archivos de retorno CNAB
- name: OFX
  description: 'Parsing de extractos bancarios OFX (v1 SGML y v2 XML) por la engine.

    El `nosso_numero` sale del memo con regla **por banco**, no con una regex genérica.

    '
- name: Render
  description: '**USO INTERNO** — renderizado con cuerpo JSON y respuesta normalizada,

    consumido por el propio gateway (provider offline). Los consumidores externos

    deben preferir las rutas de `Boleto`/`Remessa` o el gateway.

    '
paths:
  /api/health:
    get:
      tags:
      - Health
      summary: Verificar el status de la API
      description: 'Sonda de disponibilidad de la superficie offline. Responde sin tocar

        red, banco ni disco: prueba que **el proceso está en pie y enrutando**, y

        solo eso. No verifica credencial, volumen de artefactos ni engine — una

        sonda que fallara por un problema transitorio reiniciaría el container en

        bucle, que es peor que el problema que detectaría.

        '
      operationId: healthCheck
      responses:
        '200':
          description: API funcionando normalmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: OK
                timestamp: '2026-08-19T05:32:47.446605+00:00'
  /api/info:
    get:
      tags:
      - Health
      summary: Información de la API
      description: Devuelve nombre, versión, bancos soportados y formatos
      operationId: getInfo
      responses:
        '200':
          description: Información de la API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
  /api/metadata:
    get:
      tags:
      - Health
      summary: Metadatos de la API y de la engine pyCobrança
      description: 'Devuelve detalles de la API (nombre, versión, engine), de la engine pyCobrança

        (versión, repositorio) y la lista completa de endpoints disponibles.

        '
      operationId: getMetadata
      responses:
        '200':
          description: Metadatos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataResponse'
  /api/bancos:
    get:
      tags:
      - Health
      summary: Lista los bancos soportados con capacidades detalladas
      description: 'Devuelve los 19 bancos soportados, con el código bancario, los layouts CNAB

        de remesa disponibles y si hay remesa con PIX.


        Los datos vienen dinámicamente de la engine pyCobrança (`Bancos`).

        '
      operationId: listBancos
      responses:
        '200':
          description: Lista de bancos con capacidades
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 18
                  engine:
                    type: string
                    example: pycobranca
                  bancos:
                    type: array
                    items:
                      $ref: '#/components/schemas/BancoInfo'
  /api/boleto/validate:
    get:
      tags:
      - Boleto
      summary: Validar los datos del boleto
      description: 'Valida los datos sin generar el archivo. En error devuelve **400** con

        `validation_errors` — una **lista**, un ítem por campo violado.

        Reglas por banco (tipos/tamaños/carteras/especiales) en

        [validacao-campos.md](https://github.com/Maxwbh/cobranca-api/blob/main/docs/api/validacao-campos.md).

        '
      operationId: validateBoleto
      parameters:
      - name: bank
        in: query
        required: true
        description: Código del banco
        schema:
          $ref: '#/components/schemas/BankCode'
      - name: data
        in: query
        required: true
        description: 'Datos del título en JSON, URL-encoded — los campos del schema

          `BoletoData`. Un campo fuera de él responde `400` nombrando el campo.

          '
        schema:
          type: string
          format: json
        example: '{"valor":150.0,"cedente":"Empresa Teste LTDA","documento_cedente":"11222333000181","sacado":"João
          da Silva","sacado_documento":"52998224725","agencia":"3073","conta_corrente":"12345678","convenio":"1234567","carteira":"18","nosso_numero":"123","data_vencimento":"2027-12-30"}'
      responses:
        '200':
          description: Datos válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationSuccess'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/boleto/data:
    get:
      tags:
      - Boleto
      summary: Obtener los datos calculados del boleto
      description: 'Devuelve todos los datos calculados del boleto sin generar el archivo,

        incluyendo código de barras, línea digitable y nosso número formateado.

        '
      operationId: getBoletoData
      parameters:
      - name: bank
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/BankCode'
      - name: data
        in: query
        required: true
        description: 'Datos del título en JSON, URL-encoded — los campos del schema

          `BoletoData`. Un campo fuera de él responde `400` nombrando el campo.

          '
        schema:
          type: string
          format: json
        example: '{"valor":150.0,"cedente":"Empresa Teste LTDA","documento_cedente":"11222333000181","sacado":"João
          da Silva","sacado_documento":"52998224725","agencia":"3073","conta_corrente":"12345678","convenio":"1234567","carteira":"18","nosso_numero":"123","data_vencimento":"2027-12-30"}'
      responses:
        '200':
          description: Datos del boleto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoletoResponse'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/boleto/nosso_numero:
    get:
      tags:
      - Boleto
      summary: Generar nosso número
      description: Genera solo el nosso número y los campos relacionados
      operationId: getNossoNumero
      parameters:
      - name: bank
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/BankCode'
      - name: data
        in: query
        required: true
        schema:
          type: string
          format: json
      responses:
        '200':
          description: Nosso número generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NossoNumeroResponse'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/boleto:
    get:
      tags:
      - Boleto
      summary: Generar boleto · 📄 respuesta binaria + headers X-*
      description: Genera el boleto en PDF (engine pyCobranca)
      operationId: generateBoleto
      parameters:
      - name: bank
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/BankCode'
      - name: type
        in: query
        required: true
        description: Formato de salida
        schema:
          $ref: '#/components/schemas/OutputType'
      - name: data
        in: query
        required: true
        description: 'Datos del título en JSON, URL-encoded — los campos del schema

          `BoletoData`. Un campo fuera de él responde `400` nombrando el campo.

          '
        schema:
          type: string
          format: json
        example: '{"valor":150.0,"cedente":"Empresa Teste LTDA","documento_cedente":"11222333000181","sacado":"João
          da Silva","sacado_documento":"52998224725","agencia":"3073","conta_corrente":"12345678","convenio":"1234567","carteira":"18","nosso_numero":"123","data_vencimento":"2027-12-30"}'
      - name: include_data
        in: query
        required: false
        description: 'Si es `true`, devuelve JSON con todos los datos del boleto + archivo

          en base64 (una sola llamada para PDF + metadatos).

          Si se omite (default), devuelve el binario puro + headers X-*.

          '
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
      - name: template
        in: query
        required: false
        description: 'Modelo visual del PDF. El default es `moderno`, que trae **el logo del

          banco emisor** en el encabezado — vale para todos los bancos con marca

          empaquetada en la engine (Citibank no la tiene, y cae en la sigla). Envíe

          `logo` en `data` para usar su propia imagen.


          `classico` también está disponible en esta ruta. El template `carne`

          (3 vías por A4) vale en `/api/boleto/multi` y `/api/render/carne`.


          La franja de marca opcional se monta a partir de los campos pasados en

          `data` (ver schema `BoletoData`: `logo_empresa`, `cor_marca`,

          `marca_dagua`, `rodape_contato`, `parcela_atual`, `total_parcelas`)

          y **solo existe en el `moderno`** — pedirla con `classico` responde `400`

          en vez de devolver un boleto sin marca alguna.

          '
        schema:
          type: string
          enum:
          - moderno
          - classico
          default: moderno
      responses:
        '200':
          description: 'Sin include_data: archivo binario + headers `X-Nosso-Numero*`.

            Con include_data=true: JSON con los datos + `content_base64`.

            '
          headers:
            X-Nosso-Numero:
              schema:
                type: string
              description: 'Nosso número tal como vino en el payload — la API **no** completa con

                ceros a la izquierda; quien pide `123` recibe `123`. El relleno

                aparece en el formateado.

                '
              example: '123'
            X-Nosso-Numero-Formatado:
              schema:
                type: string
              description: Nosso número formateado (impreso en el boleto).
              example: '12345670000000123'
            X-Nosso-Numero-DV:
              schema:
                type: string
              description: 'Dígito verificador del nosso número, cuando el banco lo calcula por

                separado. Viene **vacío** en los bancos que ya lo embeben en el formateado —

                Banco do Brasil es uno de ellos.

                '
              example: ''
            X-Codigo-Barras:
              schema:
                type: string
              description: Código de barras (44 dígitos).
              example: 00198204100000150000000001234567000000012318
            X-Linha-Digitavel:
              schema:
                type: string
              description: Línea digitable formateada.
              example: 00190.00009 01234.567004 00000.123182 8 20410000015000
            X-Pix-Copia-Cola:
              schema:
                type: string
              description: 'BR Code (EMV) del Bolepix — **solo aparece cuando el payload trae

                `chave_pix`**. El cuerpo de esta respuesta es el PDF, así que este es el

                único camino por donde sale el copia y pega: sin él el QR va

                impreso y no hay texto para mostrar al lado, que es como paga

                quien está en el celular (no se puede escanear la propia pantalla).

                ASCII por especificación del BR Code.

                '
              example: 00020126360014br.gov.bcb.pix01141122233300018152040000530398654061.005802BR5906E
                LTDA6006BRASIL62070503***63048B92
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/BoletoWithFileResponse'
              examples:
                with_include_data:
                  summary: Respuesta con include_data=true
                  value:
                    bank: banco_brasil
                    nosso_numero: '123'
                    nosso_numero_formatado: '12345670000000123'
                    nosso_numero_dv: ''
                    codigo_barras: 00198204100000150000000001234567000000012318
                    linha_digitavel: 00190.00009 01234.567004 00000.123182 8 20410000015000
                    content_base64: JVBERi0xLjQK...
                    content_type: application/pdf
                    filename: boleto-banco_brasil.pdf
        '400':
          description: 'Error de validación. `validation_errors` es siempre una **lista plana**

            de mensajes — nunca un objeto por campo.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Dados do boleto inválidos
                validation_errors:
                - convênio deve ter 4, 6 ou 7 dígitos
                - 'carteira ''18'' não suportada (use uma de: 104, 109, 112, 115, 175, 177, 188)'
                hint: Verifique se todos os campos obrigatórios estão preenchidos
  /api/boleto/multi:
    post:
      tags:
      - Boleto
      summary: Generar múltiples boletos · 📄 respuesta binaria
      description: 'Genera múltiples boletos en un único archivo.


        **Lote resiliente:** la falla de un ítem **no** cancela el lote. El PDF sale

        con los ítems válidos y el resultado por ítem viene en los headers

        `X-Boletos-Info` (ok), `X-Boletos-Errors`, `X-Boletos-Failed` y

        `X-Batch-Status` (`completed` | `partially_completed`). Con

        `include_data=true`, el JSON trae `{status, total, completed, failed,

        boletos, erros}`. **400** solo cuando ningún ítem es válido.


        ⚠️ **Límite**: `LOTE_MAX_ITENS` (default **200**) — por encima de eso responde

        **413**; para lotes mayores use el procesamiento asincrónico

        (ver `docs/development/plano-jobs-lote.md`).

        '
      operationId: generateMultipleBoletos
      parameters:
      - name: type
        in: query
        required: false
        description: Formato de salida (solo `pdf`; cualquier otro responde 400).
        schema:
          $ref: '#/components/schemas/OutputType'
      - name: include_data
        in: query
        required: false
        description: 'Si es `true`, devuelve JSON con los metadatos de cada boleto + el PDF

          combinado en base64. En caso contrario, devuelve el binario + los

          headers `X-Boletos-*`.

          '
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
      - name: template
        in: query
        required: false
        description: 'Modelo visual. Además de `moderno`/`classico`, esta ruta acepta

          `carne` (3 vías por A4) — que `GET /api/boleto` rechaza.

          '
        schema:
          type: string
          enum:
          - moderno
          - classico
          - carne
          default: moderno
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: string
                  format: binary
                  description: 'Archivo JSON con un **array** de boletos — cada ítem tiene los

                    campos del schema `BoletoData` más el `bank`. Otra forma

                    (objeto, texto, número) responde **400** diciendo qué

                    llegó; un identificador repetido responde **422**.

                    '
      responses:
        '200':
          description: 'Sin include_data: archivo binario + headers `X-Boletos-Info` y `X-Boletos-Count`.

            Con include_data=true: JSON con el array `boletos` + `content_base64`.

            '
          headers:
            X-Boletos-Count:
              schema:
                type: integer
              description: 'Boletos **generados** — no el tamaño del lote enviado. En un lote

                de 3 con 1 falla, vale 2 (y `X-Boletos-Failed` vale 1).

                '
              example: 2
            X-Boletos-Info:
              schema:
                type: string
                format: json
              description: 'Array JSON con el registro de cada boleto generado: `item_id`,

                `indice`, `bank`, `status`, `nosso_numero`,

                `nosso_numero_formatado`, `nosso_numero_dv`, `codigo_barras` y

                `linha_digitavel`.

                '
              example: '[{"item_id":"0","indice":0,"bank":"banco_brasil","status":"completed","nosso_numero":"123","nosso_numero_formatado":"12345670000000123","nosso_numero_dv":"","codigo_barras":"...","linha_digitavel":"..."}]'
            X-Boletos-Failed:
              schema:
                type: integer
              description: Cantidad de ítems que fallaron en la validación.
              example: 1
            X-Boletos-Errors:
              schema:
                type: string
                format: json
              description: 'Array JSON con los ítems que fallaron (`item_id`, `indice`,

                `bank`, `status`, `errors`). `[]` cuando no hay fallas.

                '
              example: '[{"item_id":"2","indice":2,"bank":"itau","status":"failed","errors":["conta_corrente
                invalido"]}]'
            X-Batch-Status:
              schema:
                type: string
                enum:
                - completed
                - partially_completed
              description: Resultado global del lote.
              example: partially_completed
            X-Boletos-Info-Truncado:
              schema:
                type: string
                enum:
                - 'true'
              description: 'Presente **solo** cuando `X-Boletos-Info` no cupo en el header y

                se volvió `[]`. El PDF sigue entregándose y los contadores

                (`X-Boletos-Count`, `X-Boletos-Failed`) siguen válidos —

                para el detalle por ítem, use `include_data=true`.


                Por qué existe: el metadato crece ~300 B por boleto (100 ítems

                ≈ 30 KB, 200 ≈ 60 KB). Por encima de ~64 KB el `http.client` de Python

                rechaza la respuesta **entera** y el cliente pierde hasta el PDF.

                Con `LOTE_MAX_ITENS` en el default (200) esto **nunca** se dispara;

                ajuste `HEADER_JSON_MAX_BYTES` (ej.: `6144`) si está detrás de

                nginx (8 KB) o ALB (16 KB).

                '
            X-Boletos-Errors-Truncado:
              schema:
                type: string
                enum:
                - 'true'
              description: 'Lo mismo que `X-Boletos-Info-Truncado`, para `X-Boletos-Errors`.

                '
            X-Boletos-Detalhe:
              schema:
                type: string
              description: Dónde buscar el detalle cuando hubo truncamiento.
              example: use include_data=true (metadados no corpo)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/MultiBoletoResponse'
              examples:
                with_include_data:
                  summary: Respuesta con include_data=true (lote de 3, 1 falla)
                  value:
                    total: 3
                    completed: 2
                    failed: 1
                    status: partially_completed
                    boletos:
                    - item_id: '0'
                      indice: 0
                      bank: banco_brasil
                      status: completed
                      nosso_numero: '123'
                      nosso_numero_formatado: '12345670000000123'
                      nosso_numero_dv: ''
                      codigo_barras: 00198204100000150000000001234567000000012318
                      linha_digitavel: 00190.00009 01234.567004 00000.123182 8 20410000015000
                    - item_id: '1'
                      indice: 1
                      bank: sicoob
                      status: completed
                      nosso_numero: '7890'
                      nosso_numero_formatado: 00078900
                      nosso_numero_dv: ''
                      codigo_barras: '75691204100000250001432701022938500078900001'
                      linha_digitavel: 75691.43279 01022.938508 00789.000015 1 20410000025000
                    erros:
                    - item_id: '2'
