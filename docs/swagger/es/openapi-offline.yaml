        '422':
          $ref: '#/components/responses/LoteDuplicado'
  /api/remessa:
    post:
      tags:
      - Remessa
      summary: Generar archivo de remesa · 📄 archivo CNAB (texto)
      description: 'Genera el archivo de remesa CNAB 240 o 400.

        Con `pix=true`, genera la remesa con segmento PIX (boleto híbrido).


        **El nombre del archivo importa en algunos bancos.** El `Content-Disposition`

        trae el nombre que el BANCO exige cuando el layout lo define — en **Inter**,

        `CI400_001_<sequencial>.REM`, con el mismo secuencial grabado en el header,

        y el Internet Banking rechaza la subida si los dos divergen. En los demás

        sigue el descriptivo (`remessa-<banco>-<tipo>.rem`), que no es exigencia

        de nadie. **Suba el archivo con el nombre que vino en el header.**


        **Cargos por pago** — cada uno es un **trío** código/tipo → valor →

        fecha (la fecha es opcional). Use los nombres exactos; no hay alias:


        | Cargo | Código/tipo | Valor | Fecha |

        |---|---|---|---|

        | Multa | `codigo_multa` (`0` exento, `1` valor fijo, `2` porcentual) | `percentual_multa` · `valor_multa`
        (solo Inter) | `data_multa` |

        | Intereses/Mora | `tipo_mora` (`1` valor/día, `2` tasa mensual %, `3` exento) | `valor_mora`
        (400) · `percentual_mora` (240 e Inter) | `data_mora` |

        | Descuento 1º/2º/3º | `cod_desconto` (`4` = porcentual, solo Inter) | `valor_desconto` · `percentual_desconto`
        (solo Inter) | `data_desconto` … |

        | IOF | — | `valor_iof` | — |

        | Rebaja | — | `valor_abatimento` | — |

        | Protesto | `codigo_protesto` | `dias_protesto` | — |


        > **La unidad (% o R\$) cambia por layout — y la API valida.** En el

        > **CNAB 240** el código/tipo se graba en el archivo, así que el banco sabe la

        > unidad: multa `codigo_multa` (`1` valor fijo, `2` porcentual), mora

        > `tipo_mora` (`1` valor/día, `2` tasa mensual %). En el **CNAB 400** el

        > código **no** se graba — la unidad es fija: multa siempre porcentual,

        > mora siempre valor/día. Por eso, en el 400, `codigo_multa=1`,

        > `tipo_mora=2` y `percentual_mora` solo responden **400** (se

        > cobrarían en la unidad equivocada — R\$ 50 leído como 50%). Los bancos donde la

        > multa va por instrucción (BB e Itaú en el 400) no tienen posición de multa.

        >

        > **Inter (077) es la excepción en los tres ejes.** Su layout tiene los

        > **dos** campos de cada cargo (ítems 10/11, 14/15 y 30/31 del registro

        > tipo 1) y elige por el código, así que `valor_multa`, `percentual_mora` y

        > `percentual_desconto` valen ahí — y **solo ahí**, en el CNAB 400. Medido A/B

        > en todos los layouts: en los otros el campo entra, no se graba y desaparece.

        > Por eso la API rechaza en vez de dejar que el cargo desaparezca; el error dice quién

        > graba el campo.


        📖 **Guía completa con la matriz por banco:** [docs/api/encargos.md](https://github.com/Maxwbh/cobranca-api/blob/main/docs/api/encargos.md)


        > **Un campo no reconocido responde 400** con la pista del trío correcto.

        > Antes se descartaba en silencio: la API devolvía 200 y el archivo iba

        > al banco **sin el cargo pedido**.

        '
      operationId: generateRemessa
      parameters:
      - name: bank
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/BankCode'
      - name: type
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/CnabType'
      - name: pix
        in: query
        required: false
        description: 'Si es `true`, usa la clase PIX del banco para agregar el segmento PIX

          en la remesa CNAB. CNAB 400 PIX: Bradesco, Itaú, C6, Santander.

          CNAB 240 PIX: Sicoob, Caixa, Banco do Brasil.

          '
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: string
                  format: binary
                  description: Archivo JSON con los datos de la remesa y los pagos
            examples:
              c6_cnab400:
                summary: Banco C6 — CNAB 400
                description: 'Use `codigo_beneficiario` (obligatorio). NO enviar `convenio`. Campos del
                  pago: `nome_sacado`, `documento_sacado`, dirección separada.

                  '
                value:
                  data: "{\n  \"empresa_mae\": \"Empresa C6 LTDA\",\n  \"documento_cedente\": \"33445566000186\"\
                    ,\n  \"agencia\": \"0001\",\n  \"conta_corrente\": \"1234567\",\n  \"digito_conta\"\
                    : \"0\",\n  \"carteira\": \"10\",\n  \"codigo_beneficiario\": \"0012345678\",\n  \"\
                    pagamentos\": [{\n    \"nosso_numero\": \"12345678\",\n    \"data_vencimento\": \"\
                    2026/12/31\",\n    \"valor\": 1500.00,\n    \"nome_sacado\": \"Joao da Silva\",\n\
                    \    \"documento_sacado\": \"12345678909\",\n    \"endereco_sacado\": \"Rua Teste,\
                    \ 100\",\n    \"bairro_sacado\": \"Centro\",\n    \"cep_sacado\": \"01000000\",\n\
                    \    \"cidade_sacado\": \"Sao Paulo\",\n    \"uf_sacado\": \"SP\"\n  }]\n}\n"
              sicoob_cnab240:
                summary: Sicoob — CNAB 240
                description: 'NO enviar `variacao` (campo del boleto, no existe en la remesa CNAB240 Sicoob).

                  '
                value:
                  data: "{\n  \"empresa_mae\": \"Cooperativa Teste\",\n  \"documento_cedente\": \"98765432000198\"\
                    ,\n  \"agencia\": \"4327\",\n  \"conta_corrente\": \"417270\",\n  \"convenio\": \"\
                    229385\",\n  \"carteira\": \"1\",\n  \"pagamentos\": [{\n    \"nosso_numero\": \"\
                    7890\",\n    \"data_vencimento\": \"2026/12/31\",\n    \"valor\": 2500.00,\n    \"\
                    nome_sacado\": \"Maria Santos\",\n    \"documento_sacado\": \"98765432100\",\n   \
                    \ \"endereco_sacado\": \"Av. Principal, 50\",\n    \"bairro_sacado\": \"Centro\",\n\
                    \    \"cep_sacado\": \"20000000\",\n    \"cidade_sacado\": \"Rio de Janeiro\",\n \
                    \   \"uf_sacado\": \"RJ\"\n  }]\n}\n"
      responses:
        '200':
          description: Archivo de remesa generado
          headers:
            X-Remessa-Avisos:
              description: '⚠️ Presente **solo cuando hay aviso** — JSON con lo que el layout

                **no grabó** de lo que usted mandó.


                `carteira` está en la base de toda remesa, pero **ocho layouts no

                tienen ese campo**: CrediSIS y Santander en el CNAB 400, y seis

                de los siete en el 240, donde la FEBRABAN separa el *código de la cartera*

                (posición 58 del segmento P) de la *modalidad* del banco.


                Quien monta la remesa con el mismo diccionario del boleto — el

                camino natural — creía haber elegido la cartera, y el

                archivo salía con la del default. **El archivo está correcto**; lo que

                faltaba era la señal. El aviso nombra el campo que ese layout

                graba de verdad (`codigo_carteira`, `modalidade_carteira`…).

                '
              schema:
                type: string
              example: '[{"aviso": "RemessaSicoob240: `carteira` não é gravada neste layout (use ''modalidade_carteira'')"}]'
          content:
            text/plain:
              schema:
                type: string
                description: Contenido del archivo CNAB
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 'Archivo por encima de `UPLOAD_MAX_BYTES` (default **10 MB**). El tope se

            verifica ANTES de cargar el contenido — sin él, un envío grande

            tumbaba el proceso por memoria antes de cualquier validación.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  campo:
                    type: string
                  recebidos:
                    type: integer
                  hint:
                    type: string
  /api/retorno:
    post:
      tags:
      - Retorno
      summary: Procesar archivo de retorno
      description: 'Hace el parsing del archivo de retorno CNAB 240 o 400.


        El **banco sale del header del archivo**, no del `bank` del request: de él

        dependen el layout y el sentido de cada ocurrencia. Cuando los dos

        discrepan la respuesta es `400` — antes el `bank` era exigido y nunca leído,

        así que subir el retorno del banco equivocado devolvía `200` con campos leídos

        por el layout de otro banco.


        Cada ítem trae `layout_generico`: `true` avisa que la engine no tenía el

        mapa de ese banco y leyó con un layout de reserva.

        '
      operationId: processRetorno
      parameters:
      - name: bank
        in: query
        required: true
        description: 'Banco esperado. Verificado contra el header del archivo; una divergencia

          responde `400` en vez de leer con el layout equivocado.

          '
        schema:
          $ref: '#/components/schemas/BankCode'
      - name: type
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/CnabType'
      - name: formato
        in: query
        required: false
        description: '`json` (default) o `csv`. El CSV trae las **mismas diez columnas** del

          `RetornoItem`, siempre todas — vacías cuando el archivo no trajo el

          campo —, separadas por punto y coma y con coma decimal: se abre

          directo en la planilla. El **encabezado** sale en el idioma de quien llama

          (`Accept-Language: es` o `lang=es`); los **valores**, no — la

          ocurrencia queda en el vocabulario del banco, y las fechas como él las

          grabó.

          '
        schema:
          type: string
          enum:
          - json
          - csv
          default: json
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: string
                  format: binary
                  description: Archivo de retorno CNAB
      responses:
        '200':
          description: Retorno procesado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoResponse'
            text/csv:
              schema:
                type: string
              example: 'Nosso número;Número do documento;Data do crédito;Data da ocorrência;Valor do título;Valor
                pago;Tarifa;Código da ocorrência;Ocorrência;Layout genérico

                00000012345678901;;;150726;1500,00;1500,00;0,00;06;Liquidação normal;não

                '
        '400':
          description: Error de procesamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 'Archivo por encima de `UPLOAD_MAX_BYTES` (default **10 MB**). El tope se

            verifica ANTES de cargar el contenido — sin él, un envío grande

            tumbaba el proceso por memoria antes de cualquier validación.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  campo:
                    type: string
                  recebidos:
                    type: integer
                  hint:
                    type: string
  /api/ofx/parse:
    post:
      tags:
      - OFX
      summary: Parsear archivo OFX (extracto bancario)
      description: 'Parsea el archivo OFX y devuelve JSON estructurado con:

        - Datos del banco (ORG, FID)

        - Datos de la cuenta (sucursal, número, tipo)

        - Período del extracto

        - Saldo

        - Lista de transacciones clasificadas (crédito/débito)

        - Extracción automática de `nosso_numero` del campo memo por banco

        - Resumen con totales de créditos y débitos


        **Recursos:**

        - Soporta OFX v1 (SGML) y v2 (XML)

        - Conversión automática de encoding Latin-1 → UTF-8

        - Extracción por regex para Sicoob, Itaú, Banco do Brasil, Bradesco y Caixa

        - Fallback genérico para otros bancos


        **Filtros opcionales:**

        - `somente_creditos=true`: devuelve solo transacciones de crédito

        '
      operationId: parseOfx
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo OFX (extracto bancario)
                somente_creditos:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  default: 'false'
                  description: Si es 'true', devuelve solo transacciones de crédito
      responses:
        '201':
          description: Archivo OFX parseado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfxResponse'
              example:
                banco:
                  org: ITAU
                  fid: '341'
                conta:
                  agencia: '341'
                  numero: 56789-0
                  tipo: CHECKING
                periodo:
                  inicio: '2025-02-05'
                  fim: '2025-02-10'
                saldo:
                  valor: 5230.75
                  data: '2025-02-28'
                transacoes:
                - tipo: credito
                  valor: 150.0
                  data: '2025-02-05'
                  memo: PAGTO BOLETO 01234567000000123
                  nosso_numero: '000000123'
                resumo:
                  total_creditos: 150.0
                  total_debitos: 0.0
                  quantidade: 1
        '400':
          description: Archivo OFX inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfxError'
        '413':
          description: 'Archivo por encima de `UPLOAD_MAX_BYTES` (default **10 MB**). El tope se

            verifica ANTES de cargar el contenido — sin él, un envío grande

            tumbaba el proceso por memoria antes de cualquier validación.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  campo:
                    type: string
                  recebidos:
                    type: integer
                  hint:
                    type: string
  /api/render/boleto:
    post:
      tags:
      - Render
      summary: Renderizar boleto (datos + PDF base64)
      description: 'Registra/calcula los datos del boleto (línea digitable, código de barras,

        nosso número) y devuelve el PDF en base64. Cuerpo JSON, renderizado

        in-process por la engine pyCobrança. Consumido por el provider offline del gateway.

        '
      operationId: renderBoleto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bank
              - data
              properties:
                bank:
                  type: string
                  example: itau
                data:
                  allOf:
                  - $ref: '#/components/schemas/BoletoData'
                  description: 'Datos del título. Un campo fuera de este schema responde `400`

                    nombrando el campo y sugiriendo el parecido.


                    ⚠️ La franja FEBRABAN (`desconto_abatimento`,

                    `outras_deducoes`, `mora_multa`, `outros_acrescimos`,

                    `valor_cobrado`) es **aceptada y no enviada al boleto** — sale

                    en blanco en el PDF, porque depende de la fecha del pago. La

                    regla va en `instrucoes` y el valor en la remesa CNAB.

                    '
                template:
                  type: string
                  enum:
                  - moderno
                  - classico
                  default: moderno
                  description: Modelo visual. El default `moderno` trae el logo del banco emisor en el
                    encabezado.
            example:
              bank: banco_brasil
              template: moderno
              data:
                agencia: '3073'
                conta_corrente: '12345678'
                convenio: '1234567'
                carteira: '18'
                nosso_numero: '1042'
                numero_documento: NF-2027-0042
                valor: 1279.5
                data_vencimento: '2027-09-10'
                cedente: Empresa Exemplo Servicos LTDA
                documento_cedente: '11222333000181'
                sacado: Maria Aparecida de Souza
                sacado_documento: '52998224725'
                sacado_endereco: Rua Presidente Kennedy, 126A, Canaa, Sete Lagoas, MG, CEP 35701206
                instrucoes:
                - Apos o vencimento, multa de 2% e juros de 1% ao mes.
                - Nao receber apos 30 dias; decorrido o prazo, protestar.
                chave_pix: '11222333000181'
                logo_empresa: EXEMPLO
                cor_marca: 1B4F8A
                rodape_contato: financeiro@exemplo.com.br - (31) 3333-0000
      responses:
        '200':
          description: Boleto renderizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  nosso_numero:
                    type: string
                    example: '00000001'
                  linha_digitavel:
                    type: string
                  codigo_barras:
                    type: string
                  pix_copia_cola:
                    type: string
                    nullable: true
                    description: 'BR Code del QR dibujado en el PDF; `null` cuando el boleto no

                      tiene PIX. Sin él el QR sale en el papel y la integración no tiene el

                      texto para mostrar al lado.

                      '
                  pix_vinculado:
                    type: boolean
                    nullable: true
                    description: '¿El QR **liquida el título**? `true` = Bolepix (vino del banco,

                      en `data.pix_copia_cola`); `false` = QR **suelto**, montado

                      de `data.chave_pix`, que acredita la clave y deja el título

                      **en abierto**; `null` = boleto sin PIX.

                      '
                  pdf_base64:
                    type: string
                    description: PDF en base64
        '400':
          description: Datos del boleto inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/render/carne:
    post:
      tags:
