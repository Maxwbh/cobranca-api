        '413':
          description: 'Lote por encima del límite `LOTE_MAX_ITENS` (default **200**), o archivo

            por encima de `UPLOAD_MAX_BYTES` (default **10 MB**). El tope de bytes se

            verifica ANTES de cargar el contenido.

            Para volúmenes mayores, use el procesamiento asincrónico

            (`POST /jobs/boletos`, en el gateway).

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Lote acima do limite de 200 itens
                  recebidos:
