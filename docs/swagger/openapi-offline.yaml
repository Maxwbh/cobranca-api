openapi: 3.0.3
info:
  title: Cobranca-API — Offline (engine pyCobranca)
  description: |
    Superfície **offline** da plataforma **Cobranca-API** (serviço único **100% Python**):
    geração de boletos bancários brasileiros, arquivos CNAB e parsing de extratos OFX —
    servida **nativamente** pela engine [pyCobrança](https://github.com/Maxwbh/pyCobranca)
    dentro do próprio processo FastAPI (sem sidecar, sem proxy).

    > **Nota de versão (v2.0.0):** os contratos desta superfície (paths, campos,
    > headers `X-*`) permanecem compatíveis com a v1.x. A única mudança de escopo é
    > o formato de saída: a engine emite **PDF** — `jpg`/`png`/`tif` respondem
    > **400**.

    ## Offline (`/api/*`) × Gateway (raiz) — quando usar cada um

    | | **Offline (esta doc)** | **Gateway REST** ([Swagger `/docs`](./index.html)) |
    |---|---|---|
    | O que faz | GERA o documento (boleto/CNAB) localmente | REGISTRA a cobrança na API online do banco (C6, Sicoob, Inter, Itaú) |
    | Boleto | Não registrado (o banco só conhece no pagamento) | **Registrado** (CIP, em tempo real) + Pix, Bolepix, webhooks |
    | Autenticação | **Nenhuma** (por design — não toca em banco nem segredo) | Token `bapi_` (`POST /credenciais`) |
    | Conciliação | Retorno CNAB / OFX (arquivos) | Webhooks + consultas online |

    > **Autenticação:** esta superfície não tem `securitySchemes` de propósito.
    > O mecanismo `bapi_` pertence ao gateway e está documentado no
    > [Swagger do gateway](./index.html).

    ## Como testar

    ```bash
    curl {base}/api/health                          # saúde do serviço
    curl -G {base}/api/boleto -o boleto.pdf \
      --data-urlencode 'bank=banco_brasil' --data-urlencode 'type=pdf' \
      --data-urlencode 'data={"valor":150.0,"cedente":"Empresa","documento_cedente":"11222333000181","sacado":"Cliente","sacado_documento":"52998224725","agencia":"3073","conta_corrente":"12345678","convenio":"1234567","carteira":"18","nosso_numero":"123","data_vencimento":"2027-12-30"}'
    ```

    **Links:** [Repositório](https://github.com/Maxwbh/cobranca-api) ·
    [CHANGELOG](https://github.com/Maxwbh/cobranca-api/blob/main/CHANGELOG.md) ·
    [Guias por banco](https://github.com/Maxwbh/cobranca-api/tree/main/docs/development)

    ## Funcionalidades

    - **Boletos**: Geração de boletos em **PDF** — 18 bancos, sem convênio
    - **Remessa**: Geração de arquivos CNAB 240 e 400
    - **Retorno**: Parsing de arquivos de retorno CNAB 240 e 400
    - **OFX**: Parsing de extratos bancários OFX v1 (SGML) e v2 (XML) com extração automática de nosso_numero

    ## Bancos Suportados

    Os 18, como a engine responde hoje. `GET /api/bancos` devolve esta mesma
    matriz por introspecção do código — se as duas discordarem, a resposta
    manda.

    | Banco | Código | Boleto | CNAB 240 | CNAB 400 | PIX na remessa |
    |-------|--------|--------|----------|----------|-----|
    | Banco do Brasil | 001 | ✅ | ✅ | ✅ | ✅ |
    | Banco do Nordeste | 004 | ✅ | — | ✅ | — |
    | Banestes | 021 | ✅ | — | — | — |
    | Santander | 033 | ✅ | ✅ | ✅ | ✅ |
    | Banrisul | 041 | ✅ | — | ✅ | — |
    | BRB — Banco de Brasília | 070 | ✅ | — | ✅ | — |
    | Ailos | 085 | ✅ | ✅ | — | — |
    | CrediSIS | 097 | ✅ | — | ✅ | — |
    | Caixa | 104 | ✅ | ✅ | — | ✅ |
    | Unicred | 136 | ✅ | ✅ | ✅ | — |
    | Bradesco | 237 | ✅ | — | ✅ | ✅ |
    | Banco C6 | 336 | ✅ | — | ✅ | ✅ |
    | Itaú | 341 | ✅ | — | ✅ | ✅ |
    | HSBC | 399 | ✅ | — | — | — |
    | Safra | 422 | ✅ | — | — | — |
    | Citibank | 745 | ✅ | — | ✅ | — |
    | Sicredi | 748 | ✅ | ✅ | — | — |
    | Sicoob | 756 | ✅ | ✅ | ✅ | ✅ |

    Boleto em PDF vale para os 18. As outras três colunas são do **arquivo de
    remessa**: banco sem CNAB aqui emite o boleto, mas não gera remessa por
    esta superfície.

  version: 2.2.0
  contact:
    name: Maxwell da Silva Oliveira — M&S do Brasil LTDA
    email: maxwbh@gmail.com
    # sem www: o www responde 301 para esta forma
    url: https://msbrasil.inf.br
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  # A URL do Render vem do NOME do serviço e muda se ele for renomeado,
  # recriado ou apontado para domínio próprio — por isso é variável de servidor
  # e não host fixo. No Swagger UI, edite o valor antes do "Try it out".
  - url: "{base_url}"
    description: Sua instância do serviço
    variables:
      base_url:
        default: https://cobranca-api-sq67.onrender.com
        description: >-
          Base URL da sua instância. O valor padrão é a demo pública, no plano
          gratuito do Render — hiberna após 15 min e não é ambiente de produção.
  - url: http://localhost:8000
    description: Local — serviço único (docker compose up; FastAPI + pyCobranca)

tags:
  - name: Health
    description: Verificação de saúde da API
  - name: Boleto
    description: Operações com boletos bancários
  - name: Remessa
    description: Geração de arquivos de remessa CNAB
  - name: Retorno
    description: Parsing de arquivos de retorno CNAB
  - name: OFX
    description: |
      Parsing de extratos bancários OFX (v1 SGML e v2 XML) pela engine.
      O `nosso_numero` sai do memo com regra **por banco**, não com regex genérico.
  - name: Render
    description: |
      **USO INTERNO** — renderização com corpo JSON e resposta normalizada,
      consumida pelo próprio gateway (provider offline). Consumidores externos
      devem preferir as rotas de `Boleto`/`Remessa` ou o gateway.

paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Verificar status da API
      description: |
        Sonda de disponibilidade da superfície offline. Responde sem tocar em
        rede, banco ou disco: prova que **o processo está de pé e roteando**, e
        só isso. Não verifica credencial, volume de artefatos nem engine — uma
        sonda que falhasse por problema transitório reiniciaria o container em
        laço, que é pior que o problema que ela detectaria.
      operationId: healthCheck
      responses:
        '200':
          description: API funcionando normalmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: OK
                timestamp: '2026-08-19T05:32:47.446605+00:00'

  /api/info:
    get:
      tags:
        - Health
      summary: Informações da API
      description: Retorna nome, versão, bancos suportados e formatos
      operationId: getInfo
      responses:
        '200':
          description: Informações da API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'

  /api/metadata:
    get:
      tags:
        - Health
      summary: Metadados da API e da engine pyCobrança
      description: |
        Retorna detalhes da API (nome, versão, engine), da engine pyCobrança
        (versão, repositório) e a lista completa de endpoints disponíveis.
      operationId: getMetadata
      responses:
        '200':
          description: Metadados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataResponse'

  /api/bancos:
    get:
      tags:
        - Health
      summary: Lista bancos suportados com capacidades detalhadas
      description: |
        Retorna os 18 bancos suportados, com o código bancário, os layouts CNAB
        de remessa disponíveis e se há remessa com PIX.

        Dados vêm dinamicamente da engine pyCobrança (`Bancos`).
      operationId: listBancos
      responses:
        '200':
          description: Lista de bancos com capacidades
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 18
                  engine:
                    type: string
                    example: pycobranca
                  bancos:
                    type: array
                    items:
                      $ref: '#/components/schemas/BancoInfo'

  /api/boleto/validate:
    get:
      tags:
        - Boleto
      summary: Validar dados do boleto
      description: |
        Valida os dados sem gerar o arquivo. Em erro devolve **400** com
        `validation_errors` — uma **lista**, um item por campo violado.
        Regras por banco (tipos/tamanhos/carteiras/especiais) em
        [validacao-campos.md](https://github.com/Maxwbh/cobranca-api/blob/main/docs/api/validacao-campos.md).
      operationId: validateBoleto
      parameters:
        - name: bank
          in: query
          required: true
          description: Código do banco
          schema:
            $ref: '#/components/schemas/BankCode'
        - name: data
          in: query
          required: true
          description: Dados do boleto em JSON (URL-encoded)
          schema:
            type: string
            format: json
          example: '{"valor":150.0,"cedente":"Empresa Teste LTDA","documento_cedente":"11222333000181","sacado":"João da Silva","sacado_documento":"52998224725","agencia":"3073","conta_corrente":"12345678","convenio":"1234567","carteira":"18","nosso_numero":"123","data_vencimento":"2027-12-30"}'
      responses:
        '200':
          description: Dados válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationSuccess'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/boleto/data:
    get:
      tags:
        - Boleto
      summary: Obter dados calculados do boleto
      description: |
        Retorna todos os dados calculados do boleto sem gerar o arquivo,
        incluindo código de barras, linha digitável e nosso número formatado.
      operationId: getBoletoData
      parameters:
        - name: bank
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/BankCode'
        - name: data
          in: query
          required: true
          description: Dados do boleto em JSON (URL-encoded)
          schema:
            type: string
            format: json
          example: '{"valor":150.0,"cedente":"Empresa Teste LTDA","documento_cedente":"11222333000181","sacado":"João da Silva","sacado_documento":"52998224725","agencia":"3073","conta_corrente":"12345678","convenio":"1234567","carteira":"18","nosso_numero":"123","data_vencimento":"2027-12-30"}'
      responses:
        '200':
          description: Dados do boleto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoletoResponse'
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/boleto/nosso_numero:
    get:
      tags:
        - Boleto
      summary: Gerar nosso número
      description: Gera apenas o nosso número e campos relacionados
      operationId: getNossoNumero
      parameters:
        - name: bank
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/BankCode'
        - name: data
          in: query
          required: true
          schema:
            type: string
            format: json
      responses:
        '200':
          description: Nosso número gerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NossoNumeroResponse'
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/boleto:
    get:
      tags:
        - Boleto
      summary: Gerar boleto · 📄 resposta binária + headers X-*
      description: Gera boleto em PDF (engine pyCobranca)
      operationId: generateBoleto
      parameters:
        - name: bank
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/BankCode'
        - name: type
          in: query
          required: true
          description: Formato de saída
          schema:
            $ref: '#/components/schemas/OutputType'
        - name: data
          in: query
          required: true
          description: Dados do boleto em JSON (URL-encoded)
          schema:
            type: string
            format: json
          example: '{"valor":150.0,"cedente":"Empresa Teste LTDA","documento_cedente":"11222333000181","sacado":"João da Silva","sacado_documento":"52998224725","agencia":"3073","conta_corrente":"12345678","convenio":"1234567","carteira":"18","nosso_numero":"123","data_vencimento":"2027-12-30"}'
        - name: include_data
          in: query
          required: false
          description: |
            Se `true`, retorna JSON com todos os dados do boleto + arquivo
            em base64 (uma única chamada para PDF + metadados).
            Se omitido (padrão), retorna o binário puro + headers X-*.
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
        - name: template
          in: query
          required: false
          description: |
            Modelo visual do PDF. O padrão é `moderno`, que traz **o logo do
            banco emissor** no cabeçalho — vale para todos os bancos com marca
            empacotada na engine (o Citibank não tem, e cai na sigla). Envie
            `logo` em `data` para usar a sua própria imagem.

            `classico` também está disponível nesta rota. O template `carne`
            (3 vias por A4) vale em `/api/boleto/multi` e `/api/render/carne`.

            A faixa de marca opcional é montada a partir dos campos passados em
            `data` (ver schema `BoletoData`: `logo_empresa`, `cor_marca`,
            `marca_dagua`, `rodape_contato`, `parcela_atual`, `total_parcelas`)
            e **só existe no `moderno`** — pedi-la com `classico` responde `400`
            em vez de devolver um boleto sem marca alguma.
          schema:
            type: string
            enum: [moderno, classico]
            default: moderno
      responses:
        '200':
          description: |
            Sem include_data: arquivo binário + headers `X-Nosso-Numero*`.
            Com include_data=true: JSON contendo dados + `content_base64`.
          headers:
            X-Nosso-Numero:
              schema:
                type: string
              description: |
                Nosso número como veio no payload — a API **não** completa com
                zeros à esquerda; quem pede `123` recebe `123`. O preenchimento
                aparece no formatado.
              example: '123'
            X-Nosso-Numero-Formatado:
              schema:
                type: string
              description: Nosso número formatado (impresso no boleto).
              example: '12345670000000123'
            X-Nosso-Numero-DV:
              schema:
                type: string
              description: |
                Dígito verificador do nosso número, quando o banco o calcula à
                parte. Vem **vazio** nos bancos que já o embutem no formatado —
                o Banco do Brasil é um deles.
              example: ''
            X-Codigo-Barras:
              schema:
                type: string
              description: Código de barras (44 dígitos).
              example: '00198204100000150000000001234567000000012318'
            X-Linha-Digitavel:
              schema:
                type: string
              description: Linha digitável formatada.
              example: '00190.00009 01234.567004 00000.123182 8 20410000015000'
            X-Pix-Copia-Cola:
              schema:
                type: string
              description: |
                BR Code (EMV) do Bolepix — **só aparece quando o payload traz
                `chave_pix`**. O corpo desta resposta é o PDF, então este é o
                único caminho por onde o copia-e-cola sai: sem ele o QR vai
                impresso e não há o texto para exibir ao lado, que é como paga
                quem está no celular (não dá para escanear a própria tela).
                ASCII por especificação do BR Code.
              example: '00020126360014br.gov.bcb.pix01141122233300018152040000530398654061.005802BR5906E LTDA6006BRASIL62070503***63048B92'
          content:
            # Só PDF: `jpg`/`png`/`tif` foram descontinuados na v2 e respondem
            # 400 — declará-los aqui prometia um content-type que não existe.
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/BoletoWithFileResponse'
              examples:
                with_include_data:
                  summary: Response com include_data=true
                  value:
                    bank: banco_brasil
                    nosso_numero: '123'
                    nosso_numero_formatado: '12345670000000123'
                    nosso_numero_dv: ''
                    codigo_barras: '00198204100000150000000001234567000000012318'
                    linha_digitavel: '00190.00009 01234.567004 00000.123182 8 20410000015000'
                    content_base64: 'JVBERi0xLjQK...'
                    content_type: application/pdf
                    filename: boleto-banco_brasil.pdf
        '400':
          description: |
            Erro de validação. `validation_errors` é sempre uma **lista plana**
            de mensagens — nunca um objeto por campo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Dados do boleto inválidos
                validation_errors:
                  - "convênio deve ter 4, 6 ou 7 dígitos"
                  - "carteira '18' não suportada (use uma de: 104, 109, 112, 115, 175, 177, 188)"
                hint: Verifique se todos os campos obrigatórios estão preenchidos

  /api/boleto/multi:
    post:
      tags:
        - Boleto
      summary: Gerar múltiplos boletos · 📄 resposta binária
      description: |
        Gera múltiplos boletos em um único arquivo.

        **Lote resiliente:** a falha de um item **não** cancela o lote. O PDF sai
        com os itens válidos e o resultado por item vem nos headers
        `X-Boletos-Info` (ok), `X-Boletos-Errors`, `X-Boletos-Failed` e
        `X-Batch-Status` (`completed` | `partially_completed`). Com
        `include_data=true`, o JSON traz `{status, total, completed, failed,
        boletos, erros}`. **400** só quando nenhum item é válido.

        ⚠️ **Limite**: `LOTE_MAX_ITENS` (default **200**) — acima disso responde
        **413**; para lotes maiores use processamento assíncrono
        (ver `docs/development/plano-jobs-lote.md`).
      operationId: generateMultipleBoletos
      parameters:
        # Query, não campo do formulário: o corpo multipart carrega SÓ o
        # arquivo, como em /api/remessa e /api/retorno. Esta página já disse o
        # contrário, e o efeito era silencioso — `include_data` mandado no
        # formulário era ignorado e a resposta vinha binária.
        - name: type
          in: query
          required: false
          description: Formato de saída (só `pdf`; qualquer outro responde 400).
          schema:
            $ref: '#/components/schemas/OutputType'
        - name: include_data
          in: query
          required: false
          description: |
            Se `true`, retorna JSON com os metadados de cada boleto + o PDF
            combinado em base64. Caso contrário, retorna o binário + os
            headers `X-Boletos-*`.
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
        - name: template
          in: query
          required: false
          description: |
            Modelo visual. Além de `moderno`/`classico`, esta rota aceita
            `carne` (3 vias por A4) — que `GET /api/boleto` recusa.
          schema:
            type: string
            enum: [moderno, classico, carne]
            default: moderno
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: string
                  format: binary
                  description: |
                    Arquivo JSON com um **array** de boletos, cada um com o
                    campo `bank`. Outra forma (objeto, texto, número) responde
                    **400** dizendo o que chegou.
      responses:
        '200':
          description: |
            Sem include_data: arquivo binário + headers `X-Boletos-Info` e `X-Boletos-Count`.
            Com include_data=true: JSON contendo array `boletos` + `content_base64`.
          headers:
            X-Boletos-Count:
              schema:
                type: integer
              description: |
                Boletos **gerados** — não o tamanho do lote enviado. Num lote
                de 3 com 1 falha, vale 2 (e `X-Boletos-Failed` vale 1).
              example: 2
            X-Boletos-Info:
              schema:
                type: string
                format: json
              description: |
                Array JSON com o registro de cada boleto gerado: `item_id`,
                `indice`, `bank`, `status`, `nosso_numero`,
                `nosso_numero_formatado`, `nosso_numero_dv`, `codigo_barras` e
                `linha_digitavel`.
              example: '[{"item_id":"0","indice":0,"bank":"banco_brasil","status":"completed","nosso_numero":"123","nosso_numero_formatado":"12345670000000123","nosso_numero_dv":"","codigo_barras":"...","linha_digitavel":"..."}]'
            X-Boletos-Failed:
              schema:
                type: integer
              description: Quantidade de itens que falharam na validação.
              example: 1
            X-Boletos-Errors:
              schema:
                type: string
                format: json
              description: |
                Array JSON com os itens que falharam (`item_id`, `indice`,
                `bank`, `status`, `errors`). `[]` quando não há falhas.
              example: '[{"item_id":"2","indice":2,"bank":"itau","status":"failed","errors":["conta_corrente invalido"]}]'
            X-Batch-Status:
              schema:
                type: string
                enum: [completed, partially_completed]
              description: Resultado global do lote.
              example: partially_completed
            X-Boletos-Info-Truncado:
              schema:
                type: string
                enum: ['true']
              description: |
                Presente **só** quando `X-Boletos-Info` não coube no header e
                virou `[]`. O PDF continua sendo entregue e os contadores
                (`X-Boletos-Count`, `X-Boletos-Failed`) seguem válidos —
                para o detalhe por item, use `include_data=true`.

                Por que existe: o metadado cresce ~300 B por boleto (100 itens
                ≈ 30 KB, 200 ≈ 60 KB). Acima de ~64 KB o `http.client` do Python
                recusa a resposta **inteira** e o cliente perde até o PDF.
                Com `LOTE_MAX_ITENS` no default (200) isso **nunca** dispara;
                ajuste `HEADER_JSON_MAX_BYTES` (ex.: `6144`) se estiver atrás de
                nginx (8 KB) ou ALB (16 KB).
            X-Boletos-Errors-Truncado:
              schema:
                type: string
                enum: ['true']
              description: |
                O mesmo que `X-Boletos-Info-Truncado`, para `X-Boletos-Errors`.
            X-Boletos-Detalhe:
              schema:
                type: string
              description: Onde buscar o detalhe quando houve truncagem.
              example: use include_data=true (metadados no corpo)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/MultiBoletoResponse'
              examples:
                with_include_data:
                  summary: Response com include_data=true (lote de 3, 1 falha)
                  value:
                    total: 3
                    completed: 2
                    failed: 1
                    status: partially_completed
                    boletos:
                      - item_id: '0'
                        indice: 0
                        bank: banco_brasil
                        status: completed
                        nosso_numero: '123'
                        nosso_numero_formatado: '12345670000000123'
                        nosso_numero_dv: ''
                        codigo_barras: '00198204100000150000000001234567000000012318'
                        linha_digitavel: '00190.00009 01234.567004 00000.123182 8 20410000015000'
                      - item_id: '1'
                        indice: 1
                        bank: sicoob
                        status: completed
                        nosso_numero: '7890'
                        nosso_numero_formatado: '00078900'
                        nosso_numero_dv: ''
                        codigo_barras: '75691204100000250001432701022938500078900001'
                        linha_digitavel: '75691.43279 01022.938508 00789.000015 1 20410000025000'
                    erros:
                      - item_id: '2'
                        indice: 2
                        bank: itau
                        status: failed
                        errors:
                          - "conta deve ter no máximo 5 dígitos"
                    content_base64: 'JVBERi0xLjQK...'
                    content_type: application/pdf
                    filename: boletos-multi.pdf
        '400':
          description: |
            Nenhum item do lote é válido, `data` não é um array de objetos, ou
            `type`/`template` fora dos valores aceitos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: |
            Lote acima do limite `LOTE_MAX_ITENS` (default **200**), ou arquivo
            acima de `UPLOAD_MAX_BYTES` (default **10 MB**). O teto de bytes é
            conferido ANTES de carregar o conteúdo.
            Para volumes maiores, use o processamento assíncrono
            (`POST /jobs/boletos`, no gateway).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Lote acima do limite de 200 itens
                  recebidos:
                    type: integer
                    example: 350
                  hint:
                    type: string
        '422':
          $ref: '#/components/responses/LoteDuplicado'

  /api/remessa:
    post:
      tags:
        - Remessa
      summary: Gerar arquivo de remessa · 📄 arquivo CNAB (texto)
      description: |
        Gera arquivo de remessa CNAB 240 ou 400.
        Com `pix=true`, gera remessa com segmento PIX (boleto híbrido).

        **Encargos por pagamento** — cada um é um **trio** código/tipo → valor →
        data (a data é opcional). Use os nomes exatos; não há apelido:

        | Encargo | Código/tipo | Valor | Data |
        |---|---|---|---|
        | Multa | `codigo_multa` (`0` isento, `1` valor fixo, `2` percentual) | `percentual_multa` | `data_multa` |
        | Juros/Mora | `tipo_mora` (`1` valor/dia, `2` taxa mensal %, `3` isento) | `valor_mora` (400) · `percentual_mora` (240) | `data_mora` |
        | Desconto 1º/2º/3º | `cod_desconto` … | `valor_desconto` … | `data_desconto` … |
        | IOF | — | `valor_iof` | — |
        | Abatimento | — | `valor_abatimento` | — |
        | Protesto | `codigo_protesto` | `dias_protesto` | — |

        > **A unidade (% ou R\$) muda por layout — e a API valida.** No
        > **CNAB 240** o código/tipo é gravado no arquivo, então o banco sabe a
        > unidade: multa `codigo_multa` (`1` valor fixo, `2` percentual), mora
        > `tipo_mora` (`1` valor/dia, `2` taxa mensal %). No **CNAB 400** o
        > código **não** é gravado — a unidade é fixa: multa sempre percentual,
        > mora sempre valor/dia. Por isso, no 400, `codigo_multa=1`,
        > `tipo_mora=2` e `percentual_mora` sozinho respondem **400** (seriam
        > cobrados na unidade errada — R\$ 50 lido como 50%). Bancos onde a
        > multa vai por instrução (BB e Itaú no 400) não têm posição de multa.

        📖 **Guia completo com a matriz por banco:** [docs/api/encargos.md](https://github.com/Maxwbh/cobranca-api/blob/main/docs/api/encargos.md)

        > **Campo não reconhecido responde 400** com a dica do trio correto.
        > Antes era descartado em silêncio: a API devolvia 200 e o arquivo ia
        > para o banco **sem o encargo pedido**.

      operationId: generateRemessa
      parameters:
        - name: bank
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/BankCode'
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CnabType'
        - name: pix
          in: query
          required: false
          description: |
            Se `true`, usa classe PIX do banco para adicionar segmento PIX
            na remessa CNAB. CNAB 400 PIX: Bradesco, Itaú, C6, Santander.
            CNAB 240 PIX: Sicoob, Caixa, Banco do Brasil.
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: string
                  format: binary
                  description: Arquivo JSON com dados da remessa e pagamentos
            examples:
              c6_cnab400:
                summary: Banco C6 — CNAB 400
                description: >
                  Use `codigo_beneficiario` (obrigatório). NÃO enviar `convenio`.
                  Campos do pagamento: `nome_sacado`, `documento_sacado`, endereço separado.
                value:
                  data: |
                    {
                      "empresa_mae": "Empresa C6 LTDA",
                      "documento_cedente": "33445566000186",
                      "agencia": "0001",
                      "conta_corrente": "1234567",
                      "digito_conta": "0",
                      "carteira": "10",
                      "codigo_beneficiario": "0012345678",
                      "pagamentos": [{
                        "nosso_numero": "12345678",
                        "data_vencimento": "2026/12/31",
                        "valor": 1500.00,
                        "nome_sacado": "Joao da Silva",
                        "documento_sacado": "12345678909",
                        "endereco_sacado": "Rua Teste, 100",
                        "bairro_sacado": "Centro",
                        "cep_sacado": "01000000",
                        "cidade_sacado": "Sao Paulo",
                        "uf_sacado": "SP"
                      }]
                    }
              sicoob_cnab240:
                summary: Sicoob — CNAB 240
                description: >
                  NÃO enviar `variacao` (campo do boleto, não existe na remessa CNAB240 Sicoob).
                value:
                  data: |
                    {
                      "empresa_mae": "Cooperativa Teste",
                      "documento_cedente": "98765432000198",
                      "agencia": "4327",
                      "conta_corrente": "417270",
                      "convenio": "229385",
                      "carteira": "1",
                      "pagamentos": [{
                        "nosso_numero": "7890",
                        "data_vencimento": "2026/12/31",
                        "valor": 2500.00,
                        "nome_sacado": "Maria Santos",
                        "documento_sacado": "98765432100",
                        "endereco_sacado": "Av. Principal, 50",
                        "bairro_sacado": "Centro",
                        "cep_sacado": "20000000",
                        "cidade_sacado": "Rio de Janeiro",
                        "uf_sacado": "RJ"
                      }]
                    }
      responses:
        '200':
          description: Arquivo de remessa gerado
          content:
            text/plain:
              schema:
                type: string
                description: Conteúdo do arquivo CNAB
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: |
            Arquivo acima de `UPLOAD_MAX_BYTES` (default **10 MB**). O teto é
            conferido ANTES de carregar o conteúdo — sem ele, um envio grande
            derrubava o processo por memória antes de qualquer validação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  campo:
                    type: string
                  recebidos:
                    type: integer
                  hint:
                    type: string

  /api/retorno:
    post:
      tags:
        - Retorno
      summary: Processar arquivo de retorno
      description: Faz parsing de arquivo de retorno CNAB 240 ou 400
      operationId: processRetorno
      parameters:
        - name: bank
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/BankCode'
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CnabType'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: string
                  format: binary
                  description: Arquivo de retorno CNAB
      responses:
        '200':
          description: Retorno processado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoResponse'
        '400':
          description: Erro de processamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: |
            Arquivo acima de `UPLOAD_MAX_BYTES` (default **10 MB**). O teto é
            conferido ANTES de carregar o conteúdo — sem ele, um envio grande
            derrubava o processo por memória antes de qualquer validação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  campo:
                    type: string
                  recebidos:
                    type: integer
                  hint:
                    type: string

  /api/ofx/parse:
    post:
      tags:
        - OFX
      summary: Parsear arquivo OFX (extrato bancário)
      description: |
        Parseia arquivo OFX e retorna JSON estruturado com:
        - Dados do banco (ORG, FID)
        - Dados da conta (agência, número, tipo)
        - Período do extrato
        - Saldo
        - Lista de transações classificadas (crédito/débito)
        - Extração automática de `nosso_numero` do campo memo por banco
        - Resumo com totais de créditos e débitos

        **Recursos:**
        - Suporta OFX v1 (SGML) e v2 (XML)
        - Conversão automática de encoding Latin-1 → UTF-8
        - Extração por regex para Sicoob, Itaú, Banco do Brasil, Bradesco e Caixa
        - Fallback genérico para outros bancos

        **Filtros opcionais:**
        - `somente_creditos=true`: retorna apenas transações de crédito
      operationId: parseOfx
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo OFX (extrato bancário)
                somente_creditos:
                  type: string
                  enum: ['true', 'false']
                  default: 'false'
                  description: Se 'true', retorna apenas transações de crédito
      responses:
        '201':
          description: Arquivo OFX parseado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfxResponse'
              example:
                banco: { org: ITAU, fid: '341' }
                conta: { agencia: '341', numero: 56789-0, tipo: CHECKING }
                periodo: { inicio: '2025-02-05', fim: '2025-02-10' }
                saldo: { valor: 5230.75, data: '2025-02-28' }
                transacoes:
                  - tipo: credito
                    valor: 150.0
                    data: '2025-02-05'
                    memo: 'PAGTO BOLETO 01234567000000123'
                    nosso_numero: '000000123'
                resumo: { total_creditos: 150.0, total_debitos: 0.0, quantidade: 1 }
        '400':
          description: Arquivo OFX inválido ou ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfxError'
        '413':
          description: |
            Arquivo acima de `UPLOAD_MAX_BYTES` (default **10 MB**). O teto é
            conferido ANTES de carregar o conteúdo — sem ele, um envio grande
            derrubava o processo por memória antes de qualquer validação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  campo:
                    type: string
                  recebidos:
                    type: integer
                  hint:
                    type: string

  /api/render/boleto:
    post:
      tags:
        - Render
      summary: Renderizar boleto (dados + PDF base64)
      description: |
        Registra/calcula os dados do boleto (linha digitável, código de barras,
        nosso número) e devolve o PDF em base64. Corpo JSON, renderizado
        in-process pela engine pyCobrança. Consumido pelo provider offline do gateway.
      operationId: renderBoleto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank, data]
              properties:
                bank:
                  type: string
                  example: itau
                data:
                  type: object
                  description: Dados do boleto (mesmos campos de /api/boleto)
                template:
                  type: string
                  enum: [moderno, classico]
                  default: moderno
                  description: >-
                    Modelo visual. O padrão `moderno` traz o logo do banco emissor
                    no cabeçalho.
      responses:
        '200':
          description: Boleto renderizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  nosso_numero: { type: string, example: '00000001' }
                  linha_digitavel: { type: string }
                  codigo_barras: { type: string }
                  pix_copia_cola:
                    type: string
                    nullable: true
                    description: |
                      BR Code do Bolepix quando `data.chave_pix` foi enviado;
                      `null` quando não. Sem ele o QR sai no PDF e a integração
                      não tem o texto para exibir ao lado.
                  pdf_base64: { type: string, description: PDF em base64 }
        '400':
          description: Dados do boleto inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/render/carne:
    post:
      tags:
        - Render
      summary: Renderizar carnê (N boletos) em PDF
      description: |
        Gera o carnê a partir de uma lista de boletos, no layout `carne`
        (3 vias por A4) da engine pyCobrança.

        ⚠️ **Timeout**: carnês com muitas parcelas levam vários segundos —
        timeout do cliente ≥ 60s.
      operationId: renderCarne
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boletos]
              properties:
                bank:
                  type: string
                  description: Banco comum a todos (se cada boleto não trouxer o seu)
                  example: itau
                boletos:
                  type: array
                  items: { type: object }
                  description: |
                    Lista de boletos (cada um com seus dados). Outra forma —
                    ou item que não seja objeto — responde **400** dizendo o
                    que chegou.
                template:
                  type: string
                  enum: [carne]
                  default: carne
      responses:
        '200':
          description: Carnê renderizado
          content:
            application/json:
              schema:
                type: object
                required: [pdf_base64, itens]
                properties:
                  pdf_base64: { type: string, description: PDF do carnê em base64 }
                  itens:
                    type: array
                    description: |
                      Uma entrada **por parcela**, na ordem em que foram
                      enviadas. É com `linha_digitavel` e `nosso_numero` que se
                      registra a cobrança e se concilia o pagamento depois — o
                      PDF sozinho não fecha a integração. `item_id` vem de
                      `external_id`, `seu_numero` ou `numero_documento` e é o
                      que liga a parcela impressa ao registro do cliente.
                    items:
                      allOf:
                        - $ref: '#/components/schemas/BoletoResponse'
                        - type: object
                          properties:
                            item_id: { type: string, example: 'CTR-00' }
                            indice: { type: integer, example: 0 }
                            status:
                              type: string
                              enum: [completed]
        '400':
          description: Falha ao gerar carnê
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: |
            Lote acima do limite `LOTE_MAX_ITENS` (default **200**). O teto é o
            mesmo de `/api/boleto/multi` — as duas rotas renderizam pelo mesmo
            caminho, de forma síncrona.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: Lote acima do limite de 200 itens }
                  recebidos: { type: integer, example: 350 }
                  hint: { type: string }
        '422':
          $ref: '#/components/responses/LoteDuplicado'

  /api/render/fatura:
    post:
      tags:
        - Render
      summary: Renderizar fatura (corpo livre) + boleto em PDF
      description: |
        Gera a **fatura**: um corpo livre no topo da página e o **boleto de
        pagamento** logo abaixo, num único PDF (engine pyCobrança
        `render_fatura_pdf`).

        **Passthrough**: o gateway não soma nem calcula nada — o `valor` do
        boleto e os totais vêm prontos no payload da aplicação. Dois níveis de
        corpo, expressáveis por JSON:
        - **Nível 1 — `itens`**: tabela simples de linhas
          `{descricao, quantidade, valor_unitario}`.
        - **Nível 2 — `fatura.blocos`**: corpo declarativo (blocos `campos`,
          `tabela`, `texto`, `total`, `separador`, `espaco`).

        Precedência do engine: `fatura.blocos` > `itens`. Sem `itens` nem
        `fatura`, o engine devolve o boleto sozinho.

        O **nível 3** (`fatura.desenhar`) é um callback Python e **não** trafega
        por JSON: enviar `fatura.desenhar` retorna **400** (a API recusa em vez
        de repassar um valor inútil ao engine). Para arte livre, chame a engine
        pyCobrança in-process na aplicação.
      operationId: renderFatura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank, data]
              properties:
                bank:
                  type: string
                  example: itau
                data:
                  type: object
                  description: Dados do boleto (mesmos campos de /api/boleto), incluindo o `valor`.
                itens:
                  type: array
                  description: Nível 1 — linhas da fatura (repassadas ao engine).
                  items:
                    type: object
                    required: [descricao]
                    properties:
                      descricao: { type: string, example: Mensalidade — agosto/2026 }
                      quantidade: { type: number, default: 1, example: 2 }
                      valor_unitario: { type: number, example: 199.90 }
                fatura:
                  type: object
                  description: Nível 2 — corpo declarativo (`titulo`, `blocos`), repassado ao engine.
      responses:
        '200':
          description: Fatura renderizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  nosso_numero: { type: string, example: '00000001' }
                  linha_digitavel: { type: string }
                  codigo_barras: { type: string }
                  pix_copia_cola:
                    type: string
                    nullable: true
                    description: |
                      BR Code do Bolepix quando `data.chave_pix` foi enviado;
                      `null` quando não.
                  pdf_base64: { type: string, description: PDF (fatura + boleto) em base64 }
        '400':
          description: Dados do boleto inválidos, ou `fatura.desenhar` (nível 3) enviado via REST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/render/remessa:
    post:
      tags:
        - Render
      summary: Renderizar arquivo de remessa CNAB (texto)
      description: Gera o conteúdo da remessa CNAB 240/400 com corpo JSON.
      operationId: renderRemessa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank, type, data]
              properties:
                bank:
                  type: string
                  example: itau
                type:
                  type: string
                  enum: [cnab400, cnab240]
                data:
                  type: object
                  description: Dados da remessa e pagamentos
                pix:
                  type: boolean
                  default: false
                  description: Segmento PIX (boleto híbrido)
      responses:
        '200':
          description: Remessa gerada
          content:
            application/json:
              schema:
                type: object
                properties:
                  cnab: { type: string, description: Conteúdo do arquivo CNAB }
        '400':
          description: Erro ao gerar remessa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  responses:
    LoteDuplicado:
      description: |
        Dois itens com o mesmo identificador — o `item_id` sai de
        `external_id`, `seu_numero` ou `numero_documento`. É o mesmo título
        emitido duas vezes: o segundo sobrescreve o primeiro e some do lote
        sem aviso, então o lote é recusado inteiro.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: Itens com identificador duplicado no lote }
              hint: { type: string }
              duplicados:
                type: array
                items:
                  type: object
                  properties:
                    item_id: { type: string, example: 'NF-1042' }
                    indices:
                      type: array
                      items: { type: integer }
                      example: [0, 3]

  schemas:
    BankCode:
      type: string
      enum:
        - banco_brasil
        - itau
        - bradesco
        - caixa
        - santander
        - sicoob
        - sicredi
        - banrisul
        - banestes
        - banco_nordeste
        - banco_brasilia
        - banco_c6
        - unicred
        - credisis
        - safra
        - citibank
        - hsbc
        - ailos
      description: Código do banco suportado (18 bancos brasileiros)

    OutputType:
      type: string
      enum:
        - pdf
      default: pdf
      description: |
        Formato de saída do boleto. A engine pyCobrança emite **PDF**;
        `jpg`/`png`/`tif` (v1.x) respondem **400**.

    CnabType:
      type: string
      enum:
        - cnab240
        - cnab400
      description: Tipo de arquivo CNAB

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: ['OK']
          description: |
            **Maiúsculo aqui.** O `GET /health` do gateway responde `"ok"`
            minúsculo — são sondas de superfícies diferentes e os dois formatos
            têm consumidor: este mantém o contrato da v1.x, e o do gateway é o
            que o `examples/oracle/cobranca_api_pkg.sql` compara. Comparando
            exato, use o valor da superfície que você chamou.
          example: OK
        timestamp:
          type: string
          format: date-time
          description: |
            Instante da resposta em ISO 8601, com **offset `+00:00`** e
            microssegundos — não o sufixo `Z`. É o que
            `datetime.now(timezone.utc).isoformat()` produz.
          example: '2026-08-19T05:32:47.446605+00:00'

    InfoResponse:
      type: object
      properties:
        name:
          type: string
          example: Cobranca-API — Offline (pyCobranca)
        version:
          type: string
          description: |
            Versão da **engine pyCobrança** — não a da API. A versão da API
            está em `GET /api/metadata` (`api.version`), e as duas não andam
            juntas.
          example: '1.0.3'
        engine:
          type: string
          example: pycobranca
        supported_banks:
          type: array
          items:
            $ref: '#/components/schemas/BankCode'
        formats:
          type: array
          items:
            $ref: '#/components/schemas/OutputType'
        cnab:
          type: array
          items:
            $ref: '#/components/schemas/CnabType'

    MetadataResponse:
      type: object
      properties:
        api:
          type: object
          properties:
            name:
              type: string
              example: Cobranca-API — Offline (pyCobranca)
            version:
              type: string
              description: Versão da Cobranca-API
              example: '2.2.0'
            engine:
              type: string
              example: python
        pycobranca:
          type: object
          properties:
            version:
              type: string
              example: '1.0.1'
            repository:
              type: string
              example: https://github.com/Maxwbh/pyCobranca
        endpoints:
          type: object
          additionalProperties:
            type: string

    BancoInfo:
      type: object
      description: |
        Capacidades de um banco, extraídas dinamicamente da engine pyCobrança.
      properties:
        slug:
          type: string
          description: Identificador snake_case usado no parâmetro `bank`
          example: banco_brasil
        codigo:
          type: string
          description: Código bancário oficial (COMPE)
          example: '001'
        boleto:
          type: boolean
          description: Emite boleto (PDF)
          example: true
        cnab:
          type: array
          items:
            $ref: '#/components/schemas/CnabType'
          description: Layouts de remessa disponíveis para o banco
          example: ['cnab240', 'cnab400']
        pix_remessa:
          type: boolean
          description: Possui layout de remessa com PIX (Bolepix)
          example: true

    BoletoWithFileResponse:
      type: object
      description: |
        Response retornada quando GET /api/boleto é chamado com `include_data=true`.
        Inclui todos os dados do boleto + arquivo em base64.
      allOf:
        - $ref: '#/components/schemas/BoletoResponse'
        - type: object
          properties:
            content_base64:
              type: string
              format: base64
              description: Conteúdo do arquivo (PDF/JPG/PNG/TIF) em base64
            content_type:
              type: string
              example: application/pdf
            filename:
              type: string
              example: boleto-banco_brasil.pdf

    MultiBoletoResponse:
      type: object
      description: |
        Response retornada quando POST /api/boleto/multi é chamado com `include_data=true`.
      properties:
        total:
          type: integer
          description: Itens **recebidos** no lote (válidos + falhos).
          example: 3
        completed:
          type: integer
          description: Itens que viraram boleto.
          example: 2
        failed:
          type: integer
          description: Itens recusados na validação.
          example: 1
        status:
          type: string
          enum: [completed, partially_completed]
          description: |
            `partially_completed` quando ao menos um item falhou. Lote sem
            nenhum item válido não chega aqui — responde 400.
          example: partially_completed
        boletos:
          type: array
          description: Um registro por item gerado.
          items:
            $ref: '#/components/schemas/BoletoMetadata'
        erros:
          type: array
          description: |
            Um registro por item recusado — o lote não é cancelado por causa
            deles. Mesmo conteúdo do header `X-Boletos-Errors`.
          items:
            $ref: '#/components/schemas/BoletoFalho'
        content_base64:
          type: string
          format: base64
          description: Arquivo combinado (multi-página) em base64
        content_type:
          type: string
          example: application/pdf
        filename:
          type: string
          example: boletos-multi.pdf

    BoletoMetadata:
      type: object
      description: Metadados de um boleto no array `boletos` ou no header `X-Boletos-Info`
      properties:
        item_id:
          type: string
          description: |
            Identificador do item — sai de `external_id`, `seu_numero` ou
            `numero_documento`; na falta dos três, do índice.
          example: '0'
        indice:
          type: integer
          description: Posição no lote enviado.
          example: 0
        status:
          type: string
          enum: [completed]
        bank:
          $ref: '#/components/schemas/BankCode'
        nosso_numero:
          type: string
          example: '123'
        nosso_numero_formatado:
          type: string
          example: '12345670000000123'
        nosso_numero_dv:
          type: string
          example: ''
        codigo_barras:
          type: string
        linha_digitavel:
          type: string

    BoletoFalho:
      type: object
      description: |
        Item recusado no lote, no array `erros` ou no header `X-Boletos-Errors`.
      properties:
        item_id:
          type: string
          example: '2'
        indice:
          type: integer
          example: 2
        bank:
          type: string
          example: itau
        status:
          type: string
          enum: [failed]
        errors:
          type: array
          items:
            type: string
          example: ["conta deve ter no máximo 5 dígitos"]

    BoletoData:
      type: object
      description: |
        Dados do título. `agencia` e `conta_corrente` **não** são obrigatórios
        para todo banco: o Santander identifica o cedente pelo convênio e a
        Caixa pelo código do beneficiário, sem conta no campo livre. Exigi-los
        no schema tornava esses dois inexprimíveis. A obrigatoriedade real é
        **por banco** e sai de `validar()` na engine, com o nome do campo que
        faltou.
      required:
        - nosso_numero
        - valor
        - cedente
        - documento_cedente
        - sacado
        - sacado_documento
      properties:
        agencia:
          type: string
          description: Número da agência (sem dígito)
          example: '3073'
        conta_corrente:
          type: string
          description: Número da conta corrente
          example: '12345678'
        nosso_numero:
          type: string
          description: Nosso número do boleto
          example: '123456789'
        valor:
          type: number
          format: float
          description: Valor do boleto em reais
          example: 1500.00
        cedente:
          type: string
          description: Nome do cedente (beneficiário)
          example: Empresa LTDA
        documento_cedente:
          type: string
          description: CNPJ/CPF do cedente
          example: '12345678000100'
        sacado:
          type: string
          description: Nome do sacado (pagador)
          example: João da Silva
        sacado_documento:
          type: string
          description: CNPJ/CPF do sacado
          example: '12345678900'
        convenio:
          type: string
          description: Número do convênio (quando aplicável)
          example: '01234567'
        carteira:
          type: string
          description: Código da carteira
          example: '18'
        # Campos que entram no CAMPO LIVRE do código de barras ou que o banco
        # exige por regra própria. Omitir um deles no banco que o usa não dá
        # erro: monta um código de barras **diferente**, estruturalmente válido
        # e com destino errado. No Citibank, sem `portfolio`, as três posições
        # saem zeradas e o DV geral muda junto.
        data_documento:
          type: string
          description: |
            Data de emissão do título (`AAAA-MM-DD`). Obrigatória no **Sicredi**,
            que tira dela o ano do nosso número.
          example: '2027-09-10'
        digito_conta:
          type: string
          description: |
            DV da conta, quando o banco o exige à parte. Obrigatório em
            **Unicred**, **Banco do Nordeste**, **Banestes** e **Safra**.
          example: '7'
        digito_agencia:
          type: string
          description: DV da agência. Obrigatório no **Safra**.
          example: '2'
        digito_convenio:
          type: string
          description: DV do convênio, usado na impressão pelo **Banrisul**.
          example: '40'
        variacao:
          type: string
          description: Variação da carteira (**Banestes**, **Sicoob**).
          example: '01'
        incremento:
          type: string
          description: |
            Incremento de 3 posições do campo livre. Obrigatório no **BRB**.
          example: '000'
        portfolio:
          type: string
          description: |
            Portfólio de 3 posições do campo livre (**Citibank**). Sem ele o
            código de barras sai com as três posições zeradas — válido em
            estrutura, errado no destino, e sem erro.
          example: '123'
        posto:
          type: string
          description: Posto da cooperativa (**Sicredi**).
          example: '09'
        byte_idt:
          type: string
          description: |
            Byte identificador do nosso número. Obrigatório no **Sicredi**.
          example: '2'
        data_vencimento:
          type: string
          description: Data de vencimento (YYYY/MM/DD)
          example: '2025/12/31'
        numero_documento:
          type: string
          description: Número do documento
          example: 'NF-2025-001'
        sacado_endereco:
          type: string
          description: Endereço completo do sacado
          example: 'Rua Teste, 100, Centro, São Paulo, SP'
        instrucoes:
          description: |
            Bloco de instruções do beneficiário — **é este o campo que a engine
            desenha**. Aceita lista de linhas ou um texto único com quebras
            (`\n`); as duas formas produzem o mesmo PDF.

            Quantas linhas cabem e que largura cada uma comporta **depende do
            modelo** e de haver Bolepix: a moldura do `moderno` encolhe cerca de
            um quarto com o QR ao lado. O gateway mede o limite na própria
            engine e **recusa** o excedente, com o número exato na mensagem —
            reescrever o texto de um documento de cobrança é do cliente, que
            sabe onde a frase pode ser cortada.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example:
            - Não receber após o vencimento
            - Após o vencimento, multa de 2% e juros de 1% ao mês
        demonstrativo:
          type: string
          description: |
            Texto do demonstrativo, com as mesmas regras de `instrucoes`
            (lista ou texto com quebras, medido e recusado se não couber).
        instrucao1:
          type: string
          description: |
            Primeira linha do bloco de instruções. `instrucao1`..`instrucao6`
            são juntadas em ordem e viram `instrucoes`; enviar as duas formas no
            mesmo payload responde `400`, porque uma delas seria descartada.
          example: Não receber após o vencimento
        instrucao2:
          type: string
          description: Segunda linha do bloco de instruções.
        instrucao3:
          type: string
          description: Terceira linha do bloco de instruções.
        instrucao4:
          type: string
          description: Quarta linha do bloco de instruções.
        instrucao5:
          type: string
          description: Quinta linha do bloco de instruções.
        instrucao6:
          type: string
          description: Sexta linha do bloco de instruções.
        # Bolepix: quem liga o QR é a CHAVE. A engine monta o payload EMV e
        # desenha o QR ela mesma — um EMV pronto não tem por onde entrar.
        emv:
          type: string
          deprecated: true
          description: |
            **Responde 400.** A engine nunca leu este campo: ele existia só no
            schema, herdado da era Ruby, e o boleto saía sem QR com `200`. Use
            `chave_pix`.
        pix_label:
          type: string
          deprecated: true
          description: |
            **Responde 400.** A legenda do QR é do modelo, não do payload.
        chave_pix:
          type: string
          description: |
            Chave PIX do beneficiário (CPF, CNPJ, e-mail, telefone ou
            aleatória). **É o campo que gera o QR** no PDF.

            Só nos sete bancos que a engine sabe fazer Bolepix — Banco do
            Brasil, Bradesco, Caixa, Itaú, Santander, Sicoob e C6. Nos demais
            responde `400` (`banco 041 (Banrisul) não suporta PIX`) em vez de
            imprimir o boleto sem o QR pedido.
          example: '11222333000181'
        tipo_chave_pix:
          type: string
          description: |
            Aceito e **descartado** — a engine deduz o tipo do valor da chave.
            Mantido porque não muda o resultado; não conte com ele voltando.
          enum: ['cpf', 'cnpj', 'email', 'telefone', 'aleatoria']
          example: 'cnpj'
        txid:
          type: string
          description: 'Codigo de identificacao da transacao PIX.'
          example: 'TX20260528001'
        # Faixa de marca. Os campos abaixo só existem no modelo `moderno` — e na
        # `fatura`, que monta o boleto moderno abaixo do corpo. O `classico` e o
        # `carne` não desenham a faixa: pedi-la neles responde 400 em vez de
        # devolver 200 com um boleto sem marca alguma.
        logo_empresa:
          type: string
          description: |
            Faixa de marca — **texto** da marca do cedente, desenhado na faixa
            (não é caminho de arquivo: a engine não lê arquivo do servidor).
            Preenche também o nome da empresa quando este não vier.

            Só no modelo `moderno` e na fatura.
          example: 'LAGOA REAL'
        cor_marca:
          type: string
          description: |
            Faixa de marca — cor em hexadecimal `RRGGBB`, com ou sem `#`. O
            contraste do texto é calculado automaticamente.

            Só no modelo `moderno` e na fatura.
          pattern: '^#?[0-9A-Fa-f]{6}$'
          example: '006B3F'
        marca_dagua:
          type: string
          description: |
            Faixa de marca — texto da marca d'água diagonal antifraude,
            posicionada fora das zonas do código de barras/QR.

            Só no modelo `moderno` e na fatura.
          example: 'CÓPIA - SEM VALOR FISCAL'
        rodape_contato:
          type: string
          description: |
            Faixa de marca — rodapé com o contato da empresa.

            Só no modelo `moderno` e na fatura.
          example: 'Empresa Lagoa Real • (71) 3333-0000'
        fonte_ttf:
          type: string
          deprecated: true
          description: |
            **Responde 400.** Nunca houve suporte — nem aqui, nem na engine, que
            lista o campo entre os que ignora. O PDF é desenhado com as fontes
            padrão do formato (Helvetica), que já cobrem acentuação.
        parcela_atual:
          type: integer
          description: |
            Faixa de marca — número da parcela, no selo "Parcela n/N". Precisa
            vir junto de `total_parcelas`.

            Só no modelo `moderno` e na fatura: o carnê **não** desenha a faixa.
          example: 1
        total_parcelas:
          type: integer
          description: |
            Faixa de marca — total de parcelas, no selo "Parcela n/N".
          example: 12

    # Estes seis campos, e só eles. A página já prometeu `agencia_conta_boleto`,
    # `numero_documento`, `valor_documento`, `data_vencimento`, `cedente`,
    # `sacado` e `pix` — nenhum existe na resposta: quem os lia recebia
    # `undefined` sem nenhum erro para investigar. O que a API devolve é o
    # cálculo do boleto; o resto do payload o chamador já tem, porque foi ele
    # quem mandou.
    BoletoResponse:
      type: object
      required: [bank, nosso_numero, nosso_numero_formatado, nosso_numero_dv,
                 codigo_barras, linha_digitavel]
      properties:
        bank:
          type: string
          example: banco_brasil
        nosso_numero:
          type: string
          description: |
            O valor **como veio** no payload — a API não completa com zeros à
            esquerda. O preenchimento aparece no formatado.
          example: '123'
        nosso_numero_formatado:
          type: string
          description: |
            Nosso número IMPRESSO no boleto (com carteira, convênio e/ou DV,
            conforme regra do banco). Usar este campo para exibição e conciliação.
          example: '12345670000000123'
        nosso_numero_dv:
          type: string
          description: |
            Dígito verificador isolado, nos bancos que o calculam à parte.
            **Vazio** quando o banco já o embute no formatado — é o caso do
            Banco do Brasil, e não é erro.
          example: ''
        codigo_barras:
          type: string
          description: Código de barras (44 dígitos)
          example: '00198204100000150000000001234567000000012318'
        linha_digitavel:
          type: string
          description: Linha digitável formatada
          example: '00190.00009 01234.567004 00000.123182 8 20410000015000'
        pix_copia_cola:
          type: string
          nullable: true
          description: |
            BR Code (EMV) do Bolepix, montado pela engine a partir de
            `chave_pix`. **`null` quando o payload não traz chave** — boleto sem
            QR não tem copia-e-cola, e a API não inventa um.

            É o mesmo campo que `POST /cobranca` devolve no caminho `on`
            (C6, Inter, Sicoob). Sem ele, um Bolepix só é pagável por quem
            consegue apontar a câmera para outra tela.
          example: '00020126360014br.gov.bcb.pix01141122233300018152040000530398654061.005802BR5906E LTDA6006BRASIL62070503***63048B92'

    # `/api/boleto/nosso_numero` é o `/api/boleto/data` **sem** o cálculo do
    # código de barras — é para isso que ele existe. O schema prometia
    # exatamente `codigo_barras` e `linha_digitavel`, que a rota não devolve, e
    # omitia `bank` e `nosso_numero_formatado`, que ela devolve.
    NossoNumeroResponse:
      type: object
      required: [bank, nosso_numero, nosso_numero_formatado, nosso_numero_dv]
      properties:
        bank:
          type: string
          example: banco_brasil
        nosso_numero:
          type: string
          example: '123'
        nosso_numero_formatado:
          type: string
          example: '12345670000000123'
        nosso_numero_dv:
          type: string
          description: Vazio nos bancos que embutem o DV no formatado.
          example: ''

    ValidationSuccess:
      type: object
      properties:
        valid:
          type: boolean
          example: true
        message:
          type: string
          example: Dados do boleto são válidos

    ValidationError:
      type: object
      properties:
        valid:
          type: boolean
          example: false
        validation_errors:
          type: array
          description: |
            Lista plana — **um item por campo violado** (contrato da engine
            PyCobrança ≥ 1.0.1, que expõe `BoletoInvalido.erros`). Mapeie cada
            string ao campo do formulário. Nunca é um objeto por chave.
          items:
            type: string
          example:
            - "carteira '999' não suportada (use uma de: 104, 109, 112, 115, 175, 177, 188)"
            - agência deve ter no máximo 4 dígitos
            - conta deve ter no máximo 5 dígitos
        hint:
          type: string
          example: Corrija os erros de validação antes de gerar o boleto

    RemessaRequest:
      type: object
      description: |
        Payload JSON para geração de remessa CNAB.

        > **Atenção:** Os campos vão variar conforme o banco.
        > Ver tabela completa em [docs/fields/all-banks.md](../docs/fields/all-banks.md).
      required:
        - empresa_mae
        - documento_cedente
        - agencia
        - conta_corrente
        - pagamentos
      properties:
        empresa_mae:
          type: string
          description: Nome da empresa cedente
          example: Empresa LTDA
        documento_cedente:
          type: string
          example: '12345678000100'
        agencia:
          type: string
          example: '3073'
        conta_corrente:
          type: string
          example: '12345678'
        digito_conta:
          type: string
          example: '0'
        convenio:
          type: string
          description: |
            Número do convênio (BB, Sicoob, Caixa). NÃO enviar para Banco C6
            (usar `codigo_beneficiario` em vez disso).
          example: '01234567'
        carteira:
          type: string
          example: '18'
        variacao_carteira:
          type: string
          description: |
            Variação da carteira (Banco do Brasil). NÃO confundir com
            o campo `variacao` do **boleto** do Sicoob — este campo
            não existe na classe de remessa CNAB 240 do Sicoob.
          example: '017'
        codigo_beneficiario:
          type: string
          description: |
            Código do cedente/beneficiário. **OBRIGATÓRIO para Banco C6** (CNAB 400).
            Até 10 dígitos, fornecido pelo banco ao cedente.
          example: '0012345678'
        sequencial_remessa:
          type: integer
          example: 1
        pagamentos:
          type: array
          items:
            $ref: '#/components/schemas/Pagamento'

    Pagamento:
      type: object
      description: |
        Um título na remessa CNAB. Os nomes dos campos do sacado seguem a
        convenção da API (`sacado`, `sacado_documento`, `sacado_endereco`…),
        idêntica à do boleto — a API traduz para o layout internamente.

        **Encargos** (multa, juros/mora, desconto, IOF, abatimento) são
        opcionais e seguem o modelo de **trio** código/tipo → valor → data.
        A unidade (% ou R$) e o suporte variam por banco/layout: veja o guia
        [docs/api/encargos.md](https://github.com/Maxwbh/cobranca-api/blob/main/docs/api/encargos.md).
      required:
        - nosso_numero
        - data_vencimento
        - valor
      properties:
        nosso_numero:
          type: string
          example: '123456789'
        numero_documento:
          type: string
          description: Número do documento (máx. 10 no CNAB 400).
          example: 'DOC-2026-001'
        data_vencimento:
          type: string
          format: date
          example: '2027-12-31'
        valor:
          type: number
          format: float
          example: 1500.00
        sacado:
          type: string
          description: Nome do sacado/pagador.
          example: João da Silva
        sacado_documento:
          type: string
          description: CPF/CNPJ do sacado (só dígitos).
          example: '52998224725'
        sacado_endereco:
          type: string
          example: 'Rua Teste, 100'
        sacado_bairro:
          type: string
          example: 'Centro'
        sacado_cidade:
          type: string
          example: 'Sao Paulo'
        sacado_uf:
          type: string
          example: 'SP'
        sacado_cep:
          type: string
          example: '01000000'

        codigo_multa:
          type: string
          description: >-
            Tipo da multa: `0` isento · `1` valor fixo · `2` percentual.
            **No CNAB 400 só `2` é válido** (a multa é sempre percentual).
          enum: ['0', '1', '2']
          example: '2'
        percentual_multa:
          type: number
          format: float
          description: Percentual de multa (quando `codigo_multa=2`).
          example: 2.00
        data_multa:
          type: string
          format: date
          example: '2028-01-01'

        tipo_mora:
          type: string
          description: >-
            Tipo dos juros/mora: `1` valor/dia · `2` taxa mensal % · `3` isento.
            **No CNAB 400 só `1` é válido** (a mora é valor ao dia).
          enum: ['1', '2', '3']
          example: '1'
        valor_mora:
          type: number
          format: float
          description: Juros de mora em R$/dia (CNAB 400, ou 240 com `tipo_mora=1`).
          example: 1.50
        percentual_mora:
          type: number
          format: float
          description: >-
            Juros de mora em % ao mês — **só CNAB 240 com `tipo_mora=2`**.
            No CNAB 400 não tem posição e a API responde **400**.
          example: 1.00
        data_mora:
          type: string
          format: date
          example: '2028-01-01'

        cod_desconto:
          type: string
          description: Tipo do 1º desconto (`0` isento · `1` valor fixo · …).
          example: '1'
        valor_desconto:
          type: number
          format: float
          description: Valor do 1º desconto (R$).
          example: 50.00
        data_desconto:
          type: string
          format: date
          example: '2027-12-20'
        valor_segundo_desconto:
          type: number
          format: float
          description: 2º desconto (R$) — **apenas CNAB 240** (e Santander/Citibank 400).
          example: 30.00
        valor_terceiro_desconto:
          type: number
          format: float
          description: 3º desconto (R$) — **apenas CNAB 240**.
          example: 10.00

        valor_iof:
          type: number
          format: float
          description: IOF em R$.
          example: 3.75
        valor_abatimento:
          type: number
          format: float
          description: Abatimento em R$.
          example: 25.00
        codigo_protesto:
          type: string
          description: Código de protesto (por banco).
          example: '1'
        dias_protesto:
          type: integer
          description: Dias para protesto após o vencimento.
          example: 5

    RetornoResponse:
      type: array
      items:
        $ref: '#/components/schemas/RetornoItem'

    RetornoItem:
      type: object
      description: |
        **Campo sem valor no arquivo não vem na resposta** — a chave é omitida,
        não vem `null`. `numero_documento` e `data_credito` são os que mais
        faltam: em retorno de liquidação simples, nenhum dos dois costuma vir.

        As **datas saem como o banco as escreveu**, sem conversão: `DDMMAA` no
        CNAB 400 (`"150726"` = 15/07/2026) e `DDMMAAAA` no CNAB 240. Não é
        ISO — converta antes de comparar com data do seu sistema.
      properties:
        nosso_numero:
          type: string
          description: Nosso número do título
        numero_documento:
          type: string
          description: Seu número, quando o arquivo o traz.
        data_credito:
          type: string
          description: Data do crédito, no formato do layout (`DDMMAA` / `DDMMAAAA`).
          example: '200726'
        data_ocorrencia:
          type: string
          description: Data da ocorrência, no formato do layout.
          example: '150726'
        valor_titulo:
          type: number
          format: float
        valor_pago:
          type: number
          format: float
        valor_tarifa:
          type: number
          format: float
        codigo_ocorrencia:
          type: string
          description: Código da ocorrência bancária
        motivo_ocorrencia:
          type: string
          description: Descrição da ocorrência

    OfxResponse:
      type: object
      properties:
        banco:
          type: object
          description: Identificação do banco do extrato
          properties:
            org:
              type: string
              description: Organização (ORG do OFX)
              example: SICOOB
            fid:
              type: string
              description: ID do banco (FID do OFX)
              example: '756'
        conta:
          type: object
          description: Dados da conta bancária
          properties:
            agencia:
              type: string
              description: Agência (BANKID do OFX)
              example: '3044'
            numero:
              type: string
              description: Número da conta
              example: '12345-6'
            tipo:
              type: string
              description: Tipo da conta (CHECKING, SAVINGS, etc)
              example: CHECKING
        periodo:
          type: object
          description: Período coberto pelo extrato
          properties:
            inicio:
              type: string
              format: date
              example: '2025-01-01'
            fim:
              type: string
              format: date
              example: '2025-01-31'
        saldo:
          type: object
          properties:
            valor:
              type: number
              format: float
              example: 15420.50
            data:
              type: string
              format: date
              example: '2025-01-31'
        transacoes:
          type: array
          items:
            $ref: '#/components/schemas/OfxTransacao'
        # `total_creditos`/`total_debitos` são SOMAS EM REAIS, não contagens —
        # esta página já disse `integer` com exemplo `28`, e quem conciliava
        # lia R$ 3.750,00 como "28 transações". `soma_creditos`,
        # `soma_debitos` e `total_transacoes` nunca existiram na resposta.
        resumo:
          type: object
          required: [total_creditos, total_debitos, quantidade]
          properties:
            total_creditos:
              type: number
              format: float
              description: Soma dos créditos, em reais.
              example: 3750.00
            total_debitos:
              type: number
              format: float
              description: |
                Soma dos débitos, em reais — sempre positiva. Com
                `somente_creditos=true` vale `0`.
              example: 530.50
            quantidade:
              type: integer
              description: Transações no extrato, depois do filtro.
              example: 4

    OfxTransacao:
      type: object
      description: |
        Seis campos, sempre estes. A página já prometeu `name`, `checknum` e
        `refnum`, que a resposta não traz, e chamava o identificador de
        `fitid` — ele vem em **`id`**, e é por ele que se deduplica ao
        reprocessar o mesmo período.
      required: [tipo, valor, data, memo, id, nosso_numero]
      properties:
        id:
          type: string
          nullable: true
          description: |
            FITID do arquivo — identificador único da transação no extrato.
            `null` quando o arquivo não o traz.
          example: '202501150001'
        tipo:
          type: string
          enum: [credito, debito]
          description: |
            Direção do lançamento, **normalizada** — não é o TRNTYPE cru do
            arquivo. Sai do TRNTYPE e não do sinal, porque a engine devolve
            `valor` sempre positivo.
          example: credito
        data:
          type: string
          format: date
          example: '2025-01-15'
        valor:
          type: number
          format: float
          description: Valor absoluto (sempre positivo — a direção está em `tipo`)
          example: 1250.00
        memo:
          type: string
          description: Descrição da transação
          example: COBRANCA SICOOB 0000012345
        nosso_numero:
          type: string
          nullable: true
          description: Nosso número extraído do memo com a regra do banco emissor
          example: '0000012345'

    OfxError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: |
            Mensagem de erro. `error` é a chave canônica em toda a superfície;
            esta rota respondia só `erro` (em português), que segue presente
            como alias para não quebrar quem já lê por ele.
          example: Arquivo OFX inválido
        erro:
          type: string
          description: Alias de `error` (compatibilidade).
          example: Arquivo OFX inválido
        validation_errors:
          type: array
          description: Detalhe do problema como lista (contrato PyCobrança).
          items:
            type: string

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Mensagem de erro
          example: Dados inválidos
        validation_errors:
          type: array
          description: Lista plana — um item por campo violado (contrato PyCobrança ≥ 1.0.1).
          items:
            type: string
        details:
          type: array
          description: |
            Só em `/api/retorno`, que usa este nome no lugar de
            `validation_errors` — um item por problema do arquivo.
          items:
            type: string
        hint:
          type: string
          description: O que fazer, quando a rota tem o que sugerir.
          example: Verifique se todos os campos obrigatórios estão preenchidos
